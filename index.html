<meta name="apple-mobile-web-app-title" content="大会ベース">

<style>
/* ブランド：大会ベース TAIKAI BASE（ネイビー＋ゴールド） */
:root{
  --ink:#0d1b3d; --paper:#f1f5f9; --line:#dbe2ee; --sub:#6b7280;
  --ok:#1f9d55; --na:#9aa4b2; --warn:#e0930c; --bad:#d6453d;
  --okbg:#e6f4ec; --nabg:#eef1f5; --warnbg:#fdf5e3; --badbg:#fbe7e5;
  --brand:#0d1b3d; --accent:#2148c7; --accent2:#3b6fe0; --accentbg:#e7edfd;
  --gold:#e2b93b; --goldbg:#faf3dd; --purple:#8a5cf0; --amber:#e79c1f;
  --grad:linear-gradient(135deg,#16266b 0%,#2148c7 55%,#3b6fe0 100%);
  --grad-gold:linear-gradient(135deg,#caa233,#f0d178);
  --shadow:0 1px 3px rgba(13,27,61,.07),0 6px 20px rgba(13,27,61,.09);
  --shadow-lg:0 12px 32px rgba(21,38,107,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.5;
  -webkit-text-size-adjust:100%; padding-bottom:40px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
/* 数値欄の上下スピナーを消す（数字が欠けるのを防ぐ） */
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.hidden{display:none !important;}
/* 記入リンク（J）用 */
.callout{background:var(--accentbg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--accent);}
.callout.ok{background:var(--okbg);border-color:#bfe6c9;color:var(--ok);}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--nabg);color:var(--sub);}
.pill.ok{background:var(--okbg);color:var(--ok);}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:5px;}
.linkbtn{background:none;border:none;font-size:13px;color:var(--accent);font-weight:700;cursor:pointer;padding:4px;}

/* ===== ヘッダー ===== */
.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--grad); color:#fff;
  border-bottom:2px solid transparent;
  border-image:var(--grad-gold) 1;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  display:flex; align-items:center; gap:9px;
  box-shadow:0 4px 18px rgba(13,27,61,.28);
}
.topbar .back{
  font-size:14px; padding:6px 10px; margin-left:-4px;
  border-radius:8px; background:rgba(255,255,255,.16); font-weight:600; flex-shrink:0;
}
.topbar .mark{width:26px;height:26px;flex-shrink:0;}
.topbar .ttl{flex:1;min-width:0;}
.topbar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .sub{font-size:11.5px;opacity:.82;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .act{font-size:13px;padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.16);font-weight:600;flex-shrink:0;}

.screen{max-width:640px;margin:0 auto;padding:14px;}
.lead{font-size:13.5px;color:var(--sub);margin:2px 0 14px;}
.brandhero{text-align:center;padding:18px 0 2px;position:relative;}
.brandhero img{width:120px;height:120px;border-radius:28px;box-shadow:var(--shadow-lg);
  position:relative;z-index:1;}
.brandhero::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:190px;height:190px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(59,111,224,.20),rgba(59,111,224,0));z-index:0;}
.brandhero .tag{margin-top:11px;font-size:13.5px;font-weight:800;color:var(--brand);letter-spacing:.03em;}
.brandhero .tag::before,.brandhero .tag::after{content:"";display:inline-block;width:16px;height:2px;
  background:var(--gold);vertical-align:middle;margin:0 8px;}
.block-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:20px 4px 8px;}
.block-label:first-child{margin-top:2px;}

/* ===== カード ===== */
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  transition:box-shadow .18s,transform .18s;}
.card:hover{box-shadow:var(--shadow-lg);}
.pick{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:10px;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  font-size:16px;font-weight:600;transition:transform .08s,border-color .15s;}
.pick:active{transform:scale(.985);border-color:var(--accent);}
.pick .meta{font-size:12px;color:var(--sub);font-weight:500;margin-top:2px;}
.pick .chev{color:#c2cbd6;font-size:20px;flex-shrink:0;transition:transform .15s;}
.team-acc{margin-bottom:10px;}
.team-acc>summary{list-style:none;cursor:pointer;margin-bottom:0;}
.team-acc>summary::-webkit-details-marker{display:none;}
.team-acc[open]>summary{border-radius:14px 14px 0 0;border-bottom-color:transparent;}
.team-acc[open]>summary .chev{transform:rotate(90deg);}
.team-acc .tblwrap{border-top:0;border-radius:0 0 14px 14px;margin-top:-1px;}

.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;flex-shrink:0;white-space:nowrap;}
.badge.live{background:var(--badbg);color:var(--bad);}
.badge.done{background:var(--okbg);color:var(--ok);}
.badge.todo{background:var(--nabg);color:var(--na);}
.badge.soon{background:var(--warnbg);color:#a8700a;}

/* ===== ボタン ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:14px;border-radius:12px;font-size:15.5px;font-weight:700;
  background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(33,72,199,.28);
  transition:transform .08s,box-shadow .15s;}
.btn:active{transform:scale(.985);}
.btn:hover{box-shadow:0 6px 20px rgba(33,72,199,.38);}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
.btn.ghost{background:#fff;color:var(--sub);border:1.5px solid var(--line);}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f0bdb9;}
.btn.gold{background:var(--grad-gold);color:#4a3300;box-shadow:0 4px 14px rgba(202,162,51,.35);}
.btn.sm{padding:9px 14px;font-size:13.5px;width:auto;border-radius:10px;}
.btnrow{display:flex;gap:8px;margin-top:12px;}
.btnrow .btn{flex:1;}

/* ===== ホーム（ワイド・デスクトップ版ダッシュボード） ===== */
.home-full{width:100%;}
.home-top{background:var(--brand);}
.home-top-in{max-width:1240px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 24px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.home-brand{display:flex;align-items:center;gap:10px;min-width:0;}
.home-brand .mark{width:34px;height:34px;flex-shrink:0;}
.home-brand b{display:block;color:#fff;font-size:19px;font-weight:800;letter-spacing:.02em;white-space:nowrap;}
.home-brand small{display:block;color:#a9b6cc;font-size:11px;margin-top:1px;white-space:nowrap;}
.home-actions{display:flex;gap:8px;flex-shrink:0;}
.home-actions .btn{width:auto;}
.home-full .btn{white-space:nowrap;}
.home-full .btn svg{width:16px;height:16px;flex-shrink:0;}

.hero{position:relative;overflow:hidden;
  background:linear-gradient(90deg,#081a33 0%,#12336b 55%,#2148c7 100%);color:#fff;}
.hero-in{max-width:1240px;margin:0 auto;padding:52px 24px 66px;}
.hero h2{margin:0 0 14px;font-size:38px;line-height:1.28;font-weight:800;letter-spacing:.01em;}
.hero p{margin:0 0 22px;font-size:14.5px;line-height:1.85;opacity:.88;max-width:520px;font-weight:500;}
.hero .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0;}
.hero .btnrow .btn{width:auto;flex:none;}

.home-main{max-width:1240px;margin:0 auto;padding:0 24px 40px;}
.home-warn{margin:-40px 0 22px;position:relative;z-index:2;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:-40px 0 22px;position:relative;z-index:2;}
.stat-card{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:12px;}
.stat-ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-ic svg{width:20px;height:20px;}
.stat-ic.c-blue{background:var(--accent);}
.stat-ic.c-green{background:var(--ok);}
.stat-ic.c-gold{background:var(--amber);}
.stat-ic.c-purple{background:var(--purple);}
.stat-txt{min-width:0;display:flex;flex-direction:column;gap:1px;}
.stat-label{font-size:12.5px;color:var(--sub);font-weight:600;}
.stat-value{font-size:26px;font-weight:800;color:var(--ink);line-height:1.15;}
.stat-value small{font-size:12px;font-weight:600;color:var(--sub);margin-left:3px;}

.block-label-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;}
.block-label-row .block-label{margin:0;font-size:16px;}
.link-more{font-size:13px;font-weight:700;color:var(--accent);background:none;border:0;padding:0;}

.main-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start;}
.panel{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:20px;}

.tour-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tcard{background:#fbfcfe;border:1.5px solid var(--line);border-radius:14px;padding:16px;}
.tcard-badges{display:flex;gap:6px;margin-bottom:8px;}
.badge.open{background:var(--accentbg);color:var(--accent);}
.tcard-name{display:block;width:100%;text-align:left;background:none;border:0;padding:0;
  font-size:16px;font-weight:800;color:var(--ink);margin-bottom:3px;}
.tcard-meta{font-size:12px;color:var(--sub);margin-bottom:2px;}
.tcard-period{font-size:12px;color:var(--sub);margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.tcard-period svg{width:13px;height:13px;flex-shrink:0;}
.tstats{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;}
.tstat{display:flex;align-items:center;gap:6px;}
.tstat .tsic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tstat .tsic svg{width:13px;height:13px;}
.tstat .tsic.a{background:var(--accent);}
.tstat .tsic.b{background:var(--ok);}
.tstat .tsic.c{background:var(--bad);}
.tstat b{font-size:13.5px;color:var(--ink);display:block;line-height:1.1;}
.tstat small{font-size:10px;color:var(--sub);display:block;}
.progress-bar{height:7px;border-radius:99px;background:var(--paper);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;}
.tprog-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-bottom:5px;font-weight:600;}
.tprog-row b{color:var(--accent);font-weight:800;}

.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qa-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  background:#fbfcfe;border:1.5px solid var(--line);border-radius:12px;padding:14px;
  text-align:left;transition:transform .08s,box-shadow .15s;}
.qa-tile:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.qa-tile:active{transform:scale(.97);}
.qa-tile .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.qa-tile .ic svg{width:18px;height:18px;}
.qa-tile.c-blue .ic{background:var(--accent);}
.qa-tile.c-green .ic{background:var(--ok);}
.qa-tile.c-gold .ic{background:var(--amber);}
.qa-tile.c-purple .ic{background:var(--purple);}
.qa-tile b{font-size:13.5px;font-weight:800;color:var(--ink);}
.qa-tile small{font-size:11px;color:var(--sub);font-weight:500;line-height:1.4;}

.home-full .block-label{font-size:16px;margin:30px 0 14px;}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.pick-grid .pick{margin-bottom:0;}

.feat-band{background:var(--brand);margin-top:8px;}
.feat-band-in{max-width:1240px;margin:0 auto;padding:28px 24px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.feat-item{color:#fff;display:flex;align-items:flex-start;gap:10px;}
.feat-item .ic{width:34px;height:34px;border-radius:9px;background:rgba(226,185,59,.18);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.feat-item .ic img{width:20px;height:20px;object-fit:contain;display:block;}
.feat-item b{display:block;font-size:13.5px;font-weight:800;margin-bottom:3px;}
.feat-item small{display:block;font-size:11px;opacity:.78;font-weight:500;line-height:1.5;}

@media (max-width:980px){
  .stat-grid{grid-template-columns:1fr 1fr;}
  .main-grid{grid-template-columns:1fr;}
  .feat-band-in{grid-template-columns:1fr 1fr;}
}
@media (max-width:640px){
  .home-top-in,.hero-in,.home-main,.feat-band-in{padding-left:16px;padding-right:16px;}
  .hero h2{font-size:27px;}
  .stat-grid{grid-template-columns:1fr 1fr;margin-top:16px;}
  .tour-cards{grid-template-columns:1fr;}
  .qa-grid{grid-template-columns:1fr 1fr;}
  .feat-band-in{grid-template-columns:1fr;}
  .home-actions .btn span{display:none;}
}

/* ===== フォーム ===== */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 2px 6px;}
label.f:first-child{margin-top:0;}
.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);}
.in:focus{outline:none;border-color:var(--accent2);}
textarea.in{min-height:120px;resize:vertical;line-height:1.7;}
.hint{font-size:12px;color:var(--sub);margin:6px 2px 0;line-height:1.5;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{flex:1;min-width:88px;padding:11px 6px;border-radius:11px;border:2px solid var(--line);
  background:#fbfcfd;color:#5a6573;font-weight:700;font-size:14px;}
.seg button.on{background:var(--accentbg);border-color:var(--accent2);color:var(--accent);}
.row2{display:flex;gap:8px;}
.row2>*{flex:1;min-width:0;}
.pkrow{display:flex;align-items:center;gap:8px;margin:6px 0;}
.pkrow .pkname{flex:0 0 auto;max-width:96px;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pkrow .pkcells{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.pkrow .pkcount{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--accent);}
.pkcell{width:28px;height:28px;border:1.5px solid var(--line);border-radius:7px;background:#fff;
  font-size:14px;font-weight:800;color:var(--na);cursor:pointer;padding:0;line-height:1;}
.pkcell.o{background:var(--accentbg);border-color:var(--accent);color:var(--accent);}
.pkcell.x{background:var(--badbg);border-color:var(--bad);color:var(--bad);}
.ovlock{border:0;margin:0;padding:0;min-width:0;}
.ovlock[disabled]{opacity:.72;}
.lockmsg{background:var(--warnbg);border:1.5px solid #f0d9a0;border-radius:12px;padding:10px 12px;
  font-size:13px;font-weight:600;color:#7a5a10;margin-bottom:12px;}
.ofcard>summary{font-weight:700;font-size:14px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;}
.ofcard>summary::-webkit-details-marker{display:none;}
.ofcard>summary::before{content:"▸";color:var(--accent);font-size:12px;}
.ofcard[open]>summary::before{content:"▾";}
.ofcard[open]>summary{margin-bottom:8px;}

/* ===== タブ ===== */
.tabs{position:sticky;top:0;z-index:40;background:var(--paper);
  display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);
  scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;
  color:var(--sub);background:#fff;border:1.5px solid var(--line);white-space:nowrap;}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(33,72,199,.3);}

/* ===== 大会画面：PC用の左サイドバー（980px以上だけ表示・それ未満は今までどおり上部タブ） =====
   980px以上では「上の青いバーは画面いっぱいの幅・その下に左サイドバー＋右コンテンツ」のアプリらしい骨格にする。
   青いバー・サイドバー・コンテンツをそれぞれ独立してスクロールさせる方式（sticky同士の重なりを避けるため）。 */
.tsidebar{display:none;}
@media (min-width:980px){
  .tourwrap{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .tourwrap > .topbar{position:static;flex:0 0 auto;}   /* 画面いっぱいの幅の固定ヘッダーとして常時表示 */
  .tourwrap > .topbar .back{display:none;}   /* サイドバーに「大会一覧へ」があるので二重にしない */
  .twrap{display:flex;align-items:stretch;flex:1;min-height:0;
    max-width:1320px;margin:0 auto;width:100%;}
  .tsidebar{display:flex;flex-direction:column;flex:0 0 240px;width:240px;height:100%;overflow-y:auto;
    background:#fff;border-right:1.5px solid var(--line);padding:20px 16px;box-sizing:border-box;}
  .tsb-back{align-self:flex-start;background:none;border:0;padding:0;margin-bottom:16px;
    font-size:12.5px;font-weight:700;color:var(--accent);}
  .tsb-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .tsb-head .mark{width:26px;height:26px;flex-shrink:0;margin-top:1px;}
  .tsb-head b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.35;}
  .tsb-head small{display:block;font-size:11px;color:var(--sub);margin-top:3px;line-height:1.4;}
  .tsidebar nav{display:flex;flex-direction:column;gap:2px;}
  .tsidebar nav button{text-align:left;padding:10px 12px;border-radius:9px;font-size:13.5px;
    font-weight:700;color:var(--sub);white-space:normal;}
  .tsidebar nav button:hover{background:var(--paper);color:var(--ink);}
  .tsidebar nav button.on{background:var(--accentbg);color:var(--accent);}
  .tsb-foot{display:flex;flex-direction:column;align-items:flex-start;gap:9px;margin-top:20px;
    padding-top:16px;border-top:1px solid var(--line);}
  .tsb-foot .linkbtn{padding:0;font-size:12.5px;}
  .tsb-foot .linkbtn.on{text-decoration:underline;}
  .tmain{flex:1;min-width:0;height:100%;overflow-y:auto;}
  .tmain > .tabs{display:none;}           /* 横タブはサイドバーのnavに置き換え */
  .tmain > .screen{max-width:900px;padding:24px;}
}

/* ===== 試合カード ===== */
.mcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;
  margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden;}
.mcard .mhead{display:flex;justify-content:space-between;align-items:center;
  padding:7px 13px;background:#f8fafc;border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--sub);font-weight:600;gap:8px;}
.mcard .mno{color:var(--gold);font-weight:800;}
.mcard .mnote{margin:0 13px 10px;padding:7px 10px;background:var(--warnbg);border:1px solid #f0dca8;
  border-radius:8px;font-size:12.5px;color:#8a6206;font-weight:600;line-height:1.5;}
.mcard .mpub{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 13px 10px;}
.mcard .mpub .linkbtn{padding:2px 4px;}
.mcard .mbody{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:12px 13px;gap:10px;width:100%;text-align:left;}
.mcard .side{min-width:0;}
.mcard .tname{font-size:15px;font-weight:700;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;overflow-wrap:anywhere;}
.mcard .side.away{text-align:right;}
.mcard .sc{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
  min-width:64px;flex-shrink:0;text-align:center;letter-spacing:.02em;
  padding:2px 8px;border-radius:9px;background:var(--paper);}
.mcard .sc.pending{font-size:14px;color:var(--na);font-weight:700;letter-spacing:.1em;background:transparent;}
.mcard .pk{font-size:11px;color:var(--sub);font-weight:600;}
.mcard .win{color:var(--accent);}
.mcard .scorers{padding:0 13px 10px;font-size:11.5px;color:var(--sub);line-height:1.6;}
.mcard.editable:active{transform:scale(.99);}

/* ===== 表 ===== */
.tblwrap{overflow-x:auto;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#f8fafc;font-size:11.5px;color:var(--sub);font-weight:700;}
tr:last-child td{border-bottom:none;}
td.nm{text-align:left;font-weight:700;font-size:13.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
td.rk{font-weight:800;color:var(--sub);width:30px;}
tr.adv td.rk{color:var(--accent);}
tr.adv{background:var(--accentbg);}
td.pt{font-weight:800;}
.mtx td{font-size:12px;padding:7px 4px;}
.mtx td.self{background:#eef1f5;}
.mtx .w{color:var(--accent);font-weight:700;}
.mtx .l{color:var(--bad);}

/* ===== トーナメント表 ===== */
.bracket{overflow:auto;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px;}
.brounds{display:flex;gap:0;align-items:stretch;min-width:min-content;}
.bround{display:flex;flex-direction:column;justify-content:space-around;min-width:132px;}
.bround+.bround{margin-left:22px;}
.bm{position:relative;margin:6px 0;}
.bm .slot{border:1.5px solid var(--line);border-radius:8px;background:#fbfcfd;
  padding:5px 8px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:6px;
  white-space:nowrap;overflow:hidden;}
.bm .slot+.slot{margin-top:3px;}
.bm .slot .n{overflow:hidden;text-overflow:ellipsis;}
.bm .slot .s{font-variant-numeric:tabular-nums;color:var(--sub);flex-shrink:0;}
.bm .slot.won{background:var(--accentbg);border-color:var(--accent2);color:var(--accent);}
.bm .slot.tbd{color:var(--na);font-weight:500;}
.bm .lbl{position:absolute;top:-9px;left:6px;font-size:9.5px;background:#fff;padding:0 4px;color:var(--sub);font-weight:700;}
.bm::after{content:"";position:absolute;right:-22px;top:50%;width:22px;height:1.5px;background:var(--line);}
.bround:last-child .bm::after{display:none;}
.bracket.vert .brounds{flex-direction:column-reverse;gap:26px;min-width:0;}
.bracket.vert .bround{flex-direction:row;justify-content:space-around;min-width:0;}
.bracket.vert .bround+.bround{margin-left:0;margin-top:0;}
.bracket.vert .bm{margin:0 6px;min-width:0;display:flex;gap:4px;justify-content:center;}
.bracket.vert .bm::after{right:auto;left:50%;top:-26px;bottom:auto;width:1.5px;height:26px;transform:translateX(-50%);}
.bracket.vert .bm .slot{writing-mode:vertical-rl;min-height:96px;justify-content:space-between;align-items:center;gap:8px;}
.bracket.vert .bm .slot+.slot{margin-top:0;}
.bracket.vert .bm .slot .n{overflow:hidden;}
.bracket.vert .bm .slot .s{writing-mode:horizontal-tb;}
.bmno{font-size:12px;color:var(--sub);}
.bmmatch{padding:8px 0;border-bottom:1px solid var(--line);}
.bmmatch:last-of-type{border-bottom:none;}
.bmmhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.bmvs2{text-align:center;font-size:11px;color:var(--na);margin:4px 0;}
.bmslot{width:100%;}

/* ===== 得点ランキング ===== */
.rank{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:11px 14px;margin-bottom:7px;box-shadow:var(--shadow);}
.rank .no{width:26px;font-size:15px;font-weight:800;color:var(--sub);text-align:center;flex-shrink:0;}
.rank.top .no{color:var(--gold);}
.rank .who{flex:1;min-width:0;}
.rank .who b{font-size:14.5px;}
.rank .who small{display:block;font-size:11.5px;color:var(--sub);}
.rank .ct{font-size:17px;font-weight:800;color:var(--accent);}
.rank .ct small{font-size:11px;font-weight:600;color:var(--sub);margin-left:2px;}

/* ===== 試合入力 ===== */
.scorebox{background:#fff;border:1.5px solid var(--line);border-radius:16px;
  padding:16px 14px;box-shadow:var(--shadow);margin-bottom:14px;}
.scoreline{display:flex;align-items:center;gap:6px;}
.scoreline .team{flex:1;min-width:0;text-align:center;}
.scoreline .team .tn{font-size:15px;font-weight:700;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--accentbg);
  color:var(--accent);font-size:22px;font-weight:800;line-height:1;flex-shrink:0;}
.stepper button:active{transform:scale(.9);}
.stepper .v{font-size:32px;font-weight:800;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;}
.vs{font-size:13px;color:var(--na);font-weight:700;padding:0 2px;}

.evrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;}
.evrow:last-child{border-bottom:none;}
.evrow .evmain{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 2px;border-radius:8px;}
.evrow .evmain:active{background:var(--paper);}
.evrow .ic{width:22px;text-align:center;flex-shrink:0;font-size:15px;}
.evrow .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.evrow .mi{color:var(--sub);font-size:12px;flex-shrink:0;}
.evrow .del{color:var(--bad);font-size:12px;font-weight:700;padding:4px 6px;flex-shrink:0;}

/* ===== モーダル ===== */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,22,35,.45);
  display:flex;align-items:flex-end;justify-content:center;}
.modal .sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow-y:auto;}
.modal h3{margin:0 0 4px;font-size:17px;}
@media(min-width:641px){.modal{align-items:center;}.modal .sheet{border-radius:18px;}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:rgba(23,33,47,.94);color:#fff;padding:11px 20px;border-radius:999px;
  font-size:13.5px;font-weight:600;z-index:200;box-shadow:var(--shadow);}

.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:34px 16px;line-height:1.8;}
.setup-warn{background:var(--warnbg);border:1.5px solid #f0dca8;border-radius:12px;
  padding:12px 14px;font-size:12.5px;color:#8a6206;line-height:1.6;margin-bottom:14px;}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;
  background:#fff;border:1.5px solid var(--line);color:var(--sub);}
.chip.on{background:var(--accentbg);border-color:var(--accent2);color:var(--accent);}

/* ===== 公式記録（A4縦の用紙） ===== */
.sheetbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub);}
.sheetbar button{padding:5px 11px;border-radius:8px;border:1.5px solid var(--line);
  background:#fff;font-size:12px;font-weight:700;color:var(--sub);}
.sheetbar button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.sheetwrap{overflow:auto;padding:12px;background:#e9edf2;}
.sheetscale{margin:0 auto;position:relative;}
.sheet-a4{position:relative;width:595.28pt;height:842pt;background:#fff;
  transform-origin:0 0;box-shadow:0 2px 12px rgba(20,30,50,.18);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;color:#000;}
.sheet-a4 .ln{position:absolute;background:#000;display:block;}
.sheet-a4 .lb{position:absolute;white-space:nowrap;line-height:1;}
.sheet-a4 .lbc{position:absolute;white-space:nowrap;line-height:1;transform:translateX(-50%);text-align:center;}
.sheet-a4 .tot{position:absolute;text-align:center;font-size:16pt;font-weight:700;line-height:1;}
.sheet-a4 .pkmaru{position:absolute;text-align:center;font-weight:700;color:#000;line-height:1;}
.sheet-a4 .fx{position:absolute;border:none;background:transparent;padding:0 1pt;
  text-align:center;line-height:1;color:#000;font-family:inherit;box-sizing:border-box;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:-0.2pt;}
.sheet-a4 .fx.l{text-align:left;}
.sheet-a4 .fx.pickable{cursor:pointer;}
.sheet-a4 .fx.pickable:hover{background:#fffbe9;}
.sheet-a4 .kicklab{overflow:hidden;text-overflow:ellipsis;}
.sheet-a4 .fx:focus{outline:none;background:var(--accentbg);overflow:visible;text-overflow:clip;}
.sheet-a4 .fxw{white-space:normal;word-break:break-word;text-overflow:clip;line-height:1.05;resize:none;
  text-align:center;padding:0 1pt;}
.sheet-a4 .fxw.l{text-align:left;}
/* 一般公開の閲覧専用セル：inputと違い縦方向は自動で中央そろえにならないのでflexで中央そろえにする */
.sheet-a4 .fx-ro{position:absolute;padding:0 1pt;box-sizing:border-box;color:#000;font-family:inherit;
  letter-spacing:-0.2pt;line-height:1.15;
  display:flex;align-items:center;justify-content:center;text-align:center;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.sheet-a4 .fx-ro.l{justify-content:flex-start;text-align:left;}
.sheet-a4 .fx-ro.wrap{white-space:normal;word-break:break-word;line-height:1.05;text-overflow:clip;}

/* ===== メンバー表（編集行） ===== */
.lurow{display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);
  border-radius:11px;padding:7px 9px;margin-bottom:6px;box-shadow:var(--shadow);}
.rolepill{flex-shrink:0;width:62px;padding:7px 4px;border-radius:9px;font-size:12px;font-weight:700;
  border:1.5px solid var(--line);}
.rolepill.rl-start{background:var(--accentbg);border-color:var(--accent2);color:var(--accent);}
.rolepill.rl-sub{background:#fff;color:var(--sub);}
.rolepill.rl-out{background:#f4f6f9;color:#b6bfcc;}

<script>

   ・保存先: Supabase（未設定でも端末内に保存して試せます）
   ・運営は「団体コード＋合言葉」でログイン、閲覧はログイン不要
   ========================================================================== */

/* ---------- 設定 ---------- */
const SUPABASE_URL      = "https://glxszbwsvembyygocekp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdseHN6YndzdmVtYnl5Z29jZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDA5MzEsImV4cCI6MjA5NzE3NjkzMX0.Me73xDBFtOsNZ6ZRZZH8TNeXfwpiYvPBlplh4kRPsds";

try{

/* ---------- 競技の定義 ---------- */
const SPORTS = {
  soccer:{ label:"サッカー",         unit:"点", scorers:true,  cards:true,  pk:true,
           periods:["前半","後半","延長前半","延長後半"] },

           periods:["第1P","第2P","延長"] },
};
const FORMATS = {

  ko:        { label:"トーナメント戦",        hasLeague:false, hasKO:true  },
  league_ko: { label:"予選リーグ＋決勝T",     hasLeague:true,  hasKO:true  },
};
const GROUP_NAMES = "ABCDEFGH".split("");
const CARD_ICON = { yellow:"🟨", red:"🟥", green:"🟩" };
const CARD_LABEL = { yellow:"警告", red:"退場", green:"グリーン" };
/* 得点・交代の時間帯 */
const PERIODS    = { "1H":"前半", "2H":"後半", "1ET":"延長前", "2ET":"延長後", "HT":"HT" };
const PERIOD_REG = ["1H","2H"];      // ふつうの試合
const PERIOD_ET  = ["1ET","2ET"];    // 延長を使う試合だけ

/* ---------- 学年の区分（卒業の判定に使う） ---------- */
const CATEGORIES = {
  elem: { label:"小学生", max:6, suffix:"年" },
  jhs:  { label:"中学生", max:3, suffix:"年" },
  hs:   { label:"高校生", max:3, suffix:"年" },
  univ: { label:"大学生", max:4, suffix:"年" },
  none: { label:"学年なし", max:0, suffix:"" },
};
/* ---------- 大会の規模（全国／都道府県／地域） ---------- */
const SCOPES = {
  national: { label:"全国" },
  pref:     { label:"都道府県" },
  local:    { label:"地域" },
};
const POSITIONS = ["GK","DF","MF","FW"];

/* 日本の年度（4月始まり）。3月31日までは前年の年度 */
function fiscalYear(d){
  d = d || new Date();
  return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1;
}
function gradeLabel(cat, grade){
  const c = CATEGORIES[cat] || CATEGORIES.none;
  if(!c.max || !grade) return "";
  return grade + c.suffix;
}

/* ---------- 小道具 ---------- */
const $ = s=>document.querySelector(s);
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID()
                 : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
                     const r=Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); }));
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = v => { const n = parseInt(v,10); return Number.isFinite(n) ? n : 0; };
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  const w = "日月火水木金土"[d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${w})`;
}
function fmtTime(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* ---------- 状態 ---------- */
const state = {
  view:"home",      // home | login | new | t | match | teams | settings | roster | club
  user:null,        // {id, code}
  list:[],          // 大会一覧
  t:null,           // 表示中の大会
  teams:[],
  matches:[],
  tab:"schedule",
  matchId:null,
  loading:false,
  /* --- 年度をまたいで残る台帳 --- */
  org:null,         // {id, name, year}
  clubs:[],         // チーム台帳
  members:[],       // 選手台帳
  clubId:null,      // 表示中のチーム
  showGrads:false,  // 卒業した選手も表示するか
  official:null,    // 編集中の公式記録
  sheetZoom:0.8,
};
const canEdit = ()=> !!(state.user && state.t && state.t.org_id === state.user.id);
const orgYear = ()=> state.org?.year ?? fiscalYear();

/* ==========================================================================
   保存まわり（Supabase / 端末内）
   ========================================================================== */
const LOCAL_KEY = "taikai_local_v1";
const EMPTY_DB  = { t:[], teams:[], matches:[], clubs:[], members:[], orgs:[], entry:[], clubEntry:[] };
const TBL_KEY   = { gn_tournaments:"t", gn_teams:"teams", gn_matches:"matches",
                    gn_clubs:"clubs", gn_members:"members", gn_orgs:"orgs", gn_entry:"entry" };
const local = {
  read(){ try{ return Object.assign({}, EMPTY_DB, JSON.parse(localStorage.getItem(LOCAL_KEY))||{}); }
          catch(e){ return Object.assign({}, EMPTY_DB); } },
  write(d){ localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); },
};

const DB = {
  online(){ return !!sb; },

  async listTournaments(){
    if(!sb) return local.read().t.slice().sort((a,b)=> (b.created_at||"").localeCompare(a.created_at||""));
    const { data, error } = await sb.from("gn_tournaments").select("*").order("created_at",{ascending:false}).limit(200);
    if(error) throw error;
    return data || [];
  },

  async loadTournament(id){
    if(!sb){
      const d = local.read();
      return {
        t: d.t.find(x=>x.id===id) || null,
        teams: d.teams.filter(x=>x.tournament_id===id),
        matches: d.matches.filter(x=>x.tournament_id===id),
      };
    }
    const [rt, rteams, rmatches] = await Promise.all([
      sb.from("gn_tournaments").select("*").eq("id",id).maybeSingle(),
      sb.from("gn_teams").select("*").eq("tournament_id",id),
      sb.from("gn_matches").select("*").eq("tournament_id",id),
    ]);
    if(rt.error) throw rt.error;
    if(rteams.error) throw rteams.error;
    if(rmatches.error) throw rmatches.error;
    return { t:rt.data, teams:rteams.data||[], matches:rmatches.data||[] };
  },

  /* 公式記録の公開リンク：試合idだけで匿名に読む（大会・チームは所属大会を丸ごと読んで補う＝トーナメント枠の勝者参照も解決できるように） */
  async loadMatchTarget(matchId){
    if(!sb){
      const d = local.read();
      const m = d.matches.find(x=>x.id===matchId) || null;
      if(!m) return { m:null, t:null, teams:[], matches:[] };
      const { t, teams, matches } = await this.loadTournament(m.tournament_id);
      return { m, t, teams, matches };
    }
    const rm = await sb.from("gn_matches").select("*").eq("id",matchId).maybeSingle();
    if(rm.error) throw rm.error;
    const m = rm.data;
    if(!m) return { m:null, t:null, teams:[], matches:[] };
    const { t, teams, matches } = await this.loadTournament(m.tournament_id);
    return { m, t, teams, matches };
  },

  /* --- 台帳（チーム・選手・団体設定）を丸ごと読む --- */
  async loadRoster(orgId){
    if(!sb){
      const d = local.read();
      return { org: d.orgs.find(o=>o.id===orgId) || null,
               clubs: d.clubs.filter(c=>c.org_id===orgId),
               members: d.members.filter(m=>m.org_id===orgId) };
    }
    const [ro, rc, rm] = await Promise.all([
      sb.from("gn_orgs").select("*").eq("id",orgId).maybeSingle(),
      sb.from("gn_clubs").select("*").eq("org_id",orgId),
      sb.from("gn_members").select("*").eq("org_id",orgId),
    ]);
    if(rc.error) throw rc.error;
    if(rm.error) throw rm.error;
    return { org: ro.error ? null : ro.data, clubs: rc.data||[], members: rm.data||[] };
  },

  async upsert(table, rows){
    const arr = Array.isArray(rows) ? rows : [rows];
    if(!arr.length) return;
    if(!sb){
      const key = TBL_KEY[table];
      const d = local.read();
      arr.forEach(r=>{
        const i = d[key].findIndex(x=>x.id===r.id);
        if(i>=0) d[key][i] = {...d[key][i], ...r}; else d[key].push(r);
      });
      local.write(d);
      return;
    }
    const { error } = await sb.from(table).upsert(arr);
    if(error) throw error;
  },

  async remove(table, ids){
    const arr = Array.isArray(ids) ? ids : [ids];
    if(!arr.length) return;
    if(!sb){
      const key = TBL_KEY[table];
      const d = local.read();
      d[key] = d[key].filter(x=>!arr.includes(x.id));
      if(table==="gn_tournaments"){
        d.teams = d.teams.filter(x=>!arr.includes(x.tournament_id));
        d.matches = d.matches.filter(x=>!arr.includes(x.tournament_id));
      }
      if(table==="gn_clubs"){
        d.members = d.members.filter(x=>!arr.includes(x.club_id));
      }
      local.write(d);
      return;
    }
    const { error } = await sb.from(table).delete().in("id", arr);
    if(error) throw error;
  },

  /* --- 記入リンク（要望J）--- */
  // 本部：この大会の記入コード一覧 {team_id:{code,submitted_at}}
  async loadEntries(tournamentId){
    if(!sb){
      const d = local.read();
      const map = {};
      d.entry.filter(e=>e.tournament_id===tournamentId).forEach(e=>map[e.team_id]={code:e.code,submitted_at:e.submitted_at});
      return map;
    }
    const { data, error } = await sb.from("gn_entry").select("team_id,code,submitted_at").eq("tournament_id",tournamentId);
    if(error) throw error;
    const map = {}; (data||[]).forEach(e=>map[e.team_id]={code:e.code,submitted_at:e.submitted_at});
    return map;
  },
  // 本部：コードが無いチームに発行して保存
  async ensureEntries(teams, tournamentId, orgId){
    const map = await this.loadEntries(tournamentId);
    const add = teams.filter(t=>!map[t.id]).map(t=>({
      team_id:t.id, tournament_id:tournamentId, org_id:orgId, code:entryCode(), submitted_at:null }));
    if(add.length){
      if(!sb){ const d=local.read(); d.entry.push(...add); local.write(d); }
      else { const { error } = await sb.from("gn_entry").insert(add); if(error) throw error; }
      add.forEach(e=>map[e.team_id]={code:e.code,submitted_at:null});
    }
    return map;
  },
  // チーム側：記入リンクの対象（チーム＋大会）を匿名で読む
  async loadEntryTarget(teamId){
    if(!sb){
      const d = local.read();
      const team = d.teams.find(x=>x.id===teamId) || null;
      const t = team ? (d.t.find(x=>x.id===team.tournament_id)||null) : null;
      return { team, t };
    }
    const rteam = await sb.from("gn_teams").select("id,tournament_id,name,grp,players").eq("id",teamId).maybeSingle();
    if(rteam.error) throw rteam.error;
    const team = rteam.data;
    let t = null;
    if(team){
      const rt = await sb.from("gn_tournaments").select("*").eq("id",team.tournament_id).maybeSingle();
      if(rt.error) throw rt.error; t = rt.data;
    }
    return { team, t };
  },
  // チーム側：コードを添えて自分の名簿を提出（サーバー側で照合）
  async submitRoster(teamId, code, players){
    if(!sb){
      const d = local.read();
      const e = d.entry.find(x=>x.team_id===teamId && x.code===code);
      if(!e) return false;
      const tm = d.teams.find(x=>x.id===teamId); if(tm){ tm.players = players; }
      e.submitted_at = new Date().toISOString(); local.write(d); return true;
    }
    const { data, error } = await sb.rpc("submit_team_roster", { p_team:teamId, p_code:code, p_players:players });
    if(error) throw error;
    return data === true;
  },

  /* --- 台帳の記入リンク（年度初めの登録） --- */
  // 本部：この団体の台帳記入コード一覧 {club_id:{code,submitted_at}}
  async loadClubEntries(orgId){
    if(!sb){
      const d = local.read(); const map = {};
      d.clubEntry.filter(e=>e.org_id===orgId).forEach(e=>map[e.club_id]={code:e.code,submitted_at:e.submitted_at});
      return map;
    }
    const { data, error } = await sb.from("gn_club_entry").select("club_id,code,submitted_at").eq("org_id",orgId);
    if(error) throw error;
    const map = {}; (data||[]).forEach(e=>map[e.club_id]={code:e.code,submitted_at:e.submitted_at});
    return map;
  },
  // 本部：コードが無いチームに発行して保存
  async ensureClubEntries(clubs, orgId){
    const map = await this.loadClubEntries(orgId);
    const add = clubs.filter(c=>!map[c.id]).map(c=>({ club_id:c.id, org_id:orgId, code:entryCode(), submitted_at:null }));
    if(add.length){
      if(!sb){ const d=local.read(); d.clubEntry.push(...add); local.write(d); }
      else { const { error } = await sb.from("gn_club_entry").insert(add); if(error) throw error; }
      add.forEach(e=>map[e.club_id]={code:e.code,submitted_at:null});
    }
    return map;
  },
  // チーム側：コードを添えてチーム名＋選手を提出（サーバー側で照合）
  async submitClubRoster(clubId, code, o){

      const d = local.read();

      d.members = d.members.filter(m=>!(m.club_id===clubId && m.status==="active"));
      (o.players||[]).forEach((p,i)=> d.members.push({ id:p.id||uid(), org_id:e.org_id, club_id:clubId,
        name:p.name, kana:null, no:p.no??null, pos:p.pos||null, grade:p.grade??null,
        prev_team:p.prev_team||null, status:"active", sort_order:i, note:null }));
      e.submitted_at = new Date().toISOString(); local.write(d); return true;
    }
    const { data, error } = await sb.rpc("submit_club_roster",
      { p_club:clubId, p_code:code, p_name:o.name||null, p_category:o.category||null, p_crest:o.crest??null, p_players:o.players||[] });
    if(error) throw error;
    return data === true;
  },
  // チーム側：コードを添えて「現在の名簿」を読む（新年度の更新用）
  async loadClubRosterByCode(clubId, code){
    if(!sb){
      const d = local.read();
      const e = d.clubEntry.find(x=>x.club_id===clubId && x.code===code);
      if(!e) return null;
      const c = d.clubs.find(x=>x.id===clubId); if(!c) return null;
      const players = d.members.filter(m=>m.club_id===clubId && m.status==="active")
        .sort((a,b)=>(a.no??999)-(b.no??999)||(a.sort_order||0)-(b.sort_order||0))
        .map(m=>({ id:m.id, no:m.no, name:m.name, pos:m.pos, grade:m.grade, prev_team:m.prev_team }));
      return { name:c.name, category:c.category, crest:c.crest||null, players };
    }
    const { data, error } = await sb.rpc("get_club_roster", { p_club:clubId, p_code:code });
    if(error) throw error;
    return data || null;
  },
};

/* 記入コード（紛らわしい文字を避けた6桁） */
function entryCode(){
  const s = "ABCDEFGHJKLMNPRSTUWXYZ2345679";
  let r = ""; for(let i=0;i<6;i++) r += s[Math.floor(Math.random()*s.length)];

/* ==========================================================================
   大会ロジック
   ========================================================================== */
const sportOf = t => SPORTS[t?.sport] || SPORTS.soccer;
const cfgOf   = t => Object.assign({ win:3, draw:1, lose:0, groups:["A"], advance:2,
                                     venues:[], koSize:8, thirdPlace:false, duration:20 }, t?.settings||{});

/* ブロック（部・組）: 新形式 settings.blocks=[{id,name}]。旧 groups(文字)も読めるように */
function blocksOf(t){
  const s = t?.settings || {};
  if(Array.isArray(s.blocks) && s.blocks.length) return s.blocks;
  const gs = Array.isArray(s.groups) ? s.groups : [];
  return gs.map(g=>({ id:g, name:/^[A-H]$/.test(g)? g+"組" : g }));
}
function blockName(t, id){ return (blocksOf(t).find(b=>b.id===id)||{}).name || ""; }

const teamById = id => state.teams.find(t=>t.id===id) || null;
const teamName = id => teamById(id)?.name || "";
function playersOf(teamId){ return (teamById(teamId)?.players)||[]; }
function playerName(teamId, pid){
  const p = playersOf(teamId).find(x=>x.id===pid);
  if(!p) return "選手";
  return (p.no ? `${p.no} ` : "") + p.name;
}
/* この試合の出場選手（メンバー表があれば先発＋控えから、なければ大会登録の選手）。
   side は "H"/"A"。返す id は台帳選手id（イベントの playerId と同じ体系）。 */
function participantsOf(m, side){
  const lu = m.lineups && m.lineups[side];
  const inMatch = lu && Array.isArray(lu.players)
    ? lu.players.filter(p=>p.role==="start"||p.role==="sub")
        .map(p=>({ id:p.pid, no:p.no, name:p.name, pos:p.pos }))
    : [];
  if(inMatch.length) return inMatch;
  const R = resolveSlot(m, side);
  return playersOf(R.id);
}
/* 選手交代用：OUT＝いまピッチにいる選手 / IN＝まだ出ていない控え（交代の履歴を反映）
   excludeIdx＝この交代イベント自身を編集中のとき、その1件を計算から除く（自分がOUT/INした選手も選べるように） */
function subFieldSets(m, side, excludeIdx){
  const lu = m.lineups && m.lineups[side];
  const parts = participantsOf(m, side);
  const hasRoles = lu && Array.isArray(lu.players) && lu.players.some(p=>p.role==="start");
  if(!hasRoles) return { out: parts, in: parts };   // 先発/控えが未設定なら従来どおり全員
  const starters = lu.players.filter(p=>p.role==="start").map(p=>p.pid);
  const onSet = new Set(starters), everOn = new Set(starters);
  (m.events||[]).filter((e,j)=> e.type==="sub" && e.team===side && j!==excludeIdx).forEach(e=>{
    if(e.outId) onSet.delete(e.outId);
    if(e.playerId){ onSet.add(e.playerId); everOn.add(e.playerId); }
  });
  return {
    out: parts.filter(p=> onSet.has(p.id)),     // 今ピッチにいる11人
    in:  parts.filter(p=> !everOn.has(p.id)),   // 一度も出ていない控え
  };
}
/* 得点イベントが「どちらのチームの得点か」（オウンゴールは相手の得点） */
function scoringSideOf(ev){ return ev.type==="og" ? (ev.team==="H"?"A":"H") : ev.team; }
/* この試合のハーフ分数（決勝だけ40分など、大会の既定と違うときは試合ごとに上書きできる） */
function matchHalfMin(m, period){
  const meta = (m && m.lineups && m.lineups._meta) || {};
  const ov = cfgOf(state.t).overview || {};
  if(period==="1ET"||period==="2ET") return meta.etHalfMin!=null ? meta.etHalfMin : (ov.etHalfMin||0);
  return meta.halfMin!=null ? meta.halfMin : (ov.halfMin||0);
}
/* 時間表示：ハーフの分数を超えたら「35+1分」のようなアディショナルタイム表記にする（前後半/延長前後で長さが違う） */
function minuteText(minute, period, m){
  if(minute==null || minute==="") return "";
  const len = matchHalfMin(m, period);
  const n = num(minute);
  if(len && n>len) return `${len}+${n-len}`;
  return String(n);
}
function setMatchHalfMin(key, v){
  const m = curMatch(); if(!m) return;
  m.lineups = m.lineups || {}; m.lineups._meta = m.lineups._meta || {};
  m.lineups._meta[key] = v==="" ? null : Math.max(1, num(v));
}
/* この試合の合計時間（アディショナルタイムは含めない・ノミナルな長さ） */
function matchNominalTotal(m){
  const reg = matchHalfMin(m,"1H")*2;
  const et  = matchETPlayed(m) ? matchHalfMin(m,"1ET")*2 : 0;
  return reg + et;
}
/* 前半0分始まりの通し時間に変換。アディショナルタイム（ハーフ長を超えた分）は加算しない。HTは前半終了時点として扱う */
function nominalMinuteOf(minute, period, m){
  const h1 = matchHalfMin(m,"1H");
  const offsets = { "1H":0, "HT":h1, "2H":h1, "1ET":h1*2, "2ET":h1*2+matchHalfMin(m,"1ET") };
  const per = period || "1H";
  const off = offsets[per] ?? 0;
  if(minute==null) return off;                    // HT交代など「分」未入力
  const len = matchHalfMin(m, per);
  const capped = len ? Math.min(num(minute), len) : num(minute);   // アディショナルタイムは加算しない
  return off + capped;
}
/* この試合でその選手が実際にピッチにいた分数（出場時間）。選手交代の記録から自動計算する */
function computePlayMinutes(m, side, pid){
  if(!pid || !isDone(m)) return 0;
  const lu = m.lineups && m.lineups[side];
  const row = lu && Array.isArray(lu.players) && lu.players.find(p=>p.pid===pid);
  if(!row || row.role==="out") return 0;
  const marks = [];
  if(row.role==="start") marks.push({ t:0, on:true });
  (m.events||[]).filter(e=>e.type==="sub" && e.team===side).forEach(e=>{
    if(e.playerId===pid) marks.push({ t:nominalMinuteOf(e.minute,e.period,m), on:true });
    if(e.outId===pid)    marks.push({ t:nominalMinuteOf(e.minute,e.period,m), on:false });
  });
  if(!marks.length) return 0;                      // 控えのまま一度も出ていない
  marks.sort((a,b)=>a.t-b.t);
  const total = matchNominalTotal(m);
  let onField=false, since=0, sum=0;
  marks.forEach(mk=>{
    if(mk.on && !onField){ onField=true; since=mk.t; }
    else if(!mk.on && onField){ onField=false; sum += Math.max(0, mk.t-since); }
  });
  if(onField) sum += Math.max(0, total-since);
  return sum;
}
/* この選手（チーム内pid）の、大会を通じた合計出場時間（自動計算・分） */
function autoPlayMinutes(teamId, pid){
  if(!pid) return 0;
  let sum = 0;
  state.matches.forEach(m=>{
    ["H","A"].forEach(side=>{
      if(resolveSlot(m, side).id !== teamId) return;
      sum += computePlayMinutes(m, side, pid);
    });
  });
  return sum;
}
/* 時間帯ごとの得点数（side は "H" / "A"） */
function periodScore(m, period, side){
  return (m.events||[]).filter(e=>
    (e.type==="goal"||e.type==="pk"||e.type==="og")
    && (e.period||"1H")===period && scoringSideOf(e)===side).length;
}
/* この試合が延長を使うか（明示フラグ or 延長の得点がある） */
function matchUsesET(m){
  return !!(m.lineups && m.lineups._meta && m.lineups._meta.useET)
    || (m.events||[]).some(e=> e.period==="1ET" || e.period==="2ET")
    || etAppliesToMatch(m);   // 大会概要の「延長：どの試合から」でも自動でON
}
function setMatchET(m, on){
  m.lineups = m.lineups || {};
  m.lineups._meta = m.lineups._meta || {};
  m.lineups._meta.useET = !!on;
}
/* この試合で「実際に延長を行ったか」（明示ONか、延長の得点がある場合だけ。大会設定の対象条件は含めない） */
function matchETPlayed(m){
  return !!(m.lineups && m.lineups._meta && m.lineups._meta.useET)
    || (m.events||[]).some(e=> e.period==="1ET" || e.period==="2ET");
}
/* --- PK戦：1人ずつ 〇×（成功/失敗）を記録する。系列は lineups._meta.pk に持つ --- */
function pkArr(m, side){ return (m.lineups && m.lineups._meta && m.lineups._meta.pk && m.lineups._meta.pk[side]) || []; }
function pkCount(m, side){ return pkArr(m, side).filter(v=>v==="o").length; }
/* この試合で「PK戦を追加」したか（延長と同じ方式。明示ONか、〇×の記録があれば自動でも） */
function matchPKPlayed(m){
  return !!(m.lineups && m.lineups._meta && m.lineups._meta.usePK)
    || pkArr(m,"H").length>0 || pkArr(m,"A").length>0;
}
function toggleUsePK(on){
  const m = curMatch(); if(!m) return;
  if(!on){
    const has = pkArr(m,"H").some(v=>v) || pkArr(m,"A").some(v=>v);
    if(has && !confirm("PK戦の記録が入っています。PK戦をやめると記録も消えます。よろしいですか？")) return;
    m.lineups = m.lineups||{}; m.lineups._meta = m.lineups._meta||{};
    m.lineups._meta.usePK = false;
    m.lineups._meta.pk = { H:[], A:[] };
    m.home_pk = null; m.away_pk = null;
  } else {
    ensurePK(m);
    m.lineups._meta.usePK = true;
  }
  render();
}
function ensurePK(m){
  m.lineups = m.lineups || {};
  m.lineups._meta = m.lineups._meta || {};
  m.lineups._meta.pk = m.lineups._meta.pk || { H:[], A:[] };
  m.lineups._meta.pk.H = m.lineups._meta.pk.H || [];
  m.lineups._meta.pk.A = m.lineups._meta.pk.A || [];
  return m.lineups._meta.pk;
}
function pkKick(side, idx){
  const m = curMatch(); if(!m) return;
  const pk = ensurePK(m), arr = pk[side];
  while(arr.length <= idx) arr.push("");
  arr[idx] = arr[idx]==="" ? "o" : arr[idx]==="o" ? "x" : "";   // 空→〇→×→空
  while(arr.length && arr[arr.length-1]==="") arr.pop();        // 末尾の空を落とす
  const any = pk.H.length || pk.A.length;
  m.home_pk = any ? pkCount(m,"H") : null;                      // 〇の数を勝敗判定用に反映
  m.away_pk = any ? pkCount(m,"A") : null;
  render();
}
function pkRowHTML(m, side, label){
  const arr = pkArr(m, side);
  const n = Math.min(14, Math.max(5, arr.length + 1));           // 入った数＋1（5〜14）
  let cells = "";
  for(let i=0;i<n;i++){
    const v = arr[i] || "";
    const mark = v==="o" ? "〇" : v==="x" ? "×" : String(i+1);
    cells += `<button class="pkcell ${v}" onclick="pkKick('${side}',${i})">${mark}</button>`;
  }
  return `<div class="pkrow">
    <span class="pkname">${esc(label)}</span>
    <span class="pkcells">${cells}</span>
    <span class="pkcount">〇${pkCount(m,side)}</span></div>`;
}
/* このトーナメントの総ラウンド数（実際の櫓の最大round。無ければ koSize から） */
function koTotalRounds(){
  const ko = (state.matches||[]).filter(m=>m.stage==="ko" && m.slot!==99);
  if(ko.length) return Math.max(...ko.map(m=>m.round));
  return Math.round(Math.log2(cfgOf(state.t).koSize||2)) || 1;
}
/* 延長が「この試合」に適用されるか（大会概要の 延長あり＋どの試合から） */
function etAppliesToMatch(m){
  const ov = cfgOf(state.t).overview || {};
  if(!ov.hasET || !m || m.stage!=="ko") return false;   // 延長はトーナメント戦のみ
  const left = koTotalRounds() - m.round;                 // 0=決勝, 1=準決勝, 2=準々決勝 …
  const thr = ({ all:99, qf:2, sf:1, final:0 })[ov.etFrom||"all"];
  return left <= thr;
}
const ET_FROM_LABEL = { all:"全試合", qf:"準々決勝から", sf:"準決勝から", final:"決勝のみ" };

/* --- 総当たり表の組み合わせ（ローテーション法） --- */
function roundRobin(ids){
  const a = ids.slice();
  if(a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for(let r=0; r<n-1; r++){
    const pairs = [];
    for(let i=0;i<n/2;i++){
      const h = a[i], w = a[n-1-i];
      if(h && w) pairs.push(r%2 ? [w,h] : [h,w]);
    }
    rounds.push(pairs);
    a.splice(1,0,a.pop());
  }
  return rounds;
}

/* --- リーグ戦の対戦カードを作る --- */
function buildLeagueMatches(tid, teams, groups){
  const out = [];
  groups.forEach(g=>{
    const ids = teams.filter(t=>t.grp===g).sort((a,b)=>a.sort_order-b.sort_order).map(t=>t.id);
    let n = 0;
    roundRobin(ids).forEach((pairs, ri)=>{
      pairs.forEach(([h,a])=>{
        out.push(newMatch(tid,{ stage:"league", grp:g, round:ri+1, slot:n,
                                home_team:h, away_team:a, sort_order:out.length }));
        n++;
      });
    });
  });
  return out;
}

/* --- 予選リーグの通過枠を「A組1位 vs B組2位」のように交差させて並べる --- */
function qualifierSlots(groups, advance){
  const G = groups.length, out = [];
  if(G === 1){
    for(let r=1; r<=advance; r++) out.push(`G:${groups[0]}#${r}`);
    return out;
  }
  for(let r=1; r<=advance; r+=2){
    for(let i=0; i<G; i++){
      out.push(`G:${groups[i]}#${r}`);
      if(r+1 <= advance) out.push(`G:${groups[(i+1)%G]}#${r+1}`);   // 同じ組同士が1回戦で当たらないように
    }
  }
  return out;
}

/* --- 参加者を1回戦の組に割り振る。足りない分は上位から不戦勝にする --- */
function distributePairs(items, koSize){
  const need = koSize/2;
  const pairs = [];
  for(let i=0; i<items.length; i+=2) pairs.push([items[i]??null, items[i+1]??null]);
  let guard = 0;
  while(pairs.length < need && guard++ < koSize){
    const idx = pairs.findIndex(p=> p[0]!=null && p[1]!=null);
    if(idx < 0) break;
    const [a,b] = pairs[idx];
    pairs.splice(idx, 1, [a,null], [b,null]);          // 上の組から順に不戦勝へ分ける
  }
  while(pairs.length < need) pairs.push([null,null]);
  return pairs.slice(0, need);
}

/* --- トーナメント表を作る（size=2,4,8,16,32） --- */
function assignSide(m, side, v){
  m[side+"_team"] = null; m[side+"_src"] = null;
  if(!v) return;
  if(typeof v === "string" && /^(G|W|L|T):/.test(v)) m[side+"_src"] = v;  // 組順位/勝者/敗者/自由文字の枠
  else m[side+"_team"] = v;
}
function buildKOMatches(tid, size, pairs, thirdPlace){
  const rounds = Math.round(Math.log2(size));
  const grid = [];                                  // grid[r][s] = match
  for(let r=1; r<=rounds; r++){
    grid[r] = [];
    const n = size / Math.pow(2,r);
    for(let s=0; s<n; s++){
      grid[r][s] = newMatch(tid,{ stage:"ko", round:r, slot:s, sort_order:r*100+s });
    }
  }
  // 1回戦にチーム（または「A組1位」などの枠）を配置
  for(let s=0; s<size/2; s++){
    const [h,a] = pairs[s] || [null,null];
    assignSide(grid[1][s], "home", h);
    assignSide(grid[1][s], "away", a);
  }
  // 勝者の進む先をつなぐ
  for(let r=2; r<=rounds; r++){
    grid[r].forEach((m,s)=>{
      m.home_src = "W:"+grid[r-1][s*2].id;
      m.away_src = "W:"+grid[r-1][s*2+1].id;
    });
  }
  let out = [];
  for(let r=1;r<=rounds;r++) out.push(...grid[r]);
  // 1回戦の不戦勝（片側だけ実体）は、そのままシードとして残す（相手が空→byeWinnerで2回戦へ自動）。
  //   両方空のマッチだけ削除。これで「シードのチームは2回戦から」という普通の大会表になる。
  grid[1].forEach(m=>{
    if(!m.home_team && !m.away_team && !m.home_src && !m.away_src){
      out.forEach(x=>["home","away"].forEach(sd=>{ if(x[sd+"_src"]==="W:"+m.id) x[sd+"_src"]=null; }));
      out = out.filter(x=>x.id!==m.id);
    }
  });
  if(thirdPlace && rounds>=2){
    const f = out.filter(m=>m.round===rounds-1 && m.slot!==99).sort((a,b)=>a.slot-b.slot);
    if(f.length>=2){
      out.push(newMatch(tid,{ stage:"ko", round:rounds, slot:99, sort_order:rounds*100+99,
        home_src:"L:"+f[0].id, away_src:"L:"+f[1].id }));
    }
  }
  return out;
}

function newMatch(tid, o){
  return Object.assign({
    id:uid(), tournament_id:tid, org_id:state.user?.id||null,
    stage:"league", grp:null, round:1, slot:0, matchNo:null,
    home_team:null, away_team:null, home_src:null, away_src:null,
    kickoff:null, venue:null,
    home_score:null, away_score:null, home_pk:null, away_pk:null,
    status:"todo", events:[], note:null, sort_order:0,
  }, o);
}

/* --- 決勝トーナメントの枠に入るチームを解決する（循環参照ガード付き） --- */
function resolveSlot(m, side, seen){
  seen = seen || new Set();
  const direct = side==="H" ? m.home_team : m.away_team;
  if(direct) return { id:direct, label:teamName(direct), kind:"team" };
  const src = side==="H" ? m.home_src : m.away_src;
  if(!src) return { id:null, label:"—", kind:"tbd" };
  const kind = src.slice(0,1), key = src.slice(2);
  if(kind==="T") return { id:null, label:key||"（未定）", kind:"free" };  // 自由ラベル
  if(kind==="W" || kind==="L"){                     // W:試合id＝その試合の勝者、L:＝敗者
    if(seen.has(src)) return { id:null, label:"⚠", kind:"tbd" };         // 無限ループ防止
    seen.add(src);
    const pm = state.matches.find(x=>x.id===key);
    if(!pm) return { id:null, label:"—", kind:"tbd" };
    const w = winnerOf(pm, new Set(seen));
    if(!w) return { id:null, label:kind==="W" ? "勝者" : "敗者", kind:"from" };
    const H = resolveSlot(pm,"H",new Set(seen)), A = resolveSlot(pm,"A",new Set(seen));
    const hit = ((kind==="W") === (w===H.id)) ? H : A;
    return { id:hit.id, label:hit.label||"—", kind:"team" };
  }
  if(kind==="G"){                                   // G:<ブロックid>#<順位>（旧: G:A1）
    let g, rank;
    if(key.includes("#")){ const p=key.split("#"); g=p[0]; rank=num(p[1]); }
    else { g=key.slice(0,1); rank=num(key.slice(1)); }   // 旧形式（1文字ブロック）
    const label = `${blockName(state.t,g)||g}${rank}位`;
    const gm = state.matches.filter(x=>x.stage==="league" && x.grp===g);
    if(!gm.length || !gm.every(isDone)) return { id:null, label, kind:"from" };   // 予選が終わるまでは枠のまま
    const row = standings(g)[rank-1];
    return row ? { id:row.id, label:row.name, kind:"team" } : { id:null, label, kind:"from" };
  }
  return { id:null, label:"—", kind:"tbd" };
}

function isDone(m){ return m.status==="done" && m.home_score!=null && m.away_score!=null; }

/* 完全に空の枠（＝不戦勝の相手側／シードの空きスロット） */
function isEmptySide(m, side){
  const pre = side==="H" ? "home" : "away";
  return !m[pre+"_team"] && !m[pre+"_src"];
}
/* 片側だけが実体＝シード（1回戦なしで直接上へ） */
function isSeedMatch(m){
  const eH = isEmptySide(m,"H"), eA = isEmptySide(m,"A");
  return eH !== eA;
}
/* 片側だけ実体があり、もう片側が空なら、その実体が自動で勝ち上がり（不戦勝） */
function byeWinner(m, seen){
  const eH = isEmptySide(m,"H"), eA = isEmptySide(m,"A");
  if(eH === eA) return null;                         // 両方空 or 両方あり → bye判定しない
  const live = eH ? "A" : "H";
  const r = resolveSlot(m, live, seen);
  return r.id || null;                               // 実体側が確定チームなら自動勝者
}
function winnerOf(m, seen){
  if(!m) return null;
  if(isDone(m)){
    const h = sideId(m,"H",seen), a = sideId(m,"A",seen);
    if(m.home_score > m.away_score) return h;
    if(m.home_score < m.away_score) return a;
    if(m.home_pk!=null && m.away_pk!=null && m.home_pk!==m.away_pk) return m.home_pk>m.away_pk ? h : a;
    return null;
  }
  return byeWinner(m, seen);                         // 未実施でも不戦勝は自動で上へ
}
function sideId(m, side, seen){
  const direct = side==="H" ? m.home_team : m.away_team;
  return direct || resolveSlot(m, side, seen).id || (side==="H"?"__H:":"__A:")+m.id;
}
function sideLabel(m, side){
  const r = resolveSlot(m, side);
  return r.label || "—";
}

/* --- 順位表 --- */
function standings(grp){
  const cfg = cfgOf(state.t);
  const teams = state.teams.filter(t=> grp ? t.grp===grp : true);
  const rows = teams.map(t=>({
    id:t.id, name:t.name, pl:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, gd:0,
  }));
  const byId = Object.fromEntries(rows.map(r=>[r.id,r]));
  const played = state.matches.filter(m=> m.stage==="league" && isDone(m) && (!grp || m.grp===grp));
  played.forEach(m=>{
    const H = byId[m.home_team], A = byId[m.away_team];
    if(!H || !A) return;
    H.pl++; A.pl++;
    H.gf += m.home_score; H.ga += m.away_score;
    A.gf += m.away_score; A.ga += m.home_score;
    if(m.home_score > m.away_score){ H.w++; A.l++; H.pts += cfg.win; A.pts += cfg.lose; }
    else if(m.home_score < m.away_score){ A.w++; H.l++; A.pts += cfg.win; H.pts += cfg.lose; }
    else { H.d++; A.d++; H.pts += cfg.draw; A.pts += cfg.draw; }
  });
  rows.forEach(r=> r.gd = r.gf - r.ga);
  rows.sort((a,b)=>
      b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || h2h(a,b,played) || a.name.localeCompare(b.name,"ja"));
  return rows;
}
/* 直接対決（勝った方を上に） */
function h2h(a,b,played){
  const m = played.find(x=>
    (x.home_team===a.id && x.away_team===b.id) || (x.home_team===b.id && x.away_team===a.id));
  if(!m) return 0;
  const w = m.home_score>m.away_score ? m.home_team : m.home_score<m.away_score ? m.away_team : null;
  if(!w) return 0;
  return w===a.id ? -1 : 1;
}

/* --- 得点ランキング --- */
function scorerRanking(){
  const map = new Map();
  state.matches.forEach(m=>{
    if(!isDone(m)) return;
    (m.events||[]).forEach(ev=>{
      if(ev.type!=="goal" && ev.type!=="pk") return;   // オウンゴールは個人記録に含めない
      if(!ev.playerId) return;
      const teamId = ev.team==="H" ? sideId(m,"H") : sideId(m,"A");
      const key = teamId + "/" + ev.playerId;
      const cur = map.get(key) || { teamId, pid:ev.playerId, n:0 };
      cur.n++; map.set(key, cur);
    });
  });
  return [...map.values()].sort((a,b)=> b.n-a.n).map(r=>({
    ...r, name:playerName(r.teamId, r.pid), team:teamName(r.teamId),
  }));
}

/* --- アシストランキング（大会設定でON/OFFできる） --- */
function assistRanking(){
  const map = new Map();
  state.matches.forEach(m=>{
    if(!isDone(m)) return;
    (m.events||[]).forEach(ev=>{
      if(ev.type!=="goal" || !ev.assistId) return;   // アシストはふつうの得点だけ（PK・オウンゴールは対象外）
      const teamId = ev.team==="H" ? sideId(m,"H") : sideId(m,"A");
      const key = teamId + "/" + ev.assistId;
      const cur = map.get(key) || { teamId, pid:ev.assistId, n:0 };
      cur.n++; map.set(key, cur);
    });
  });
  return [...map.values()].sort((a,b)=> b.n-a.n).map(r=>({
    ...r, name:playerName(r.teamId, r.pid), team:teamName(r.teamId),
  }));
}

/* --- 懲罰集計 --- */
function cardRanking(){
  const map = new Map();
  state.matches.forEach(m=>{
    (m.events||[]).forEach(ev=>{
      if(!CARD_ICON[ev.type] || !ev.playerId) return;
      const teamId = ev.team==="H" ? sideId(m,"H") : sideId(m,"A");
      const key = teamId + "/" + ev.playerId;
      const cur = map.get(key) || { teamId, pid:ev.playerId, yellow:0, red:0, green:0 };
      cur[ev.type]++; map.set(key, cur);
    });
  });
  return [...map.values()]
    .sort((a,b)=> (b.red*10+b.yellow)-(a.red*10+a.yellow))
    .map(r=>({ ...r, name:playerName(r.teamId,r.pid), team:teamName(r.teamId) }));
}

let _lastView = null, _lastTab = null;
function render(){
  const v = {
    home:viewHome, login:viewLogin, new:viewNew,
    t:viewTournament, match:viewMatch, teams:viewTeams, settings:viewSettings,
    roster:viewRoster, club:viewClub, official:viewOfficial, officialPublic:viewOfficialPublic, lineup:viewLineup, sched:viewSchedule,
    entry:viewEntry, entrylinks:viewEntryLinks,
    clubentry:viewClubEntry, clubentrylinks:viewClubEntryLinks,
  }[state.view] || viewHome;
  const y = window.scrollY;
  const changed = state.view!==_lastView || (state.view==="t" && state.tab!==_lastTab);
  $("#app").innerHTML = v();
  // トーナメント表があれば櫓レイアウト＋接続線を描く（DOM確定後）
  if(document.getElementById("koCanvas")){
    requestAnimationFrame(()=>{ layoutBracket(); drawLinks(); });
  }
  // 画面（やタブ）が変わったときだけ先頭へ。同じ画面の描き直しは位置を保つ
  if(changed) window.scrollTo(0,0); else window.scrollTo(0,y);
  _lastView = state.view; _lastTab = state.tab;
}

    const s = SPORTS[t.sport]?.label || "";

      ${cfg.host?`<div class="tcard-period">${HI.pin} ${esc(cfg.host)}</div>`:""}
      <div class="tstats">
        <div class="tstat"><span class="tsic a">${HI.team}</span><b>${b?b.teams:0}</b><small>チーム</small></div>
        <div class="tstat"><span class="tsic b">${HI.ball}</span><b>${done} / ${total}</b><small>試合進行</small></div>
        ${live?`<div class="tstat"><span class="tsic c">${HI.play}</span><b>${live}</b><small>進行中の試合</small></div>`:""}
      </div>
      <div class="tprog-row"><span>進行状況</span><b>${pct}%</b></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <button class="btn sec sm" style="width:100%;margin-top:12px" onclick="openTournament('${t.id}')">大会を見る →</button>
    </div>`;
  };
  const showAll = !!state.homeShowAll;
  const listOpen = showAll ? mineOpen : mineOpen.slice(0,4);

  return `<div class="home-full">
    <div class="home-top"><div class="home-top-in">
      <div class="home-brand">${TROPHY}<div><b>大会ベース</b><small>大会運営を、もっとスマートに。</small></div></div>
      <div class="home-actions">
        <button class="btn gold sm" onclick="go('${state.user?"new":"login"}')">${HI.person}<span>大会を作成</span></button>
        ${state.user
          ? `<button class="btn ghost sm" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.55)" onclick="logout()">${HI.person}<span>${esc(state.user.code)} ⏻</span></button>`
          : `<button class="btn ghost sm" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.55)" onclick="go('login')">${HI.person}<span>運営ログイン</span></button>`}
      </div>
    </div></div>

    <div class="hero"><div class="hero-in">
      <h2>大会運営を、<br>もっとスマートに。</h2>
      <p>大会の作成から、試合進行・結果入力・順位表・公式記録まで。<br>大会運営に必要な機能を、ひとつに。</p>
      <div class="btnrow">
        <button class="btn sm" onclick="go('${state.user?"new":"login"}')">${HI.plus}大会を作成する</button>
        <button class="btn ghost sm" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.55)"
          onclick="document.getElementById('tlist')?.scrollIntoView({behavior:'smooth'})">${HI.search}大会を見る</button>
      </div>
    </div></div>

    <div class="home-main">
      ${!sb ? `<div class="home-warn"><div class="setup-warn"><b>お試しモードです。</b>保存先（Supabase）が未設定なので、データはこの端末の中だけに残ります。複数の担当者で分担入力するには設定が必要です。</div></div>` : ""}
      ${state.user ? `<div class="stat-grid">
          ${statCard(HI.trophy,"c-blue","開催中の大会数", hs?mineOpen.length:"…", "大会")}
          ${statCard(HI.play,"c-green","進行中の試合", hs?hs.liveAll:"…", "試合")}
          ${statCard(HI.calendar,"c-gold","本日の試合", hs?hs.todayAll:"…", "試合")}
          ${statCard(HI.check,"c-purple","終了した試合", hs?hs.doneAll:"…", "試合")}
        </div>
        <div class="main-grid">
          <div class="panel">
            <div class="block-label-row"><span class="block-label" style="margin:0">🏆 開催中の大会</span>
              ${mineOpen.length>4?`<button class="link-more" onclick="state.homeShowAll=!state.homeShowAll;render()">${showAll?"閉じる":"すべて見る"} ›</button>`:""}
            </div>
            ${listOpen.length ? `<div class="tour-cards">${listOpen.map(tCardOf).join("")}</div>`
              : `<div class="empty">開催中の大会はまだありません。<div style="margin-top:10px"><button class="btn sec sm" onclick="go('new')">＋ 大会を作成</button></div></div>`}
          </div>
          <div class="panel">
            <div class="block-label-row"><span class="block-label" style="margin:0">⚡ クイックアクセス</span></div>
            <div class="qa-grid">
              <button class="qa-tile c-blue" onclick="go('new')"><span class="ic">${HI.trophy}</span><b>大会を作成</b><small>新しい大会を作成します</small></button>
              <button class="qa-tile c-green" onclick="${qaGo}"><span class="ic">${HI.manage}</span><b>試合を管理</b><small>対戦表やスケジュール管理</small></button>
              <button class="qa-tile c-gold" onclick="${qaGo}"><span class="ic">${HI.edit}</span><b>結果を入力</b><small>試合結果を入力・編集</small></button>
              <button class="qa-tile c-purple" onclick="${qaGo}"><span class="ic">${HI.doc}</span><b>公式記録</b><small>結果表や記録を出力</small></button>
            </div>
            <button class="btn ghost sm" style="width:100%;margin-top:12px" onclick="go('roster')">📋 チーム・選手の台帳（${orgYear()}年度）</button>
          </div>
        </div>` : ""}
      <div class="block-label" id="tlist">${state.user?"ほかの大会":"開催中の大会"}</div>
      ${others.length ? `<div class="pick-grid">${others.map(cardOf).join("")}</div>`
        : `<div class="empty">${state.loading?"読み込み中…":"まだ大会がありません。<br>運営ログインして「大会をつくる」から始めてください。"}</div>`}
    </div>

    <div class="feat-band"><div class="feat-band-in">
      <div class="feat-item"><span class="ic"><img src="${FEAT_IC.shield}" alt=""></span><div><b>安心のデータ管理</b><small>大切な大会データを安全に管理します</small></div></div>
      <div class="feat-item"><span class="ic"><img src="${FEAT_IC.clock}" alt=""></span><div><b>リアルタイム更新</b><small>試合結果や順位表をリアルタイムで反映</small></div></div>
      <div class="feat-item"><span class="ic"><img src="${FEAT_IC.chart}" alt=""></span><div><b>多彩な集計機能</b><small>順位表・得点ランキングなど多彩な集計が可能</small></div></div>
      <div class="feat-item"><span class="ic"><img src="${FEAT_IC.cloud}" alt=""></span><div><b>公式記録を出力</b><small>公式戦に必要な記録を簡単に出力</small></div></div>
    </div></div>
  </div>`;
}

function viewLogin(){
  return topbar({ title:"運営ログイン", back:"go('home')" })
  + `<div class="screen">
    <div class="brandhero">
      <img src="icon.png" alt="大会ベース" onerror="this.style.display='none'">
      <div class="tag">大会運営を、もっとスマートに。</div>
    </div>
    <p class="lead">大会をつくる・結果を入力する人だけログインします。見るだけの人はログイン不要です。</p>
    <div class="card">
      <label class="f">団体コード</label>
      <input class="in" id="lg-code" autocapitalize="off" autocorrect="off" placeholder="例）sakura-fc">
      <label class="f">合言葉</label>
      <input class="in" id="lg-pass" type="password" placeholder="合言葉">
      <button class="btn" style="margin-top:16px" onclick="doLogin()">ログイン</button>
      <p class="hint">団体コードと合言葉は、Supabaseの管理画面で発行します（README参照）。同じコードでログインすれば、複数の担当者が同じ大会に入力できます。</p>
    </div>
  </div>`;

async function doLogin(){
  const code = $("#lg-code").value.trim().toLowerCase();
  const pass = $("#lg-pass").value;
  if(!code || !pass) return toast("団体コードと合言葉を入れてください");
  if(!sb){
    state.user = { id:"local", code };
    localStorage.setItem("taikai_local_user", code);
    toast("お試しモードでログインしました");
    await Promise.all([reloadList(), reloadRoster()]); go("home"); return;
  }
  const { data, error } = await sb.auth.signInWithPassword({ email:`${code}@${LOGIN_DOMAIN}`, password:pass });
  if(error){ toast("コードか合言葉が違います"); return; }
  state.user = { id:data.user.id, code };
  await Promise.all([reloadList(), reloadRoster()]); go("home"); toast("ログインしました");
}
async function logout(){
  if(sb) await sb.auth.signOut();
  localStorage.removeItem("taikai_local_user");
  state.user = null;
  await Promise.all([reloadList(), reloadRoster()]); go("home");
}

const OVERVIEW_DEFAULT = {
  halfMin:45, hasET:false, etFrom:"all", etHalfMin:10, hasPK:false,   // 前後半ハーフ分／延長あり／どの試合から／延長ハーフ分／PK
  rankRule:"(1)勝点\n(2)得失点差\n(3)総得点\n(4)当該チーム間の対戦成績\n(5)抽選",
  cardRule:"警告の累積が4回で出場停止処分とする。",
  contact:"",
};
const draft = { name:"", sport:"soccer", format:"league", host:"", dateStart:"", dateEnd:"",
                gradeCat:"", scope:"", promote:0, relegate:0,
                overview:{...OVERVIEW_DEFAULT},
                blocks:["1部"], advance:2, koSize:8, thirdPlace:false, teams:"", picked:[], assign:{} };

/* ブロック（部・組）の編集 */
function addBlock(){ draft.blocks.push(""); render(); }
function renameBlock(i,v){ draft.blocks[i]=v; }
function removeBlock(i){
  if(draft.blocks.length<=1) return toast("ブロックは1つ以上必要です");
  const name = draft.blocks[i];
  draft.blocks.splice(i,1);
  Object.keys(draft.assign).forEach(k=>{ if(draft.assign[k]===i) delete draft.assign[k];
    else if(draft.assign[k]>i) draft.assign[k]--; });   // 詰めた分ずらす
  render();
}
function setAssign(name, idx){ draft.assign[name]=+idx; }
function autoSpread(){
  const names = draftTeamNames();
  names.forEach((n,i)=> draft.assign[n]= i % draft.blocks.length);
  render();
}
function draftTeamNames(){ return draft.teams.split("\n").map(s=>s.trim()).filter(Boolean); }

/* 台帳からまとめて参加チームを選ぶ */
function openPickClubsForNew(){
  // 選択状態：clubId -> チーム数（0/未定義=未選択、1〜4=そのチーム数）
  const pick = {};
  draft.picked.forEach(p=>{ pick[p.id] = (pick[p.id]||0) + 1; });
  let fCat = draft.gradeCat || "";     // 学年区分でしぼる（初期は大会の区分）
  let fScope = draft.scope || "";      // 規模でしぼる
  const useScope = state.clubs.some(c=>(c.regions||[]).length);
  const catBtns = [["","すべて"],["elem","小学生"],["jhs","中学生"],["hs","高校生"],["univ","大学生"]];
  const scopeBtns = [["","規模すべて"],["national","全国"],["pref","都道府県"],["local","地域"]];
  const visible = ()=> state.clubs.filter(c=>{
      if(fCat && c.category!==fCat) return false;
      if(fScope && !(c.regions||[]).includes(fScope)) return false;
      return true;
    }).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja"));

  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>台帳から参加チームを選ぶ</h3>
    <p class="hint" style="margin-bottom:8px">区分でしぼって、<b>すべて選択</b>で一括登録できます。同じチームを A・B に分けて別ブロックへも入れられます。</p>
    <label class="f" style="margin-top:0">区分でしぼる</label>
    <div class="seg" id="pc-cat"></div>
    ${useScope ? `<label class="f">規模でしぼる</label><div class="seg" id="pc-scope"></div>` : ""}
    <div id="pc-body" style="margin-top:10px;max-height:50vh;overflow:auto"></div>
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="pc-ok">選んだチームを入れる</button>
    </div>
  </div>`;
  document.body.appendChild(el);

  function renderFilters(){
    el.querySelector("#pc-cat").innerHTML = catBtns.map(([k,l])=>
      `<button class="${fCat===k?"on":""}" data-v="${k}">${esc(l)}</button>`).join("");
    el.querySelectorAll("#pc-cat button").forEach(b=> b.onclick=()=>{ fCat=b.dataset.v; renderFilters(); renderBody(); });
    const sc = el.querySelector("#pc-scope");
    if(sc){
      sc.innerHTML = scopeBtns.map(([k,l])=>`<button class="${fScope===k?"on":""}" data-v="${k}">${esc(l)}</button>`).join("");
      sc.querySelectorAll("button").forEach(b=> b.onclick=()=>{ fScope=b.dataset.v; renderFilters(); renderBody(); });
    }
  }
  function renderBody(){
    const pool = visible();
    const allOn = pool.length>0 && pool.every(c=>pick[c.id]);
    const selN = pool.filter(c=>pick[c.id]).length;
    el.querySelector("#pc-body").innerHTML =
      `<div class="btnrow" style="margin:0 0 8px">
        <button class="btn ${allOn?"sec":"ghost"} sm" style="flex:1" id="pc-all">${allOn?"☑ すべて解除":"☐ すべて選択"}（${pool.length}チーム）</button>
      </div>` +
      (pool.length ? pool.map(c=>{
        const n = membersOf(c.id).length, cnt = pick[c.id]||0;
        return `<label class="pick" style="cursor:pointer">
          <span style="min-width:0;display:flex;align-items:center;gap:6px">
            ${c.crest?`<img src="${c.crest}" style="width:26px;height:26px;object-fit:contain;border-radius:5px;background:#fff;flex:0 0 auto">`:""}
            <span style="min-width:0"><span style="display:block">${esc(c.name)}</span>
            <span class="meta">${esc(CATEGORIES[c.category]?.label||"")}・${n}名</span></span></span>
          <select data-id="${c.id}" style="margin-right:8px;padding:4px;flex:0 0 auto" onclick="event.stopPropagation()">
            <option value="1" ${cnt<=1?"selected":""}>1チーム</option>
            <option value="2" ${cnt===2?"selected":""}>2チーム(A・B)</option>
            <option value="3" ${cnt===3?"selected":""}>3チーム(A〜C)</option>
            <option value="4" ${cnt===4?"selected":""}>4チーム(A〜D)</option>
          </select>
          <input type="checkbox" data-id="${c.id}" ${cnt?"checked":""} style="width:22px;height:22px;flex-shrink:0">
        </label>`;
      }).join("") : `<div class="empty">この区分に当てはまるチームが台帳にありません。</div>`);
    el.querySelectorAll("#pc-body input[type=checkbox]").forEach(cb=> cb.onchange = ()=>{
      pick[cb.dataset.id] = cb.checked ? (pick[cb.dataset.id]||1) : 0; renderBody();
    });
    el.querySelectorAll("#pc-body select[data-id]").forEach(s=> s.onchange = ()=>{
      pick[s.dataset.id] = +s.value; renderBody();
    });
    const allBtn = el.querySelector("#pc-all");
    if(allBtn) allBtn.onclick = ()=>{
      const p2 = visible(), turnOn = !(p2.length && p2.every(c=>pick[c.id]));
      p2.forEach(c=> pick[c.id] = turnOn ? (pick[c.id]||1) : 0); renderBody();
    };
  }
  renderFilters(); renderBody();

  el.querySelector("#pc-ok").onclick = ()=>{
    const picks = [];
    state.clubs.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja")).forEach(c=>{
      const cnt = pick[c.id]; if(!cnt) return;
      if(cnt<=1) picks.push({ id:c.id, name:c.name });
      else for(let i=0;i<cnt;i++) picks.push({ id:c.id, name: c.name+" "+String.fromCharCode(65+i) }); // A,B,C,D
    });
    if(!picks.length){ draft.picked=[]; el.remove(); render(); return; }
    // J：台帳の背番号（チーム内番号）で入ることを確認
    if(!confirm("台帳のチーム内背番号で入れます。\n大会用に背番号を変えるときは、大会をつくった後に各チームの選手で直せます。\nよろしいですか？")) return;
    draft.picked = picks;
    const extra = draft.teams.split("\n").map(s=>s.trim())
      .filter(s=> s && !picks.some(p=>p.name===s));    // 手打ちしたチームは残す
    draft.teams = [...picks.map(p=>p.name), ...extra].join("\n");
    el.remove(); render();
  };
}
