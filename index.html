<style>
/* ブランド：大会ベース TAIKAI BASE（ネイビー＋ゴールド） */
:root{
  --ink:#0d1b3d; --paper:#f1f5f9; --line:#dbe2ee; --sub:#6b7280;
  --ok:#1f9d55; --na:#9aa4b2; --warn:#e0930c; --bad:#d6453d;
  --okbg:#e6f4ec; --nabg:#eef1f5; --warnbg:#fdf5e3; --badbg:#fbe7e5;
  --brand:#0d1b3d; --accent:#2148c7; --accent2:#3b6fe0; --accentbg:#e7edfd;
  --gold:#e2b93b; --goldbg:#faf3dd;
  --grad:linear-gradient(135deg,#16266b 0%,#2148c7 55%,#3b6fe0 100%);
  --grad-gold:linear-gradient(135deg,#caa233,#f0d178);
  --shadow:0 1px 3px rgba(13,27,61,.07),0 6px 20px rgba(13,27,61,.09);
  --shadow-lg:0 12px 32px rgba(21,38,107,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.5;
  -webkit-text-size-adjust:100%; padding-bottom:40px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:16px;}
/* 数値欄の上下スピナーを消す（数字が欠けるのを防ぐ） */
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.hidden{display:none !important;}
/* 記入リンク（J）用 */
.callout{background:var(--accentbg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--accent);}
.callout.ok{background:var(--okbg);border-color:#bfe6c9;color:var(--ok);}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--nabg);color:var(--sub);}
.pill.ok{background:var(--okbg);color:var(--ok);}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:5px;}
.linkbtn{background:none;border:none;font-size:13px;color:var(--accent);font-weight:700;cursor:pointer;padding:4px;}

/* ===== ヘッダー ===== */
.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--grad); color:#fff;
  border-bottom:2px solid transparent;
  border-image:var(--grad-gold) 1;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  display:flex; align-items:center; gap:9px;
  box-shadow:0 4px 18px rgba(13,27,61,.28);
}
.topbar .back{
  font-size:14px; padding:6px 10px; margin-left:-4px;
  border-radius:8px; background:rgba(255,255,255,.16); font-weight:600; flex-shrink:0;
}
.topbar .mark{width:26px;height:26px;flex-shrink:0;}
.topbar .ttl{flex:1;min-width:0;}
.topbar h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .sub{font-size:11.5px;opacity:.82;font-weight:500;}
.topbar .act{font-size:13px;padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.16);font-weight:600;flex-shrink:0;}

.screen{max-width:640px;margin:0 auto;padding:14px;}
.lead{font-size:13.5px;color:var(--sub);margin:2px 0 14px;}
.brandhero{text-align:center;padding:18px 0 2px;position:relative;}
.brandhero img{width:120px;height:120px;border-radius:28px;box-shadow:var(--shadow-lg);
  position:relative;z-index:1;}
.brandhero::before{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  width:190px;height:190px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(59,111,224,.20),rgba(59,111,224,0));z-index:0;}
.brandhero .tag{margin-top:11px;font-size:13.5px;font-weight:800;color:var(--brand);letter-spacing:.03em;}
.brandhero .tag::before,.brandhero .tag::after{content:"";display:inline-block;width:16px;height:2px;
  background:var(--gold);vertical-align:middle;margin:0 8px;}
.hero{position:relative;overflow:hidden;border-radius:18px;margin-bottom:16px;
  background:var(--grad);color:#fff;padding:20px 18px;box-shadow:var(--shadow-lg);}
.hero::after{content:"🏆";position:absolute;right:2px;bottom:-16px;font-size:92px;opacity:.16;transform:rotate(-10deg);}
.hero h2{margin:0;font-size:21px;font-weight:800;letter-spacing:.02em;position:relative;z-index:1;}
.hero p{margin:6px 0 0;font-size:13px;opacity:.92;font-weight:500;position:relative;z-index:1;max-width:80%;}
.hero .goldline{display:inline-block;width:36px;height:3px;border-radius:2px;background:var(--grad-gold);margin-top:11px;position:relative;z-index:1;}
.block-label{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:20px 4px 8px;}
.block-label:first-child{margin-top:2px;}

/* ===== カード ===== */
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  transition:box-shadow .18s,transform .18s;}
.card:hover{box-shadow:var(--shadow-lg);}
.pick{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:10px;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);
  font-size:16px;font-weight:600;transition:transform .08s,border-color .15s;}
.pick:active{transform:scale(.985);border-color:var(--accent);}
.pick .meta{font-size:12px;color:var(--sub);font-weight:500;margin-top:2px;}
.pick .chev{color:#c2cbd6;font-size:20px;flex-shrink:0;}

.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;flex-shrink:0;white-space:nowrap;}
.badge.live{background:var(--badbg);color:var(--bad);}
.badge.done{background:var(--okbg);color:var(--ok);}
.badge.todo{background:var(--nabg);color:var(--na);}
.badge.soon{background:var(--warnbg);color:#a8700a;}

/* ===== ボタン ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:14px;border-radius:12px;font-size:15.5px;font-weight:700;
  background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(33,72,199,.28);
  transition:transform .08s,box-shadow .15s;}
.btn:active{transform:scale(.985);}
.btn:hover{box-shadow:0 6px 20px rgba(33,72,199,.38);}
.btn.sec{background:#fff;color:var(--accent);border:1.5px solid var(--accent);}
.btn.ghost{background:#fff;color:var(--sub);border:1.5px solid var(--line);}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f0bdb9;}
.btn.sm{padding:9px 14px;font-size:13.5px;width:auto;border-radius:10px;}
.btnrow{display:flex;gap:8px;margin-top:12px;}
.btnrow .btn{flex:1;}

/* ===== フォーム ===== */
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 2px 6px;}
label.f:first-child{margin-top:0;}
.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);}
.in:focus{outline:none;border-color:var(--accent2);}
textarea.in{min-height:120px;resize:vertical;line-height:1.7;}
.hint{font-size:12px;color:var(--sub);margin:6px 2px 0;line-height:1.5;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{flex:1;min-width:88px;padding:11px 6px;border-radius:11px;border:2px solid var(--line);
  background:#fbfcfd;color:#5a6573;font-weight:700;font-size:14px;}
.seg button.on{background:var(--accentbg);border-color:var(--accent2);color:var(--accent);}
.row2{display:flex;gap:8px;}
.row2>*{flex:1;min-width:0;}

/* ===== タブ ===== */
.tabs{position:sticky;top:0;z-index:40;background:var(--paper);
  display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);
  scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:700;
  color:var(--sub);background:#fff;border:1.5px solid var(--line);white-space:nowrap;}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(33,72,199,.3);}

/* ===== 試合カード ===== */
.mcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;
  margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden;}
.mcard .mhead{display:flex;justify-content:space-between;align-items:center;
  padding:7px 13px;background:#f8fafc;border-bottom:1px solid var(--line);
  font-size:11.5px;color:var(--sub);font-weight:600;gap:8px;}
.mcard .mno{color:var(--gold);font-weight:800;}
.mcard .mnote{margin:0 13px 10px;padding:7px 10px;background:var(--warnbg);border:1px solid #f0dca8;
  border-radius:8px;font-size:12.5px;color:#8a6206;font-weight:600;line-height:1.5;}
.mcard .mbody{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:12px 13px;gap:10px;width:100%;text-align:left;}
.mcard .side{min-width:0;}
.mcard .tname{font-size:15px;font-weight:700;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;overflow-wrap:anywhere;}
.mcard .side.away{text-align:right;}
.mcard .sc{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;
  min-width:64px;flex-shrink:0;text-align:center;letter-spacing:.02em;
  padding:2px 8px;border-radius:9px;background:var(--paper);}
.mcard .sc.pending{font-size:14px;color:var(--na);font-weight:700;letter-spacing:.1em;background:transparent;}
.mcard .pk{font-size:11px;color:var(--sub);font-weight:600;}
.mcard .win{color:var(--accent);}
.mcard .scorers{padding:0 13px 10px;font-size:11.5px;color:var(--sub);line-height:1.6;}
.mcard.editable:active{transform:scale(.99);}

/* ===== 表 ===== */
.tblwrap{overflow-x:auto;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:#f8fafc;font-size:11.5px;color:var(--sub);font-weight:700;}
tr:last-child td{border-bottom:none;}
td.nm{text-align:left;font-weight:700;font-size:13.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;}

<script>
/* ==========================================================================
   大会ベース  —  リーグ/トーナメント大会の運営・結果公開アプリ
   ・保存先: Supabase（未設定でも端末内に保存して試せます）
   ・運営は「団体コード＋合言葉」でログイン、閲覧はログイン不要
   ========================================================================== */

/* ---------- 設定 ---------- */
const SUPABASE_URL      = "https://glxszbwsvembyygocekp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdseHN6YndzdmVtYnl5Z29jZWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2MDA5MzEsImV4cCI6MjA5NzE3NjkzMX0.Me73xDBFtOsNZ6ZRZZH8TNeXfwpiYvPBlplh4kRPsds";
const LOGIN_DOMAIN      = "taikai.invalid";
const POLL_MS           = 20000;   // 分担入力の自動反映（ミリ秒）

let sb = null;
try{
  if(SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes("ここに")){
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){ console.warn("Supabase初期化に失敗", e); }

/* ---------- 競技の定義 ---------- */
const SPORTS = {
  soccer:{ label:"サッカー",         unit:"点", scorers:true,  cards:true,  pk:true,
           periods:["前半","後半","延長前半","延長後半"] },
  futsal:{ label:"フットサル",       unit:"点", scorers:true,  cards:true,  pk:true,
           periods:["第1P","第2P","延長"] },
};
const FORMATS = {
  league:    { label:"リーグ戦",              hasLeague:true,  hasKO:false },
  ko:        { label:"トーナメント戦",        hasLeague:false, hasKO:true  },
  league_ko: { label:"予選リーグ＋決勝T",     hasLeague:true,  hasKO:true  },
};
const GROUP_NAMES = "ABCDEFGH".split("");
const CARD_ICON = { yellow:"🟨", red:"🟥", green:"🟩" };
const CARD_LABEL = { yellow:"警告", red:"退場", green:"グリーン" };
/* 得点・交代の時間帯 */
const PERIODS    = { "1H":"前半", "2H":"後半", "1ET":"延長前", "2ET":"延長後" };
const PERIOD_REG = ["1H","2H"];      // ふつうの試合
const PERIOD_ET  = ["1ET","2ET"];    // 延長を使う試合だけ

/* ---------- 学年の区分（卒業の判定に使う） ---------- */
const CATEGORIES = {
  elem: { label:"小学生", max:6, suffix:"年" },
  jhs:  { label:"中学生", max:3, suffix:"年" },
  hs:   { label:"高校生", max:3, suffix:"年" },
  univ: { label:"大学生", max:4, suffix:"年" },
  none: { label:"学年なし", max:0, suffix:"" },
};
/* ---------- 大会の規模（全国／都道府県／地域） ---------- */
const SCOPES = {
  national: { label:"全国" },
  pref:     { label:"都道府県" },
  local:    { label:"地域" },
};
const POSITIONS = ["GK","DF","MF","FW"];

/* 日本の年度（4月始まり）。3月31日までは前年の年度 */
function fiscalYear(d){
  d = d || new Date();
  return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear()-1;
}
function gradeLabel(cat, grade){
  const c = CATEGORIES[cat] || CATEGORIES.none;
  if(!c.max || !grade) return "";
  return grade + c.suffix;
}

/* ---------- 小道具 ---------- */
const $ = s=>document.querySelector(s);
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID()
                 : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
                     const r=Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); }));
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = v => { const n = parseInt(v,10); return Number.isFinite(n) ? n : 0; };
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  const w = "日月火水木金土"[d.getDay()];
  return `${d.getMonth()+1}/${d.getDate()}(${w})`;
}
function fmtTime(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* ---------- 状態 ---------- */
const state = {
  view:"home",      // home | login | new | t | match | teams | settings | roster | club
  user:null,        // {id, code}
  list:[],          // 大会一覧
  t:null,           // 表示中の大会
  teams:[],
  matches:[],
  tab:"schedule",
  matchId:null,
  loading:false,
  /* --- 年度をまたいで残る台帳 --- */
  org:null,         // {id, name, year}
  clubs:[],         // チーム台帳
  members:[],       // 選手台帳
  clubId:null,      // 表示中のチーム
  showGrads:false,  // 卒業した選手も表示するか
  official:null,    // 編集中の公式記録
  sheetZoom:0.8,
};
const canEdit = ()=> !!(state.user && state.t && state.t.org_id === state.user.id);
const orgYear = ()=> state.org?.year ?? fiscalYear();

/* ==========================================================================
   保存まわり（Supabase / 端末内）
   ========================================================================== */
const LOCAL_KEY = "taikai_local_v1";
const EMPTY_DB  = { t:[], teams:[], matches:[], clubs:[], members:[], orgs:[], entry:[], clubEntry:[] };
const TBL_KEY   = { gn_tournaments:"t", gn_teams:"teams", gn_matches:"matches",
                    gn_clubs:"clubs", gn_members:"members", gn_orgs:"orgs", gn_entry:"entry" };
const local = {
  read(){ try{ return Object.assign({}, EMPTY_DB, JSON.parse(localStorage.getItem(LOCAL_KEY))||{}); }
          catch(e){ return Object.assign({}, EMPTY_DB); } },
  write(d){ localStorage.setItem(LOCAL_KEY, JSON.stringify(d)); },
};

const DB = {
  online(){ return !!sb; },

  async listTournaments(){
    if(!sb) return local.read().t.slice().sort((a,b)=> (b.created_at||"").localeCompare(a.created_at||""));
    const { data, error } = await sb.from("gn_tournaments").select("*").order("created_at",{ascending:false}).limit(200);
    if(error) throw error;
    return data || [];
  },

  async loadTournament(id){
    if(!sb){
      const d = local.read();
      return {
        t: d.t.find(x=>x.id===id) || null,
        teams: d.teams.filter(x=>x.tournament_id===id),
        matches: d.matches.filter(x=>x.tournament_id===id),
      };
    }
    const [rt, rteams, rmatches] = await Promise.all([
      sb.from("gn_tournaments").select("*").eq("id",id).maybeSingle(),
      sb.from("gn_teams").select("*").eq("tournament_id",id),
      sb.from("gn_matches").select("*").eq("tournament_id",id),
    ]);
    if(rt.error) throw rt.error;
    if(rteams.error) throw rteams.error;
    if(rmatches.error) throw rmatches.error;
    return { t:rt.data, teams:rteams.data||[], matches:rmatches.data||[] };
  },

  /* --- 台帳（チーム・選手・団体設定）を丸ごと読む --- */
  async loadRoster(orgId){
    if(!sb){
      const d = local.read();
      return { org: d.orgs.find(o=>o.id===orgId) || null,
               clubs: d.clubs.filter(c=>c.org_id===orgId),
               members: d.members.filter(m=>m.org_id===orgId) };
    }
    const [ro, rc, rm] = await Promise.all([
      sb.from("gn_orgs").select("*").eq("id",orgId).maybeSingle(),
      sb.from("gn_clubs").select("*").eq("org_id",orgId),
      sb.from("gn_members").select("*").eq("org_id",orgId),
    ]);
    if(rc.error) throw rc.error;
    if(rm.error) throw rm.error;
    return { org: ro.error ? null : ro.data, clubs: rc.data||[], members: rm.data||[] };
  },

  async upsert(table, rows){
    const arr = Array.isArray(rows) ? rows : [rows];
    if(!arr.length) return;
    if(!sb){
      const key = TBL_KEY[table];
      const d = local.read();
      arr.forEach(r=>{
        const i = d[key].findIndex(x=>x.id===r.id);
        if(i>=0) d[key][i] = {...d[key][i], ...r}; else d[key].push(r);
      });
      local.write(d);
      return;
    }
    const { error } = await sb.from(table).upsert(arr);
    if(error) throw error;
  },

  async remove(table, ids){
    const arr = Array.isArray(ids) ? ids : [ids];
    if(!arr.length) return;
    if(!sb){
      const key = TBL_KEY[table];
      const d = local.read();
      d[key] = d[key].filter(x=>!arr.includes(x.id));
      if(table==="gn_tournaments"){
        d.teams = d.teams.filter(x=>!arr.includes(x.tournament_id));
        d.matches = d.matches.filter(x=>!arr.includes(x.tournament_id));
      }
      if(table==="gn_clubs"){
        d.members = d.members.filter(x=>!arr.includes(x.club_id));
      }
      local.write(d);
      return;
    }
    const { error } = await sb.from(table).delete().in("id", arr);
    if(error) throw error;
  },

  /* --- 記入リンク（要望J）--- */
  // 本部：この大会の記入コード一覧 {team_id:{code,submitted_at}}
  async loadEntries(tournamentId){
    if(!sb){
      const d = local.read();
      const map = {};
      d.entry.filter(e=>e.tournament_id===tournamentId).forEach(e=>map[e.team_id]={code:e.code,submitted_at:e.submitted_at});
      return map;
    }
    const { data, error } = await sb.from("gn_entry").select("team_id,code,submitted_at").eq("tournament_id",tournamentId);
    if(error) throw error;

/* 記入コード（紛らわしい文字を避けた6桁） */
function entryCode(){
  const s = "ABCDEFGHJKLMNPRSTUWXYZ2345679";
  let r = ""; for(let i=0;i<6;i++) r += s[Math.floor(Math.random()*s.length)];
  return r;
}

/* ==========================================================================
   大会ロジック
   ========================================================================== */
const sportOf = t => SPORTS[t?.sport] || SPORTS.soccer;
const cfgOf   = t => Object.assign({ win:3, draw:1, lose:0, groups:["A"], advance:2,
                                     venues:[], koSize:8, thirdPlace:false, duration:20 }, t?.settings||{});

/* ブロック（部・組）: 新形式 settings.blocks=[{id,name}]。旧 groups(文字)も読めるように */
function blocksOf(t){
  const s = t?.settings || {};
  if(Array.isArray(s.blocks) && s.blocks.length) return s.blocks;
  const gs = Array.isArray(s.groups) ? s.groups : [];
  return gs.map(g=>({ id:g, name:/^[A-H]$/.test(g)? g+"組" : g }));
}
function blockName(t, id){ return (blocksOf(t).find(b=>b.id===id)||{}).name || ""; }

const teamById = id => state.teams.find(t=>t.id===id) || null;
const teamName = id => teamById(id)?.name || "";
function playersOf(teamId){ return (teamById(teamId)?.players)||[]; }
function playerName(teamId, pid){
  const p = playersOf(teamId).find(x=>x.id===pid);
  if(!p) return "選手";
  return (p.no ? `${p.no} ` : "") + p.name;
}
/* この試合の出場選手（メンバー表があれば先発＋控えから、なければ大会登録の選手）。
   side は "H"/"A"。返す id は台帳選手id（イベントの playerId と同じ体系）。 */
function participantsOf(m, side){
  const lu = m.lineups && m.lineups[side];
  const inMatch = lu && Array.isArray(lu.players)
    ? lu.players.filter(p=>p.role==="start"||p.role==="sub")
        .map(p=>({ id:p.pid, no:p.no, name:p.name, pos:p.pos }))
    : [];
  if(inMatch.length) return inMatch;
  const R = resolveSlot(m, side);
  return playersOf(R.id);
}
/* 得点イベントが「どちらのチームの得点か」（オウンゴールは相手の得点） */
function scoringSideOf(ev){ return ev.type==="og" ? (ev.team==="H"?"A":"H") : ev.team; }
/* 時間帯ごとの得点数（side は "H" / "A"） */
function periodScore(m, period, side){
  return (m.events||[]).filter(e=>
    (e.type==="goal"||e.type==="pk"||e.type==="og")
    && (e.period||"1H")===period && scoringSideOf(e)===side).length;
}
/* この試合が延長を使うか（明示フラグ or 延長の得点がある） */
function matchUsesET(m){
  return !!(m.lineups && m.lineups._meta && m.lineups._meta.useET)
    || (m.events||[]).some(e=> e.period==="1ET" || e.period==="2ET")
    || etAppliesToMatch(m);   // 大会概要の「延長：どの試合から」でも自動でON
}
function setMatchET(m, on){
  m.lineups = m.lineups || {};
  m.lineups._meta = m.lineups._meta || {};
  m.lineups._meta.useET = !!on;
}
/* このトーナメントの総ラウンド数（実際の櫓の最大round。無ければ koSize から） */
function koTotalRounds(){
  const ko = (state.matches||[]).filter(m=>m.stage==="ko" && m.slot!==99);
  if(ko.length) return Math.max(...ko.map(m=>m.round));
  return Math.round(Math.log2(cfgOf(state.t).koSize||2)) || 1;
}
/* 延長が「この試合」に適用されるか（大会概要の 延長あり＋どの試合から） */
function etAppliesToMatch(m){
  const ov = cfgOf(state.t).overview || {};
  if(!ov.hasET || !m || m.stage!=="ko") return false;   // 延長はトーナメント戦のみ
  const left = koTotalRounds() - m.round;                 // 0=決勝, 1=準決勝, 2=準々決勝 …
  const thr = ({ all:99, qf:2, sf:1, final:0 })[ov.etFrom||"all"];
  return left <= thr;
}
const ET_FROM_LABEL = { all:"全試合", qf:"準々決勝から", sf:"準決勝から", final:"決勝のみ" };

/* --- 総当たり表の組み合わせ（ローテーション法） --- */
function roundRobin(ids){
  const a = ids.slice();
  if(a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for(let r=0; r<n-1; r++){
    const pairs = [];
    for(let i=0;i<n/2;i++){
      const h = a[i], w = a[n-1-i];
      if(h && w) pairs.push(r%2 ? [w,h] : [h,w]);
    }
    rounds.push(pairs);
    a.splice(1,0,a.pop());
  }
  return rounds;
}

/* --- リーグ戦の対戦カードを作る --- */
function buildLeagueMatches(tid, teams, groups){
  const out = [];
  groups.forEach(g=>{
    const ids = teams.filter(t=>t.grp===g).sort((a,b)=>a.sort_order-b.sort_order).map(t=>t.id);
    let n = 0;
    roundRobin(ids).forEach((pairs, ri)=>{
      pairs.forEach(([h,a])=>{
        out.push(newMatch(tid,{ stage:"league", grp:g, round:ri+1, slot:n,
                                home_team:h, away_team:a, sort_order:out.length }));
        n++;
      });
    });
  });
  return out;
}

/* --- 予選リーグの通過枠を「A組1位 vs B組2位」のように交差させて並べる --- */
function qualifierSlots(groups, advance){
  const G = groups.length, out = [];
  if(G === 1){
    for(let r=1; r<=advance; r++) out.push(`G:${groups[0]}#${r}`);
    return out;
  }
  for(let r=1; r<=advance; r+=2){
    for(let i=0; i<G; i++){
      out.push(`G:${groups[i]}#${r}`);
      if(r+1 <= advance) out.push(`G:${groups[(i+1)%G]}#${r+1}`);   // 同じ組同士が1回戦で当たらないように
    }
  }
  return out;
}

/* --- 参加者を1回戦の組に割り振る。足りない分は上位から不戦勝にする --- */
function distributePairs(items, koSize){
  const need = koSize/2;
  const pairs = [];
  for(let i=0; i<items.length; i+=2) pairs.push([items[i]??null, items[i+1]??null]);
  let guard = 0;
  while(pairs.length < need && guard++ < koSize){
    const idx = pairs.findIndex(p=> p[0]!=null && p[1]!=null);
    if(idx < 0) break;
    const [a,b] = pairs[idx];
    pairs.splice(idx, 1, [a,null], [b,null]);          // 上の組から順に不戦勝へ分ける
  }
  while(pairs.length < need) pairs.push([null,null]);
  return pairs.slice(0, need);
}

/* --- トーナメント表を作る（size=2,4,8,16,32） --- */
function assignSide(m, side, v){
  m[side+"_team"] = null; m[side+"_src"] = null;
  if(!v) return;
  if(typeof v === "string" && /^(G|W|L):/.test(v)) m[side+"_src"] = v;  // 組順位/勝者/敗者の枠
  else m[side+"_team"] = v;
}
function buildKOMatches(tid, size, pairs, thirdPlace){
  const rounds = Math.round(Math.log2(size));
  const grid = [];                                  // grid[r][s] = match
  for(let r=1; r<=rounds; r++){
    grid[r] = [];
    const n = size / Math.pow(2,r);
    for(let s=0; s<n; s++){
      grid[r][s] = newMatch(tid,{ stage:"ko", round:r, slot:s, sort_order:r*100+s });
    }
  }
  // 1回戦にチーム（または「A組1位」などの枠）を配置
  for(let s=0; s<size/2; s++){
    const [h,a] = pairs[s] || [null,null];
    assignSide(grid[1][s], "home", h);
    assignSide(grid[1][s], "away", a);
  }
  // 勝者の進む先をつなぐ
  for(let r=2; r<=rounds; r++){
    grid[r].forEach((m,s)=>{
      m.home_src = "W:"+grid[r-1][s*2].id;
      m.away_src = "W:"+grid[r-1][s*2+1].id;
    });
  }
  const out = [];
  for(let r=1;r<=rounds;r++) out.push(...grid[r]);
  if(thirdPlace && rounds>=2){
    const f = grid[rounds-1];
    out.push(newMatch(tid,{ stage:"ko", round:rounds, slot:99, sort_order:rounds*100+99,
      home_src:"L:"+f[0].id, away_src:"L:"+f[1].id }));
  }
  return out;
}

function newMatch(tid, o){
  return Object.assign({
    id:uid(), tournament_id:tid, org_id:state.user?.id||null,
    stage:"league", grp:null, round:1, slot:0, matchNo:null,
    home_team:null, away_team:null, home_src:null, away_src:null,
    kickoff:null, venue:null,
    home_score:null, away_score:null, home_pk:null, away_pk:null,
    status:"todo", events:[], note:null, sort_order:0,
  }, o);
}

/* --- 決勝トーナメントの枠に入るチームを解決する --- */
function resolveSlot(m, side){
  const direct = side==="H" ? m.home_team : m.away_team;
  if(direct) return { id:direct, label:teamName(direct) };
  const src = side==="H" ? m.home_src : m.away_src;
  if(!src) return { id:null, label:"—" };
  const [kind, key] = [src.slice(0,1), src.slice(2)];
  if(kind==="W" || kind==="L"){                     // W:試合id＝その試合の勝者、L:＝敗者
    const pm = state.matches.find(x=>x.id===key);
    if(!pm) return { id:null, label:"—" };
    const w = winnerOf(pm);
    if(!w) return { id:null, label:kind==="W" ? "勝者" : "敗者" };
    const H = resolveSlot(pm,"H"), A = resolveSlot(pm,"A");
    const hit = ((kind==="W") === (w===H.id)) ? H : A;
    return { id:hit.id, label:hit.label };
  }
  if(kind==="G"){                                   // G:<ブロックid>#<順位>（旧: G:A1）
    let g, rank;
    if(key.includes("#")){ const p=key.split("#"); g=p[0]; rank=num(p[1]); }
    else { g=key.slice(0,1); rank=num(key.slice(1)); }   // 旧形式（1文字ブロック）
    const label = `${blockName(state.t,g)||g}${rank}位`;
    const gm = state.matches.filter(m=>m.stage==="league" && m.grp===g);
    if(!gm.length || !gm.every(isDone)) return { id:null, label };   // 予選が終わるまでは枠のまま
    const row = standings(g)[rank-1];
    return row ? { id:row.id, label:row.name } : { id:null, label };
  }
  return { id:null, label:"—" };
}

function isDone(m){ return m.status==="done" && m.home_score!=null && m.away_score!=null; }
function winnerOf(m){
  if(!isDone(m)) return null;
  const h = sideId(m,"H"), a = sideId(m,"A");
  if(m.home_score > m.away_score) return h;
  if(m.home_score < m.away_score) return a;
  if(m.home_pk!=null && m.away_pk!=null && m.home_pk!==m.away_pk) return m.home_pk>m.away_pk ? h : a;
  return null;
}
function sideId(m, side){
  const direct = side==="H" ? m.home_team : m.away_team;
  return direct || resolveSlot(m, side).id;
}
function sideLabel(m, side){
  const r = resolveSlot(m, side);
  return r.label || "—";
}

/* --- 順位表 --- */
function standings(grp){
  const cfg = cfgOf(state.t);
  const teams = state.teams.filter(t=> grp ? t.grp===grp : true);
  const rows = teams.map(t=>({
    id:t.id, name:t.name, pl:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, gd:0,
  }));
  const byId = Object.fromEntries(rows.map(r=>[r.id,r]));
  const played = state.matches.filter(m=> m.stage==="league" && isDone(m) && (!grp || m.grp===grp));
  played.forEach(m=>{
    const H = byId[m.home_team], A = byId[m.away_team];
    if(!H || !A) return;
    H.pl++; A.pl++;
    H.gf += m.home_score; H.ga += m.away_score;
    A.gf += m.away_score; A.ga += m.home_score;
    if(m.home_score > m.away_score){ H.w++; A.l++; H.pts += cfg.win; A.pts += cfg.lose; }
    else if(m.home_score < m.away_score){ A.w++; H.l++; A.pts += cfg.win; H.pts += cfg.lose; }
    else { H.d++; A.d++; H.pts += cfg.draw; A.pts += cfg.draw; }
  });
  rows.forEach(r=> r.gd = r.gf - r.ga);
  rows.sort((a,b)=>
      b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || h2h(a,b,played) || a.name.localeCompare(b.name,"ja"));
  return rows;
}
/* 直接対決（勝った方を上に） */
function h2h(a,b,played){
  const m = played.find(x=>
    (x.home_team===a.id && x.away_team===b.id) || (x.home_team===b.id && x.away_team===a.id));
  if(!m) return 0;
  const w = m.home_score>m.away_score ? m.home_team : m.home_score<m.away_score ? m.away_team : null;
  if(!w) return 0;
  return w===a.id ? -1 : 1;
}

/* --- 得点ランキング --- */
function scorerRanking(){
  const map = new Map();
  state.matches.forEach(m=>{
    if(!isDone(m)) return;
    (m.events||[]).forEach(ev=>{
      if(ev.type!=="goal" && ev.type!=="pk") return;   // オウンゴールは個人記録に含めない
      if(!ev.playerId) return;
      const teamId = ev.team==="H" ? sideId(m,"H") : sideId(m,"A");
      const key = teamId + "/" + ev.playerId;
      const cur = map.get(key) || { teamId, pid:ev.playerId, n:0 };
      cur.n++; map.set(key, cur);
    });
  });
  return [...map.values()].sort((a,b)=> b.n-a.n).map(r=>({
    ...r, name:playerName(r.teamId, r.pid), team:teamName(r.teamId),
  }));
}

/* --- 懲罰集計 --- */
function cardRanking(){
  const map = new Map();
  state.matches.forEach(m=>{
    (m.events||[]).forEach(ev=>{
      if(!CARD_ICON[ev.type] || !ev.playerId) return;
      const teamId = ev.team==="H" ? sideId(m,"H") : sideId(m,"A");
      const key = teamId + "/" + ev.playerId;
      const cur = map.get(key) || { teamId, pid:ev.playerId, yellow:0, red:0, green:0 };
      cur[ev.type]++; map.set(key, cur);
    });
  });
  return [...map.values()]
    .sort((a,b)=> (b.red*10+b.yellow)-(a.red*10+a.yellow))
    .map(r=>({ ...r, name:playerName(r.teamId,r.pid), team:teamName(r.teamId) }));
}

async function doLogin(){
  const code = $("#lg-code").value.trim().toLowerCase();
  const pass = $("#lg-pass").value;
  if(!code || !pass) return toast("団体コードと合言葉を入れてください");
  if(!sb){
    state.user = { id:"local", code };
    localStorage.setItem("taikai_local_user", code);
    toast("お試しモードでログインしました");
    await Promise.all([reloadList(), reloadRoster()]); go("home"); return;
  }
  const { data, error } = await sb.auth.signInWithPassword({ email:`${code}@${LOGIN_DOMAIN}`, password:pass });
  if(error){ toast("コードか合言葉が違います"); return; }
  state.user = { id:data.user.id, code };
  await Promise.all([reloadList(), reloadRoster()]); go("home"); toast("ログインしました");
}
async function logout(){
  if(sb) await sb.auth.signOut();
  localStorage.removeItem("taikai_local_user");
  state.user = null;
  await Promise.all([reloadList(), reloadRoster()]); go("home");
}

};

/* ブロック（部・組）の編集 */
function addBlock(){ draft.blocks.push(""); render(); }
function renameBlock(i,v){ draft.blocks[i]=v; }
function removeBlock(i){
  if(draft.blocks.length<=1) return toast("ブロックは1つ以上必要です");
  const name = draft.blocks[i];
  draft.blocks.splice(i,1);
  Object.keys(draft.assign).forEach(k=>{ if(draft.assign[k]===i) delete draft.assign[k];
    else if(draft.assign[k]>i) draft.assign[k]--; });   // 詰めた分ずらす
  render();
}
function setAssign(name, idx){ draft.assign[name]=+idx; }
function autoSpread(){
  const names = draftTeamNames();
  names.forEach((n,i)=> draft.assign[n]= i % draft.blocks.length);
  render();
}
function draftTeamNames(){ return draft.teams.split("\n").map(s=>s.trim()).filter(Boolean); }

/* 台帳からまとめて参加チームを選ぶ */
function openPickClubsForNew(){
  // 選択状態：clubId -> チーム数（0/未定義=未選択、1〜4=そのチーム数）
  const pick = {};
  draft.picked.forEach(p=>{ pick[p.id] = (pick[p.id]||0) + 1; });
  let fCat = draft.gradeCat || "";     // 学年区分でしぼる（初期は大会の区分）
  let fScope = draft.scope || "";      // 規模でしぼる
  const useScope = state.clubs.some(c=>(c.regions||[]).length);
  const catBtns = [["","すべて"],["elem","小学生"],["jhs","中学生"],["hs","高校生"],["univ","大学生"]];
  const scopeBtns = [["","規模すべて"],["national","全国"],["pref","都道府県"],["local","地域"]];
  const visible = ()=> state.clubs.filter(c=>{
      if(fCat && c.category!==fCat) return false;
      if(fScope && !(c.regions||[]).includes(fScope)) return false;
      return true;
    }).sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja"));

  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>台帳から参加チームを選ぶ</h3>
    <p class="hint" style="margin-bottom:8px">区分でしぼって、<b>すべて選択</b>で一括登録できます。同じチームを A・B に分けて別ブロックへも入れられます。</p>
    <label class="f" style="margin-top:0">区分でしぼる</label>
    <div class="seg" id="pc-cat"></div>
    ${useScope ? `<label class="f">規模でしぼる</label><div class="seg" id="pc-scope"></div>` : ""}
    <div id="pc-body" style="margin-top:10px;max-height:50vh;overflow:auto"></div>
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="pc-ok">選んだチームを入れる</button>
    </div>
  </div>`;
  document.body.appendChild(el);

  function renderFilters(){
    el.querySelector("#pc-cat").innerHTML = catBtns.map(([k,l])=>
      `<button class="${fCat===k?"on":""}" data-v="${k}">${esc(l)}</button>`).join("");
    el.querySelectorAll("#pc-cat button").forEach(b=> b.onclick=()=>{ fCat=b.dataset.v; renderFilters(); renderBody(); });
    const sc = el.querySelector("#pc-scope");
    if(sc){
      sc.innerHTML = scopeBtns.map(([k,l])=>`<button class="${fScope===k?"on":""}" data-v="${k}">${esc(l)}</button>`).join("");
      sc.querySelectorAll("button").forEach(b=> b.onclick=()=>{ fScope=b.dataset.v; renderFilters(); renderBody(); });
    }
  }
  function renderBody(){
    const pool = visible();
    const allOn = pool.length>0 && pool.every(c=>pick[c.id]);
    const selN = pool.filter(c=>pick[c.id]).length;
    el.querySelector("#pc-body").innerHTML =
      `<div class="btnrow" style="margin:0 0 8px">
        <button class="btn ${allOn?"sec":"ghost"} sm" style="flex:1" id="pc-all">${allOn?"☑ すべて解除":"☐ すべて選択"}（${pool.length}チーム）</button>
      </div>` +
      (pool.length ? pool.map(c=>{
        const n = membersOf(c.id).length, cnt = pick[c.id]||0;
        return `<label class="pick" style="cursor:pointer">
          <span style="min-width:0;display:flex;align-items:center;gap:6px">
            ${c.crest?`<img src="${c.crest}" style="width:26px;height:26px;object-fit:contain;border-radius:5px;background:#fff;flex:0 0 auto">`:""}
            <span style="min-width:0"><span style="display:block">${esc(c.name)}</span>
            <span class="meta">${esc(CATEGORIES[c.category]?.label||"")}・${n}名</span></span></span>
          <select data-id="${c.id}" style="margin-right:8px;padding:4px;flex:0 0 auto" onclick="event.stopPropagation()">
            <option value="1" ${cnt<=1?"selected":""}>1チーム</option>
            <option value="2" ${cnt===2?"selected":""}>2チーム(A・B)</option>
            <option value="3" ${cnt===3?"selected":""}>3チーム(A〜C)</option>
            <option value="4" ${cnt===4?"selected":""}>4チーム(A〜D)</option>
          </select>
          <input type="checkbox" data-id="${c.id}" ${cnt?"checked":""} style="width:22px;height:22px;flex-shrink:0">
        </label>`;
      }).join("") : `<div class="empty">この区分に当てはまるチームが台帳にありません。</div>`);
    el.querySelectorAll("#pc-body input[type=checkbox]").forEach(cb=> cb.onchange = ()=>{
      pick[cb.dataset.id] = cb.checked ? (pick[cb.dataset.id]||1) : 0; renderBody();
    });
    el.querySelectorAll("#pc-body select[data-id]").forEach(s=> s.onchange = ()=>{
      pick[s.dataset.id] = +s.value; renderBody();
    });
    const allBtn = el.querySelector("#pc-all");
    if(allBtn) allBtn.onclick = ()=>{
      const p2 = visible(), turnOn = !(p2.length && p2.every(c=>pick[c.id]));
      p2.forEach(c=> pick[c.id] = turnOn ? (pick[c.id]||1) : 0); renderBody();
    };
  }
  renderFilters(); renderBody();

  el.querySelector("#pc-ok").onclick = ()=>{
    const picks = [];
    state.clubs.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja")).forEach(c=>{
      const cnt = pick[c.id]; if(!cnt) return;
      if(cnt<=1) picks.push({ id:c.id, name:c.name });
      else for(let i=0;i<cnt;i++) picks.push({ id:c.id, name: c.name+" "+String.fromCharCode(65+i) }); // A,B,C,D
    });
    if(!picks.length){ draft.picked=[]; el.remove(); render(); return; }
    // J：台帳の背番号（チーム内番号）で入ることを確認
    if(!confirm("台帳のチーム内背番号で入れます。\n大会用に背番号を変えるときは、大会をつくった後に各チームの選手で直せます。\nよろしいですか？")) return;
    draft.picked = picks;
    const extra = draft.teams.split("\n").map(s=>s.trim())
      .filter(s=> s && !picks.some(p=>p.name===s));    // 手打ちしたチームは残す
    draft.teams = [...picks.map(p=>p.name), ...extra].join("\n");
    el.remove(); render();
  };
}

          ${draft.blocks.map((b,i)=>`<option value="${i}" ${(draft.assign[nm]??0)===i?"selected":""}>${esc(b||`${i+1}部`)}</option>`).join("")}
        </select>
      </div>`).join("")}
    </div>` : ""}

    <button class="btn" onclick="createTournament()">この内容で大会をつくる</button>
  </div>`;
}

async function createTournament(){
  if(!state.user) return toast("先にログインしてください");
  const names = draft.teams.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!draft.name.trim()) return toast("大会名を入れてください");
  if(names.length < 2)   return toast("チームを2つ以上入れてください");

  const f = FORMATS[draft.format];
  const tid = uid();
  // ブロック（部・組）を確定。空名は「1部」「2部」…で補う
  const blocks = f.hasLeague
    ? draft.blocks.map((nm,i)=>({ id:uid(), name:(nm||"").trim() || `${i+1}部` }))
    : [];
  const blockIds = blocks.map(b=>b.id);
  const pow2 = n => Math.pow(2, Math.max(1, Math.ceil(Math.log2(Math.max(2, n)))));
  const koSize = draft.format==="ko"
      ? Math.max(draft.koSize, pow2(names.length))        // チームが枠より多ければ枠を広げる
      : pow2(blocks.length * draft.advance);

  const t = {
    id:tid, org_id:state.user.id, name:draft.name.trim(),
    sport:draft.sport, format:draft.format,
    settings:{ win:3, draw:1, lose:0, host:draft.host.trim(),
               gradeCat:draft.gradeCat||null, scope:draft.scope||null,
               promote:draft.promote||0, relegate:draft.relegate||0,
               overview:{...draft.overview},
               date:draft.dateStart, dateStart:draft.dateStart, dateEnd:draft.dateEnd,
               blocks, advance:draft.advance, koSize, thirdPlace:draft.thirdPlace,
               venues:[], duration:20 },
    created_at:new Date().toISOString(),
  };

  // チーム。リーグは指定ブロックへ手動振り分け（未指定は先頭）。台帳のは選手も入れる
  const teams = names.map((name,i)=>{
    const club = draft.picked.find(p=>p.name===name);
    const bIdx = blocks.length ? (draft.assign[name] ?? 0) : null;
    return {
      id:uid(), tournament_id:tid, org_id:state.user.id, name,
      grp: blocks.length ? (blocks[Math.min(bIdx, blocks.length-1)]?.id || blocks[0].id) : null,
      seed:i+1, sort_order:i, club_id: club?.id || null,
      players: club ? membersOf(club.id).map(m=>({
        id:m.id, memberId:m.id, no:m.no, name:m.name, pos:m.pos, grade:m.grade })) : [],
    };
  });

  // 対戦カード
  let matches = [];
  if(f.hasLeague) matches = matches.concat(buildLeagueMatches(tid, teams, blockIds));
  if(f.hasKO){
    const items = draft.format==="ko"
        ? []                                              // トーナメントのみ：空櫓スタート（作成後に各枠へ配置）
        : qualifierSlots(blockIds, draft.advance);        // 予選つき：1部1位…の枠
    matches = matches.concat(buildKOMatches(tid, koSize, distributePairs(items, koSize), draft.thirdPlace));
  }
  matches.forEach(m=> m.org_id = state.user.id);

  try{
    await DB.upsert("gn_tournaments", t);
    await DB.upsert("gn_teams", teams);
    await DB.upsert("gn_matches", matches);
  }catch(e){ console.error(e); return toast("保存できませんでした: "+(e.message||e)); }

  Object.assign(draft, { name:"", host:"", dateStart:"", dateEnd:"", teams:"", picked:[], assign:{}, blocks:["1部"], gradeCat:"", scope:"", promote:0, relegate:0, overview:{...OVERVIEW_DEFAULT} });
  await reloadList();
  openTournament(tid);
}

/* 試合を「試合順」に並べる（キックオフ→ステージ→並び順） */
function matchesInOrder(){
  return state.matches.slice().sort((a,b)=>{
    if(a.kickoff && b.kickoff && a.kickoff!==b.kickoff) return a.kickoff.localeCompare(b.kickoff);
    if(a.kickoff && !b.kickoff) return -1;
    if(!a.kickoff && b.kickoff) return 1;
    if(a.stage!==b.stage) return a.stage==="league" ? -1 : 1;
    return (a.sort_order||0)-(b.sort_order||0);
  });
}

/* --- 日程・結果 --- */
function tabSchedule(){
  const ms = matchesInOrder();
  if(!ms.length) return `<div class="empty">試合がありません。</div>`;
  let out = "", lastKey = null;
  if(canEdit()) out += `<div class="btnrow noprint" style="margin-bottom:10px">
    <button class="btn sec sm" style="flex:1" onclick="go('sched')">🗓 日程・会場をまとめて入力</button></div>`;
  ms.forEach(m=>{
    const bn = blockName(state.t, m.grp);
    const key = m.stage==="league" ? (bn ? `${bn} リーグ` : "リーグ戦") : koRoundLabel(m);
    if(key!==lastKey){ out += `<div class="block-label">${esc(key)}</div>`; lastKey = key; }
    out += matchCard(m);
  });
  return out;
}

function koRoundLabel(m){
  const cfg = cfgOf(state.t);
  const rounds = Math.round(Math.log2(cfg.koSize));
  if(m.slot===99) return "3位決定戦";
  const left = rounds - m.round;
  return ["決勝","準決勝","準々決勝"][left] || `${Math.pow(2,left+1)}分の1（${m.round}回戦）`;
}

function matchCard(m){
  const sp = sportOf(state.t);
  const H = resolveSlot(m,"H"), A = resolveSlot(m,"A");
  const w = winnerOf(m);
  const st = m.status==="live" ? `<span class="badge live">試合中</span>`
           : isDone(m)         ? `<span class="badge done">終了</span>`
           : `<span class="badge todo">未実施</span>`;
  const sc = isDone(m)
    ? `<span class="${w&&w===H.id?"win":""}">${m.home_score}</span> - <span class="${w&&w===A.id?"win":""}">${m.away_score}</span>`
    : m.status==="live" ? `${m.home_score??0} - ${m.away_score??0}` : "vs";
  const pk = (m.home_pk!=null&&m.away_pk!=null) ? `<div class="pk">PK ${m.home_pk}-${m.away_pk}</div>` : "";
  const goals = (m.events||[]).filter(e=>e.type==="goal"||e.type==="pk"||e.type==="og");
  const scline = goals.length ? `<div class="scorers">⚽ ${goals.map(e=>{
      const tid = e.team==="H" ? H.id : A.id;
      const nm = e.playerId ? playerName(tid, e.playerId) : "得点";
      return esc(nm) + (e.type==="og"?"(OG)":e.type==="pk"?"(PK)":"") + (e.minute?` ${e.minute}'`:"");
    }).join("、")}</div>` : "";

  return `<div class="mcard ${canEdit()?"editable":""}">
    <div class="mhead">
      <span>${m.matchNo?`<b class="mno">No.${m.matchNo}</b> `:""}${[fmtDate(m.kickoff), fmtTime(m.kickoff), m.venue].filter(Boolean).map(esc).join(" ")||"日時未定"}</span>
      ${st}
    </div>
    <${canEdit()?`button class="mbody" onclick="openMatch('${m.id}')"`:`div class="mbody"`}>
      <span class="side"><span class="tname">${esc(H.label)}</span></span>
      <span class="sc ${isDone(m)||m.status==="live"?"":"pending"}">${sc}${pk}</span>
      <span class="side away"><span class="tname">${esc(A.label)}</span></span>
    </${canEdit()?"button":"div"}>
    ${m.note?`<div class="mnote">📣 ${esc(m.note)}</div>`:""}
    ${scline}
  </div>`;
}

const localTime = iso=>{ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

function setSched(id, part, val){

/* ブロックごとの昇格・降格・入れ替え戦の設定（旧・大会全体の promote/relegate も拾う） */
function promoConfig(b, cfg){
  const g = { up:num(cfg?.promote)||0, upPo:0, down:num(cfg?.relegate)||0, downPo:0 };
  if(!b) return g;
  const has = ["up","upPo","down","downPo"].some(k=> b[k]!=null && b[k]!=="");
  if(!has) return g;
  return { up:num(b.up)||0, upPo:num(b.upPo)||0, down:num(b.down)||0, downPo:num(b.downPo)||0 };
}
/* 順位 i（0始まり）が 自動昇格／昇格入替戦／降格入替戦／自動降格 のどれか */
const STAND_ZONES = {
  up:   { bg:"rgba(31,157,85,.17)",  mark:"▲", col:"var(--ok)",   label:"自動昇格" },
  upPo: { bg:"rgba(42,157,120,.15)", mark:"△", col:"#1c8f6a",     label:"昇格入れ替え戦" },
  downPo:{ bg:"rgba(224,147,12,.17)",mark:"▽", col:"#b8760a",     label:"降格入れ替え戦" },
  down: { bg:"rgba(214,69,61,.15)",  mark:"▼", col:"var(--bad)",  label:"自動降格" },
};
function standZone(i, n, pc){
  if(pc.up   && i < pc.up)                        return "up";
  if(pc.upPo && i < pc.up + pc.upPo)              return "upPo";
  if(pc.down && i >= n - pc.down)                 return "down";
  if(pc.downPo && i >= n - pc.down - pc.downPo)   return "downPo";
  return null;
}
function tabTable(){
  const cfg = cfgOf(state.t);
  const blocks = blocksOf(state.t);
  const one = blocks.length<=1;
  const adv = state.t.format==="league_ko" ? cfg.advance : 0;
  const usedZones = new Set();
  const body = (blocks.length?blocks:[null]).map(b=>{
    const rows = standings(b?b.id:null);
    if(!rows.length) return "";
    const n = rows.length;
    const pc = promoConfig(b, cfg);
    return `${(b && !one)?`<div class="block-label">${esc(b.name)}</div>`:""}
    <div class="tblwrap"><table>
      <thead><tr><th></th><th style="text-align:left">チーム</th><th>勝点</th><th>試合</th><th>勝</th><th>分</th><th>敗</th><th>得点</th><th>失点</th><th>得失差</th></tr></thead>
      <tbody>${rows.map((r,i)=>{
        const z = standZone(i, n, pc); if(z) usedZones.add(z);
        const zc = z ? STAND_ZONES[z] : null;
        const bg = zc ? `background:${zc.bg}` : "";
        const mark = zc ? `<span title="${zc.label}" style="color:${zc.col};font-weight:800"> ${zc.mark}</span>` : "";
        return `<tr class="${adv&&i<adv?"adv":""}" style="${bg}">
        <td class="rk">${i+1}</td><td class="nm">${esc(r.name)}${mark}</td>
        <td class="pt">${r.pts}</td><td>${r.pl}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
        <td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?"+":""}${r.gd}</td>
      </tr>`;}).join("")}</tbody>
    </table></div>`;
  }).join("");
  const legend = ["up","upPo","downPo","down"].filter(z=>usedZones.has(z))
    .map(z=>`<span style="color:${STAND_ZONES[z].col};font-weight:700">${STAND_ZONES[z].mark} ${STAND_ZONES[z].label}</span>`).join("　");
  return body
  + `<p class="hint">勝ち${cfg.win}点／引き分け${cfg.draw}点／負け${cfg.lose}点。同点のときは 得失点差 → 総得点 → 直接対決 の順で並べます。${adv?`色つきが決勝トーナメント進出（各ブロック${adv}位まで）。`:""}${legend?`<br>${legend}`:""}</p>`
  + (canEdit()?`<div class="btnrow noprint"><button class="btn sec sm" onclick="go('settings')">⚙ リーグごとの昇格・降格・入れ替え戦を設定</button></div>`:"");
}

/* --- 戦績表（星取表） --- */
function tabMatrix(){
  const cfg = cfgOf(state.t);
  const blocks = blocksOf(state.t);
  const one = blocks.length<=1;
  return (blocks.length?blocks:[null]).map(b=>{
    const g = b ? b.id : null;
    const ts = state.teams.filter(t=>!g||t.grp===g).sort((a,b)=>a.sort_order-b.sort_order);
    if(ts.length<2) return "";
    const cell = (a,b)=>{
      if(a.id===b.id) return `<td class="self">—</td>`;
      const m = state.matches.find(x=> x.stage==="league" &&
        ((x.home_team===a.id&&x.away_team===b.id)||(x.home_team===b.id&&x.away_team===a.id)));
      if(!m || !isDone(m)) return `<td>-</td>`;
      const own  = m.home_team===a.id ? m.home_score : m.away_score;
      const opp  = m.home_team===a.id ? m.away_score : m.home_score;
      const cls  = own>opp ? "w" : own<opp ? "l" : "";
      return `<td class="${cls}">${own}-${opp}</td>`;
    };
    return `${(b && !one)?`<div class="block-label">${esc(b.name)} 戦績表</div>`:""}
    <div class="tblwrap"><table class="mtx">
      <thead><tr><th style="text-align:left">　</th>${ts.map((t,i)=>`<th>${i+1}</th>`).join("")}</tr></thead>
      <tbody>${ts.map((a,i)=>`<tr><td class="nm">${i+1}. ${esc(a.name)}</td>${ts.map(b=>cell(a,b)).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  }).join("") || `<div class="empty">チームが足りません。</div>`;
}

/* --- トーナメント表 --- */
function tabBracket(){
  const cfg = cfgOf(state.t);
  const ko = state.matches.filter(m=>m.stage==="ko" && m.slot!==99);
  if(!ko.length) return `<div class="empty">トーナメントがありません。</div>`;
  const rounds = Math.max(...ko.map(m=>m.round));
  const vert = !!cfg.overview?.bracketVert;
  let html = "";
  if(canEdit()){
    html += `<div class="seg noprint" style="margin-bottom:10px">
      <button class="${!vert?"on":""}" onclick="setBracketDir(false)">横型</button>
      <button class="${vert?"on":""}" onclick="setBracketDir(true)">縦型</button></div>`;
  }
  html += `<div class="bracket${vert?" vert":""}"><div class="brounds">`;
  for(let r=1; r<=rounds; r++){
    const ms = ko.filter(m=>m.round===r).sort((a,b)=>a.slot-b.slot);
    html += `<div class="bround">` + ms.map(m=>{
      const H = resolveSlot(m,"H"), A = resolveSlot(m,"A"), w = winnerOf(m);
      const hasPk = m.home_pk!=null && m.away_pk!=null;
      const slot = (side, r2)=>{
        const won = w && w===r2.id;
        const sc = isDone(m) ? (side==="H"?m.home_score:m.away_score) : "";
        const pk = isDone(m) && hasPk ? `<small>(PK${side==="H"?m.home_pk:m.away_pk})</small>` : "";
        return `<div class="slot ${won?"won":""} ${r2.id?"":"tbd"}">
          <span class="n">${esc(r2.label)}</span><span class="s">${pk}${sc}</span></div>`;
      };
      const open = canEdit() ? ` onclick="openMatch('${m.id}')" style="cursor:pointer"` : "";
      return `<div class="bm"${open}><span class="lbl">${esc(koRoundLabel(m))}</span>${slot("H",H)}${slot("A",A)}</div>`;
    }).join("") + `</div>`;
  }
  html += `</div></div>`;
  if(canEdit()){
    if(state.t.format==="ko"){
      html += `<button class="btn noprint" style="margin-bottom:6px" onclick="autoDrawKO()">✨ 登録チームで自動作成</button>
        <p class="hint noprint" style="margin:0 0 10px">登録チームで普通のトーナメント表を作ります（人数が半端でも不戦勝を自動で入れます）。作ったあとは下の「組み合わせを変える」で入れ替えできます。</p>`;
    }
    html += `<div class="btnrow noprint" style="margin-bottom:8px">
      <button class="btn sec sm" onclick="openR1Maker()">① 1回戦を組む</button>
      <button class="btn sec sm" onclick="openLaterMaker()">② 2回戦以降を組む</button></div>
    <div class="btnrow noprint" style="margin-bottom:12px">
      <button class="btn ghost sm" onclick="openSeedSheet()">組み合わせを変える</button></div>`;
  }
  const third = state.matches.find(m=>m.slot===99);
  if(third){ html += `<div class="block-label">3位決定戦</div>` + matchCard(third); }
  if(state.t.format==="league_ko"){
    html += `<p class="hint">予選リーグの順位が確定すると、枠のチーム名が自動で入ります（各組${cfg.advance}位まで）。</p>`;
  }
  return html;
}

/* --- 1回戦の組み合わせを手で決める --- */
function openSeedSheet(){
  const cfg = cfgOf(state.t);
  const r1 = state.matches.filter(m=>m.stage==="ko" && m.round===1 && m.slot!==99)
                          .sort((a,b)=>a.slot-b.slot);
  const opts = [{v:"", l:"（なし・不戦勝）"}];
  if(state.t.format==="league_ko"){
    blocksOf(state.t).forEach(b=>{ for(let r=1;r<=cfg.advance;r++) opts.push({v:`G:${b.id}#${r}`, l:`${b.name}${r}位`}); });
  }
  state.teams.slice().sort((a,b)=>a.sort_order-b.sort_order).forEach(t=> opts.push({v:t.id, l:t.name}));
  const sel = (m,side)=>{
    const cur = m[side+"_team"] || m[side+"_src"] || "";
    return `<select class="in" data-m="${m.id}" data-s="${side}">${opts.map(o=>
      `<option value="${esc(o.v)}" ${o.v===cur?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
  };
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>1回戦の組み合わせ</h3>
    <p class="hint" style="margin-bottom:8px">シードのチームは「なし（不戦勝）」と組ませると2回戦から登場します。</p>
    ${r1.map((m,i)=>`<div class="card" style="margin-bottom:8px">
      <div class="hint" style="margin:0 0 6px">第${i+1}試合</div>
      ${sel(m,"home")}<div style="height:6px"></div>${sel(m,"away")}
    </div>`).join("")}
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="seed-ok">この組み合わせにする</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  $("#seed-ok").onclick = async ()=>{
    const touched = new Map();
    el.querySelectorAll("select[data-m]").forEach(s=>{
      const m = state.matches.find(x=>x.id===s.dataset.m); if(!m) return;
      assignSide(m, s.dataset.s, s.value || null);
      touched.set(m.id, m);
    });
    el.remove();
    try{
      await DB.upsert("gn_matches", [...touched.values()].map(stripMatch));
      toast("組み合わせを保存しました");
    }catch(e){ toast("保存できませんでした: "+(e.message||e)); }
    render();
  };
}

/* --- 出場記録（選手ごとの 先発・控え・得点）C4 --- */
function tabAppearances(){
  const teamsOut = [];
  state.teams.forEach(t=>{
    const stat = new Map();  // 選手名 -> {no, start, sub, goals}
    const ensure = (name, no)=>{
      let s = stat.get(name);
      if(!s){ s = { no:no??null, start:0, sub:0, goals:0 }; stat.set(name, s); }
      if(no!=null && s.no==null) s.no = no;
      return s;
    };
    state.matches.forEach(m=>{
      ["H","A"].forEach(side=>{
        if(resolveSlot(m, side).id !== t.id) return;
        const lu = m.lineups && m.lineups[side];
        if(lu) lu.players.forEach(p=>{
          if(p.role==="out" || !p.name) return;
          const s = ensure(p.name, p.no);
          if(p.role==="start") s.start++; else s.sub++;
        });
        (m.events||[]).filter(e=>e.team===side && (e.type==="goal"||e.type==="pk")).forEach(e=>{
          if(!e.playerId) return;
          const full = playerName(t.id, e.playerId);
          const no = (full.match(/^(\d+)\s/)||[])[1];
          const name = full.replace(/^\d+\s/,"");
          ensure(name, no?num(no):null).goals++;
        });
      });
    });
    if(stat.size) teamsOut.push({ team:t.name, teamId:t.id,
      players:[...stat.entries()].map(([name,s])=>({name,...s})).sort((a,b)=>(a.no??999)-(b.no??999)) });
  });
  if(!teamsOut.length) return `<div class="empty">まだ出場の記録がありません。<br>試合ごとにメンバー表を作ると、ここに先発・控えの回数がまとまります。</div>`;
  return teamsOut.map(r=>`<div class="block-label">${esc(r.team)}</div>
    <div class="tblwrap"><table>
      <thead><tr><th>番号</th><th style="text-align:left">選手</th><th>先発</th><th>控え</th><th>出場計</th><th>時間</th><th>得点</th></tr></thead>
      <tbody>${r.players.map(p=>`<tr>
        <td>${p.no??""}</td><td class="nm">${esc(p.name)}</td>
        <td>${p.start||""}</td><td>${p.sub||""}</td><td class="pt">${(p.start+p.sub)||""}</td>
        <td>${canEdit()
          ? `<input class="in" style="padding:5px;width:58px;text-align:center" value="${esc(playTimeOf(r.teamId,p.name))}" placeholder="分" onchange="setPlayTime('${r.teamId}','${esc(p.name).replace(/'/g,"\\'")}',this.value)">`
          : esc(playTimeOf(r.teamId,p.name))}</td>
        <td>${p.goals||""}</td>
      </tr>`).join("")}</tbody>
    </table></div>`).join("")
    + `<p class="hint">各試合のメンバー表（スタメン／控え）と得点から集計しています。<b>時間</b>は手書きでかまいません（自動では入りません）。</p>`;
}
/* 出場時間（手書き）。大会ごとに settings.playtime に「チームid/選手名」で保存 */
function playTimeOf(teamId, name){
  const pt = (state.t && state.t.settings && state.t.settings.playtime) || {};
  return pt[teamId+"/"+name] || "";
}
async function setPlayTime(teamId, name, v){
  const s = state.t.settings = state.t.settings || {};
  s.playtime = s.playtime || {};
  const key = teamId+"/"+name;
  if(String(v).trim()==="") delete s.playtime[key]; else s.playtime[key] = String(v).trim();
  try{
    const { id,org_id,name:tn,sport,format,settings,created_at } = state.t;
    await DB.upsert("gn_tournaments", { id,org_id,name:tn,sport,format,settings,created_at });
  }catch(e){ console.error(e); }
}

  const kickoffLocal = m.kickoff ? new Date(new Date(m.kickoff).getTime()
      - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : "";

  const periods = PERIOD_REG.concat(matchUsesET(m)?PERIOD_ET:[]);
  const evList = (m.events||[]).map((ev,i)=>{
    const tid = ev.team==="H" ? H.id : A.id;
    const tn  = ev.team==="H" ? H.label : A.label;

      const outN = ev.outId    ? playerName(tid, ev.outId)    : "—";

          <div class="stepper">

          </div>
        </div>
        <div class="vs">－</div>
        <div class="team">
          <div class="tn">${esc(A.label)}</div>
          <div class="stepper">
            <button onclick="bump('away',-1)">−</button>
            <span class="v">${m.away_score??0}</span>
            <button onclick="bump('away',1)">＋</button>
          </div>
        </div>
      </div>
      ${sp.scorers ? `
        <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
          <div style="display:grid;grid-template-columns:1fr auto auto;gap:5px 16px;align-items:center;max-width:280px;margin:0 auto">
            <span></span>
            <span style="text-align:center;color:var(--sub);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px">${esc(H.label)}</span>
            <span style="text-align:center;color:var(--sub);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px">${esc(A.label)}</span>
            ${periods.map(p=>`<span style="color:var(--sub);font-size:12px">${esc(PERIODS[p])}</span>
              <span style="text-align:center;font-weight:700">${periodScore(m,p,"H")}</span>

  </div>`;
}

function curMatch(){ return state.matches.find(x=>x.id===state.matchId); }
function bump(side, d){
  const m = curMatch(); if(!m) return;
  const k = side==="home" ? "home_score" : "away_score";
  m[k] = Math.max(0, (m[k]??0) + d);
  if(m.status==="todo") m.status = "live";
  render();
}
function setField(k,v){
  const m = curMatch(); if(!m) return;
  m[k] = v;
  if(k==="status") render();
}
function setKickoff(v){
  const m = curMatch(); if(!m) return;
  m.kickoff = v ? new Date(v).toISOString() : null;
}
function delEvent(i){
  const m = curMatch(); if(!m) return;
  const ev = (m.events||[])[i];
  // 得点イベントを消すときは合計点も1つ戻す（前後半スコアと合計をそろえる）
  if(ev && (ev.type==="goal"||ev.type==="pk"||ev.type==="og")){
    const scoringSide = ev.type==="og" ? (ev.team==="H"?"away":"home") : (ev.team==="H"?"home":"away");
    m[scoringSide+"_score"] = Math.max(0, (m[scoringSide+"_score"]??0) - 1);
  }
  m.events = (m.events||[]).filter((_,j)=>j!==i);
  render();
}
/* 延長を使う／やめる */
function toggleET(on){
  const m = curMatch(); if(!m) return;
  if(!on && (m.events||[]).some(e=>e.period==="1ET"||e.period==="2ET"))

}

async function saveMatch(stay){
  const m = curMatch(); if(!m) return false;
  if(m.status==="done" && (m.home_score==null || m.away_score==null)){
    m.home_score = m.home_score??0; m.away_score = m.away_score??0;
  }
  m.updated_at = new Date().toISOString();
  try{
    await DB.upsert("gn_matches", stripMatch(m));
    toast("保存しました");
    if(!stay) go("t");
    return true;
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); return false; }
}
function stripMatch(m){
  const { id,tournament_id,org_id,stage,grp,round,slot,matchNo,home_team,away_team,home_src,away_src,
          kickoff,venue,home_score,away_score,home_pk,away_pk,status,events,note,sort_order,
          updated_at,official,lineups } = m;

           kickoff,venue,home_score,away_score,home_pk,away_pk,status,events,note,sort_order,
           updated_at,official,lineups };
}

function addTeamToTournament(name, clubId){
  const nm = name || prompt("追加するチーム名");

  const blocks = blocksOf(state.t);

  const t = { id:uid(), tournament_id:state.t.id, org_id:state.user.id, name:nm.trim(),
    grp: blocks.length ? blocks[0].id : null,
    seed: state.teams.length+1, sort_order: state.teams.length, club_id: clubId||null,
    players: club ? membersOf(clubId).map(m=>({ id:m.id, memberId:m.id, no:m.no, name:m.name, pos:m.pos, grade:m.grade })) : [],
    _dirty:true };

async function removeTeam(id){
  const t = state.teams.find(x=>x.id===id); if(!t) return;
  if(!confirm(`「${t.name}」を大会から外します。\nこのチームの試合カードも消えます。よろしいですか？`)) return;
  const relatedMatches = state.matches.filter(m=> m.home_team===id || m.away_team===id);
  try{
    if(relatedMatches.length) await DB.remove("gn_matches", relatedMatches.map(m=>m.id));
    await DB.remove("gn_teams", id);
    state.teams = state.teams.filter(x=>x.id!==id);
    state.matches = state.matches.filter(m=> m.home_team!==id && m.away_team!==id);
    toast("チームを外しました"); render();
  }catch(e){ toast("外せませんでした: "+(e.message||e)); }
}

/* --- リーグの対戦カードを作り直す --- */
async function rebuildLeague(){
  if(!confirm("リーグの対戦カードを、いまのチーム・ブロックで作り直します。\n入力済みの結果は消えます。よろしいですか？")) return;
  const blockIds = blocksOf(state.t).map(b=>b.id);
  const oldLeague = state.matches.filter(m=>m.stage==="league");
  const fresh = buildLeagueMatches(state.t.id, state.teams, blockIds);
  fresh.forEach(m=> m.org_id = state.user.id);
  try{
    // 変更したチーム名やブロックを先に保存
    await saveTeams(true);
    if(oldLeague.length) await DB.remove("gn_matches", oldLeague.map(m=>m.id));
    if(fresh.length) await DB.upsert("gn_matches", fresh.map(stripMatch));
    state.matches = state.matches.filter(m=>m.stage!=="league").concat(fresh);
    toast("対戦カードを作り直しました"); go("t");
  }catch(e){ console.error(e); toast("作り直せませんでした: "+(e.message||e)); }
}
function editPlayers(id, text){
  const t = state.teams.find(x=>x.id===id); if(!t) return;
  const old = t.players || [];
  t.players = text.split("\n").map(parseMemberLine).filter(Boolean).map(r=>{
    const prev = old.find(p=> p.name===r.name);       // 既にいる選手はIDを引き継ぐ（記録が消えないように）
    return { id: prev?.id || uid(), memberId: prev?.memberId || null,
             no:r.no, name:r.name, pos:r.pos, grade:r.grade };
  });
  t._dirty = true;
}
async function saveTeams(silent){
  const dirty = state.teams.filter(t=>t._dirty);
  if(!dirty.length){ if(!silent){ toast("変更はありません"); go("t"); } return; }
  try{
    await DB.upsert("gn_teams", dirty.map(t=>{
      const { id,tournament_id,org_id,name,grp,seed,sort_order,players,club_id } = t;
      return { id,tournament_id,org_id,name,grp,seed,sort_order,players,club_id };
    }));
    dirty.forEach(t=>delete t._dirty);
    if(!silent){ toast("保存しました"); go("t"); }
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); }
}

/* --- 編集 --- */
function editClub(id,k,v){
  const c = clubById(id); if(!c) return;
  c[k] = v; c._dirty = true;
}
/* 出場する大会の規模（全国／都道府県／地域）を複数トグル */
function toggleClubRegion(id, key){
  const c = clubById(id); if(!c) return;
  const arr = Array.isArray(c.regions) ? c.regions.slice() : [];
  const i = arr.indexOf(key);
  if(i>=0) arr.splice(i,1); else arr.push(key);
  c.regions = arr; c._dirty = true;
}
/* 画像を小さくして dataURL に（校章など）。max は長辺のピクセル */
function readImageResized(file, max, cb){
  if(!file){ cb(null); return; }
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*s)), h = Math.max(1, Math.round(img.height*s));
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      try{ cb(cv.toDataURL("image/png")); }catch(e){ toast("画像を読み込めませんでした"); }
    };
    img.onerror = ()=> toast("画像を読み込めませんでした");
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
/* 台帳チームの校章（管理側の編集画面用） */
function setClubCrestFromInput(clubId, input){
  const f = input.files && input.files[0]; if(!f) return;
  if(f.size > 6*1024*1024) return toast("画像が大きすぎます（6MBまで）");
  readImageResized(f, 128, durl=>{ const c=clubById(clubId); if(!c) return; c.crest=durl; c._dirty=true; render(); });
}
function clearClubCrest(clubId){ const c=clubById(clubId); if(!c) return; c.crest=null; c._dirty=true; render(); }
function editMember(id,k,v){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  m[k] = (k==="grade" && !v) ? null : v; m._dirty = true;
}
function addClub(){
  const name = prompt("チーム名を入れてください");
  if(!name || !name.trim()) return;
  state.clubs.push({ id:uid(), org_id:state.user.id, name:name.trim(),
                     category:"elem", regions:[], crest:null, note:null, _dirty:true });
  saveRoster(true);
}
function addMember(clubId){
  const c = clubById(clubId);
  const n = membersOf(clubId).length;
  state.members.push({ id:uid(), org_id:state.user.id, club_id:clubId,
    name:"", kana:null, no:null, pos:null, prev_team:null, grade:CATEGORIES[c.category]?.max?1:null,
    status:"active", sort_order:n, note:null, _dirty:true });
  render();
}
function removeMember(id){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  if(m.name && !confirm(`${m.name} を台帳から消します。よろしいですか？`)) return;
  state.members = state.members.filter(x=>x.id!==id);
  (state._deletedMembers = state._deletedMembers || []).push(id);
  render();
}
function unGraduate(id){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  const c = clubById(m.club_id);
  m.status = "active";
  m.grade = CATEGORIES[c?.category]?.max || null;
  m._dirty = true; render();
}
/* 選手を別のチームへ移す（移籍・D4） */
function moveMember(id){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  const others = state.clubs.filter(c=>c.id!==m.club_id);
  if(!others.length) return toast("移動先のチームがありません");
  const opts = others.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja"))
    .map(c=>({ v:c.id, label:`${c.name}（${CATEGORIES[c.category]?.label||""}）` }));
  chooseModal(`${m.name} を移動する先`, opts, (pick)=>{
    if(!pick) return;
    m.club_id = pick.v; m._dirty = true;
    saveRoster(true).then(()=>{ toast(`${m.name} を移動しました`); render(); });
  });
}
async function removeClub(id){
  const c = clubById(id); if(!c) return;
  const n = state.members.filter(m=>m.club_id===id).length;
  if(!confirm(`「${c.name}」を台帳から消します。\n登録されている選手 ${n}名 も一緒に消えます。\n（過去の大会の記録は残ります）\n\nよろしいですか？`)) return;
  try{
    await DB.remove("gn_clubs", id);
    state.clubs = state.clubs.filter(x=>x.id!==id);
    state.members = state.members.filter(m=>m.club_id!==id);
    toast("消しました"); go("roster");
  }catch(e){ toast("消せませんでした: "+(e.message||e)); }
}

async function saveRoster(silent){
  const dc = state.clubs.filter(c=>c._dirty);
  const dm = state.members.filter(m=>m._dirty).filter(m=>String(m.name||"").trim());
  const del = state._deletedMembers || [];
  try{
    if(del.length){ await DB.remove("gn_members", del); state._deletedMembers = []; }
    if(dc.length) await DB.upsert("gn_clubs", dc.map(stripClub));
    if(dm.length) await DB.upsert("gn_members", dm.map(stripMember));
    if(state.org?._dirty){ await DB.upsert("gn_orgs", stripOrg(state.org)); delete state.org._dirty; }
    dc.forEach(c=>delete c._dirty); dm.forEach(m=>delete m._dirty);
    if(!silent) toast("保存しました");
    render();
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); }
}
const stripClub  = c => ({ id:c.id, org_id:c.org_id, name:c.name, category:c.category, regions:Array.isArray(c.regions)?c.regions:[], crest:c.crest||null, note:c.note });
const stripMember= m => ({ id:m.id, org_id:m.org_id, club_id:m.club_id, name:m.name, kana:m.kana,
                           no:m.no, pos:m.pos, grade:m.grade, prev_team:m.prev_team||null,
                           status:m.status, sort_order:m.sort_order, note:m.note });
const stripOrg   = o => ({ id:o.id, name:o.name, year:o.year });

/* --- まとめて貼り付け --- */
function parseMemberLine(line){
  if(/^(番号|No\.?|氏名|名前)([\t,\s]|$)/i.test(line.trim())) return null;  // 見出し行はとばす
  let no=null, name="", kana=null, grade=null, pos=null, prev_team=null;
  if(/[\t,]/.test(line)){                                  // Excelから貼った場合は列の位置で読む（番号／氏名／前所属／学年／位置）
    const p = line.split(/[\t,]/).map(s=>s.trim());
    no        = /^\d{1,3}$/.test(p[0]||"") ? num(p[0]) : null;
    name      = p[1] || p[0] || "";
    prev_team = p[2] || null;
    grade     = /^\d/.test(p[3]||"") ? num(p[3]) : null;
    pos       = POSITIONS.includes(String(p[4]||"").toUpperCase()) ? p[4].toUpperCase() : null;
  }else{                                                   // 「10 山田太郎 6 FW」のような書き方（前所属はスペース区切りでは読みません）
    const rest = [];
    line.split(/\s+/).filter(Boolean).forEach(x=>{
      if(no===null && /^\d{1,3}$/.test(x)){ no = num(x); return; }
      if(pos===null && POSITIONS.includes(x.toUpperCase())){ pos = x.toUpperCase(); return; }
      if(grade===null && /^\d年?$/.test(x)){ grade = num(x); return; }
      rest.push(x);
    });
    name = rest.join(" ");
  }
  return name.trim() ? { no, name:name.trim(), kana, grade, pos, prev_team } : null;
}

function openBulkSheet(clubId){
  const c = clubById(clubId);
  const cat = CATEGORIES[c.category] || CATEGORIES.none;
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>選手をまとめて登録</h3>
    <p class="hint" style="margin-bottom:8px">1行に1人。<b>Excelからそのまま貼り付け</b>できます。列の順番は<br>
    <b>番号 / 氏名 / 前所属 / 学年 / 位置</b>（タブ・カンマ区切り）。<br>
    手で打つときは「<b>10 山田太郎 6 FW</b>」のように、番号・名前・学年・位置をスペースで区切ってください（この書き方では前所属は入りません）。番号や学年は無くてもかまいません。40人・100人でも一度に貼れます。</p>
    <textarea class="in" id="bulk-tx" style="min-height:180px" placeholder="10	山田太郎	さくら少年団	6	FW
1	佐藤花子	みどりSC	5	GK
7	鈴木一郎		4"></textarea>
    <label class="f">入れ方</label>
    <div class="seg" id="bulk-mode">
      <button class="on" data-v="add">いまの名簿に足す</button>
      <button data-v="replace">いまの名簿を入れ替える</button>
    </div>
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="bulk-ok">登録する</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  let mode = "add";
  el.querySelectorAll("#bulk-mode button").forEach(b=> b.onclick = ()=>{
    el.querySelectorAll("#bulk-mode button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); mode = b.dataset.v;
  });
  $("#bulk-ok").onclick = async ()=>{
    const rows = $("#bulk-tx").value.split("\n").map(parseMemberLine).filter(Boolean);
    if(!rows.length){ toast("読み取れる行がありませんでした"); return; }
    if(mode==="replace"){
      const old = state.members.filter(m=>m.club_id===clubId && m.status!=="graduated");
      (state._deletedMembers = state._deletedMembers || []).push(...old.map(m=>m.id));
      state.members = state.members.filter(m=>!(m.club_id===clubId && m.status!=="graduated"));
    }
    const base = membersOf(clubId).length;
    rows.forEach((r,i)=> state.members.push({
      id:uid(), org_id:state.user.id, club_id:clubId,
      name:r.name, kana:r.kana, no:r.no, pos:r.pos, prev_team:r.prev_team||null,
      grade: cat.max ? (r.grade && r.grade<=cat.max ? r.grade : null) : null,
      status:"active", sort_order:base+i, note:null, _dirty:true }));
    el.remove();
    await saveRoster(true);
    toast(`${rows.length}名を登録しました`);
  };
}

/* --- 新年度にする（進級・卒業） --- */
function promotionPreview(){
  const up = [], grad = [], stay = [];
  state.members.filter(m=>m.status!=="graduated").forEach(m=>{
    const cat = CATEGORIES[clubById(m.club_id)?.category] || CATEGORIES.none;
    if(!cat.max || !m.grade){ stay.push(m); return; }
    if(m.grade >= cat.max) grad.push(m); else up.push(m);
  });
  return { up, grad, stay };
}
function openPromoteSheet(){
  const year = orgYear();
  const { up, grad, stay } = promotionPreview();
  const byClub = {};
  grad.forEach(m=>{ const c = clubById(m.club_id); (byClub[c?.name||"—"] = byClub[c?.name||"—"]||[]).push(m.name); });
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>${year}年度 → ${year+1}年度</h3>
    <p class="hint" style="margin-bottom:10px">全員の学年を1つ上げ、最終学年の選手を卒業にします。<b>この操作はもとに戻せません</b>（卒業した選手は台帳に残り、1人ずつ「復帰」できます）。</p>
    <div class="card" style="margin-bottom:8px">
      <div class="evrow"><span class="ic">⬆️</span><span class="tx">学年が1つ上がる</span><span class="mi">${up.length}名</span></div>
      <div class="evrow"><span class="ic">🎓</span><span class="tx">卒業になる</span><span class="mi">${grad.length}名</span></div>
      ${stay.length?`<div class="evrow"><span class="ic">—</span><span class="tx">学年なし（そのまま）</span><span class="mi">${stay.length}名</span></div>`:""}
    </div>
    ${grad.length?`<div class="block-label">卒業になる選手</div>
      ${Object.entries(byClub).map(([cn,names])=>`<div class="card" style="margin-bottom:8px">
        <b style="font-size:14px">${esc(cn)}</b>
        <div class="chiprow">${names.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div></div>`).join("")}`:""}
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="pr-ok">${year+1}年度にする</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  $("#pr-ok").onclick = async ()=>{
    const { up, grad } = promotionPreview();
    up.forEach(m=>{ m.grade++; m._dirty = true; });
    grad.forEach(m=>{ m.status = "graduated"; m._dirty = true; });
    state.org = state.org || { id:state.user.id, name:state.user.code, year };
    state.org.year = year + 1; state.org._dirty = true;
    el.remove();
    await saveRoster(true);
    toast(`${year+1}年度になりました`);
  };
}

function openPickClubSheet(teamId){

function pickClub(teamId, clubId){
  const t = state.teams.find(x=>x.id===teamId); if(!t) return;
  const c = clubById(clubId);
  t.club_id = clubId;
  t.players = membersOf(clubId).map(m=>({
    id:m.id, memberId:m.id, no:m.no, name:m.name, pos:m.pos, grade:m.grade }));
  if(!t.name || /^チーム/.test(t.name)) t.name = c.name;
  t._dirty = true;
  toast(`${c.name} の ${t.players.length}名を入れました`);
  render();
}

/* --- パスで値を出し入れする --- */
function pget(o,path){ return path.split(".").reduce((a,k)=> a==null?a:a[k], o); }
function pset(o,path,v){
  const ks = path.split("."), last = ks.pop();
  let cur = o;
  ks.forEach(k=>{ if(cur[k]==null) cur[k] = /^\d+$/.test(k)?[]:{}; cur = cur[k]; });
  cur[last] = v;
}

/* ==========================================================================
   メンバー表（試合ごとの出場選手）
   ・台帳 → 大会エントリー → この試合の出場、と絞り込む「③番目の層」
   ・ここで選んだ顔ぶれを、公式記録のメンバー欄がそのまま取り込む
   ========================================================================== */
const POS_ORDER = { GK:0, DF:1, MF:2, FW:3 };
function byPosNo(a,b){ return (POS_ORDER[a.pos]??9)-(POS_ORDER[b.pos]??9) || (num(a.no)||99)-(num(b.no)||99); }
function byNo(a,b){ return (num(a.no)||99)-(num(b.no)||99); }

/* 試合にメンバー表が無ければ、大会エントリーから用意する */
function ensureLineups(m){
  if(!m.lineups) m.lineups = {};
  ["H","A"].forEach(side=>{
    const R = resolveSlot(m, side);
    const players = (teamById(R.id)?.players)||[];
    if(!m.lineups[side]){
      m.lineups[side] = { coach:"", players: players.map((p,i)=>({
        pid:p.id, memberId:p.memberId||null, no:p.no??"", name:p.name||"",
        pos:p.pos||"", grade:p.grade||null, role:"sub", captain:false, order:i })) };
    }
  });
  return m.lineups;
}
/* エントリーが後から変わったとき、追加・削除を反映する */
function syncLineup(side){
  const m = curMatchAny(); if(!m) return;
  const R = resolveSlot(m, side);
  const players = (teamById(R.id)?.players)||[];
  const lu = m.lineups[side];
  const has = new Set(lu.players.map(p=>p.pid));
  players.forEach(p=>{ if(!has.has(p.id)) lu.players.push({
    pid:p.id, memberId:p.memberId||null, no:p.no??"", name:p.name||"",
    pos:p.pos||"", grade:p.grade||null, role:"sub", captain:false, order:lu.players.length }); });
  const keep = new Set(players.map(p=>p.id));
  lu.players = lu.players.filter(p=> keep.has(p.pid));
  render(); toast("エントリーと合わせました");
}
function curMatchAny(){ return state.matches.find(x=>x.id===state.matchId); }
function orderedLineup(lu){
  const st = lu.players.filter(p=>p.role==="start").sort(byPosNo);
  const sb = lu.players.filter(p=>p.role==="sub").sort(byNo);
  return { starters:st, subs:sb, out:lu.players.filter(p=>p.role==="out") };
}

/* --- 操作 --- */
function luPlayer(side, pid){
  const m = curMatchAny(); return m?.lineups?.[side]?.players.find(p=>p.pid===pid);
}
function cycleRole(side, pid){
  const p = luPlayer(side, pid); if(!p) return;
  p.role = { sub:"start", start:"out", out:"sub" }[p.role] || "start";
  if(p.role!=="start") p.captain = false;
  render();
}
function setLu(side, pid, k, v){ const p = luPlayer(side, pid); if(p){ p[k]=v; } }
function setCoach(side, v){ const m=curMatchAny(); if(m?.lineups?.[side]) m.lineups[side].coach = v; }
function setCaptain(side, pid){
  const m = curMatchAny(); const lu = m?.lineups?.[side]; if(!lu) return;
  const p = lu.players.find(x=>x.pid===pid); const was = p.captain;
  lu.players.forEach(x=> x.captain=false);
  if(!was){ p.captain = true; if(p.role==="out") p.role="start"; }
  render();
}
function openLineup(id){
  state.matchId = id;
  const m = state.matches.find(x=>x.id===id);
  ensureLineups(m);
  state.lineupSide = "H"; state.view = "lineup"; render();
}
async function saveLineup(stay){
  const m = curMatchAny(); if(!m) return false;
  m.updated_at = new Date().toISOString();
  try{
    await DB.upsert("gn_matches", stripMatch(m));
    if(!stay) toast("メンバー表を保存しました");
    return true;
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); return false; }
}

/* --- 公式記録を、いまの試合データから下書きする --- */
/* メンバー表→公式記録のメンバー欄へ写す（force=trueで上書き） */
function applyLineupToOfficial(o, m, side, force){
  const s = o[side];
  ensureLineups(m);
  const { starters, subs } = orderedLineup(m.lineups[side]);
  const rows = [...starters, ...subs];
  const hasAny = s.lineup.some(r=>r.name);
  if(hasAny && !force) return;
  for(let i=0;i<20;i++){
    const p = rows[i];
    s.lineup[i].memberId = p ? (p.memberId||p.pid) : null;
    s.lineup[i].no   = p ? (p.no??"") : (force?"":s.lineup[i].no);
    s.lineup[i].name = p ? ((p.name||"") + (p.captain?" (C)":"")) : (force?"":s.lineup[i].name);
    s.lineup[i].pos  = p ? (p.pos||"") : (force?"":s.lineup[i].pos);
  }
}
function draftOfficial(m){
  const o = m.official ? JSON.parse(JSON.stringify(m.official)) : emptyOfficial();
  const cfg = cfgOf(state.t);
  const H = resolveSlot(m,"H"), A = resolveSlot(m,"A");
  if(!o.title)    o.title = [state.t.name, cfg.host].filter(Boolean).join("　");
  if(!o.venue)    o.venue = m.venue || "";
  if(!o.datetime && m.kickoff){
    const d = new Date(m.kickoff);
    o.datetime = `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,"0")}月${String(d.getDate()).padStart(2,"0")}日 ${fmtTime(m.kickoff)}`;
  }
  [["H",H],["A",A]].forEach(([side,R])=>{
    const s = o[side];
    if(!s.name) s.name = R.label==="—" ? "" : R.label;
    if(!s.name2) s.name2 = s.name;
    // 出場メンバーがまだ空なら、メンバー表（無ければエントリー）から写す
    applyLineupToOfficial(o, m, side, false);
    // 得点とカードを写す
    const evs = (m.events||[]).filter(e=>e.team===side);
    evs.filter(e=>e.type==="goal"||e.type==="pk").forEach(e=>{
      const nm = e.playerId ? playerName(R.id, e.playerId).replace(/^\d+\s/,"") : "";
      const row = s.lineup.find(r=> r.name.replace(/\s*\(C\)\s*$/,"")===nm);
      if(row) row.g = String(num(row.g)+1);
    });
    let ci = 0;
    evs.filter(e=>CARD_ICON[e.type]).forEach(e=>{
      if(ci>=s.cards.length) return;
      const nm = e.playerId ? playerName(R.id, e.playerId) : "";
      const c = s.cards[ci];
      if(!c.name){
        c.time = e.minute?e.minute+"分":""; c.kind = {yellow:"警",red:"退",green:"緑"}[e.type]||"";
        c.no = (nm.match(/^(\d+)\s/)||[])[1]||""; c.name = nm.replace(/^\d+\s/,"");
      }
      ci++;
    });
    if(s.scores.every(v=>v==null||v==="")){
      const total = side==="H" ? m.home_score : m.away_score;
      if(total!=null) s.scores[0] = String(total);      // 前半に仮置き（後で分けられます）
    }
    if(s.pk==null){ const pk = side==="H"?m.home_pk:m.away_pk; if(pk!=null) s.pk = String(pk); }
  });
  // 得点経過
  const goals = (m.events||[]).filter(e=>e.type==="goal"||e.type==="pk"||e.type==="og");
  if(o.goals.every(g=>!g.scorer && !g.time)){
    goals.slice(0,7).forEach((e,i)=>{
      const R = e.team==="H"?H:A;
      const nm = e.playerId ? playerName(R.id, e.playerId) : "";
      o.goals[i].time = e.minute?e.minute+"分":"";
      o.goals[i].team = (e.type==="og" ? (e.team==="H"?A.label:H.label) : R.label) || "";
      o.goals[i].no   = (nm.match(/^(\d+)\s/)||[])[1]||"";
      o.goals[i].scorer = nm.replace(/^\d+\s/,"") + (e.type==="og"?"(OG)":e.type==="pk"?"(PK)":"");
    });
  }
  return o;
}
