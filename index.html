async function createTournament(){
  if(!state.user) return toast("先にログインしてください");
  const names = draft.teams.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!draft.name.trim()) return toast("大会名を入れてください");
  if(names.length < 2)   return toast("チームを2つ以上入れてください");

  const f = FORMATS[draft.format];
  const tid = uid();
  // ブロック（部・組）を確定。空名は「1部」「2部」…で補う
  const blocks = f.hasLeague
    ? draft.blocks.map((nm,i)=>({ id:uid(), name:(nm||"").trim() || `${i+1}部` }))
    : [];
  const blockIds = blocks.map(b=>b.id);
  const pow2 = n => Math.pow(2, Math.max(1, Math.ceil(Math.log2(Math.max(2, n)))));
  const koSize = draft.format==="ko"
      ? Math.max(draft.koSize, pow2(names.length))        // チームが枠より多ければ枠を広げる
      : pow2(blocks.length * draft.advance);

  const t = {
    id:tid, org_id:state.user.id, name:draft.name.trim(),
    sport:draft.sport, format:draft.format,
    settings:{ win:3, draw:1, lose:0, host:draft.host.trim(),
               gradeCat:draft.gradeCat||null, scope:draft.scope||null,
               promote:draft.promote||0, relegate:draft.relegate||0,
               overview:{...draft.overview},
               date:draft.dateStart, dateStart:draft.dateStart, dateEnd:draft.dateEnd,
               blocks, advance:draft.advance, koSize, thirdPlace:draft.thirdPlace,
               venues:[], duration:20 },
    created_at:new Date().toISOString(),
  };

  // チーム。リーグは指定ブロックへ手動振り分け（未指定は先頭）。台帳のは選手も入れる
  const teams = names.map((name,i)=>{
    const club = draft.picked.find(p=>p.name===name);
    const bIdx = blocks.length ? (draft.assign[name] ?? 0) : null;
    return {
      id:uid(), tournament_id:tid, org_id:state.user.id, name,
      grp: blocks.length ? (blocks[Math.min(bIdx, blocks.length-1)]?.id || blocks[0].id) : null,
      seed:i+1, sort_order:i, club_id: club?.id || null,
      players: club ? membersOf(club.id).map(m=>({
        id:m.id, memberId:m.id, no:m.no, name:m.name, pos:m.pos, grade:m.grade })) : [],
    };
  });

  // 対戦カード
  let matches = [];
  if(f.hasLeague) matches = matches.concat(buildLeagueMatches(tid, teams, blockIds));
  if(f.hasKO){
    const items = draft.format==="ko"
        ? []                                              // トーナメントのみ：空櫓スタート（作成後に各枠へ配置）
        : qualifierSlots(blockIds, draft.advance);        // 予選つき：1部1位…の枠
    matches = matches.concat(buildKOMatches(tid, koSize, distributePairs(items, koSize), draft.thirdPlace));
  }
  matches.forEach(m=> m.org_id = state.user.id);

  try{
    await DB.upsert("gn_tournaments", t);
    await DB.upsert("gn_teams", teams);
    await DB.upsert("gn_matches", matches);
  }catch(e){ console.error(e); return toast("保存できませんでした: "+(e.message||e)); }

  Object.assign(draft, { name:"", host:"", dateStart:"", dateEnd:"", teams:"", picked:[], assign:{}, blocks:["1部"], gradeCat:"", scope:"", promote:0, relegate:0, overview:{...OVERVIEW_DEFAULT} });
  await reloadList();
  openTournament(tid);
}

/* 試合を「試合順」に並べる（キックオフ→ステージ→並び順） */
function matchesInOrder(){
  return state.matches.slice().sort((a,b)=>{
    if(a.kickoff && b.kickoff && a.kickoff!==b.kickoff) return a.kickoff.localeCompare(b.kickoff);
    if(a.kickoff && !b.kickoff) return -1;
    if(!a.kickoff && b.kickoff) return 1;
    if(a.stage!==b.stage) return a.stage==="league" ? -1 : 1;
    return (a.sort_order||0)-(b.sort_order||0);
  });
}

/* --- 日程・結果 --- */
function tabSchedule(){
  const ms = matchesInOrder();
  if(!ms.length) return `<div class="empty">試合がありません。</div>`;
  let out = "", lastKey = null;
  if(canEdit()) out += `<div class="btnrow noprint" style="margin-bottom:10px">
    <button class="btn sec sm" style="flex:1" onclick="go('sched')">🗓 日程・会場をまとめて入力</button></div>`;
  ms.forEach(m=>{
    const bn = blockName(state.t, m.grp);
    const key = m.stage==="league" ? (bn ? `${bn} リーグ` : "リーグ戦") : koRoundLabel(m);
    if(key!==lastKey){ out += `<div class="block-label">${esc(key)}</div>`; lastKey = key; }
    out += matchCard(m);
  });
  return out;
}

function koRoundNames(){ return (cfgOf(state.t).overview||{}).roundNames || {}; }
function koMaxRound(){
  const ko = state.matches.filter(m=>m.stage==="ko" && m.slot!==99);
  return ko.length ? Math.max(...ko.map(m=>m.round)) : Math.round(Math.log2(cfgOf(state.t).koSize||2));
}
function koMatchNo(m){   // 同回戦内の通し番号（1始まり）
  const ms = state.matches.filter(x=>x.stage==="ko" && x.round===m.round && x.slot!==99).sort((a,b)=>a.slot-b.slot);
  return ms.findIndex(x=>x.id===m.id)+1;
}
function koRoundLabel(m){
  if(m.slot===99) return "3位決定戦";
  const names = koRoundNames();                 // 本部が自由に付けた回戦名を優先
  if(names[m.round]) return names[m.round];
  const left = koMaxRound() - m.round;           // 実際の最大回戦から算出
  return ["決勝","準決勝","準々決勝"][left] || `${m.round}回戦`;   // 不戦勝はシードとして1回戦の枠に出る
}
function shortName(m){ return koRoundLabel(m) + koMatchNo(m); }

function matchCard(m){
  const sp = sportOf(state.t);
  const H = resolveSlot(m,"H"), A = resolveSlot(m,"A");
  const w = winnerOf(m);
  const st = m.status==="live" ? `<span class="badge live">試合中</span>`
           : isDone(m)         ? `<span class="badge done">終了</span>`
           : `<span class="badge todo">未実施</span>`;
  const sc = isDone(m)
    ? `<span class="${w&&w===H.id?"win":""}">${m.home_score}</span> - <span class="${w&&w===A.id?"win":""}">${m.away_score}</span>`
    : m.status==="live" ? `${m.home_score??0} - ${m.away_score??0}` : "vs";
  const pk = (m.home_pk!=null&&m.away_pk!=null) ? `<div class="pk">PK ${m.home_pk}-${m.away_pk}</div>` : "";
  const goals = (m.events||[]).filter(e=>e.type==="goal"||e.type==="pk"||e.type==="og");
  const scline = goals.length ? `<div class="scorers">⚽ ${goals.map(e=>{
      const tid = e.team==="H" ? H.id : A.id;
      const nm = e.playerId ? playerName(tid, e.playerId) : "得点";
      return esc(nm) + (e.type==="og"?"(OG)":e.type==="pk"?"(PK)":"") + (e.minute!=null?` ${minuteText(e.minute,e.period,m)}'`:"");
    }).join("、")}</div>` : "";

  return `<div class="mcard ${canEdit()?"editable":""}">
    <div class="mhead">
      <span>${m.matchNo?`<b class="mno">No.${m.matchNo}</b> `:""}${[fmtDate(m.kickoff), fmtTime(m.kickoff), m.venue].filter(Boolean).map(esc).join(" ")||"日時未定"}</span>
      ${st}
    </div>
    <${canEdit()?`button class="mbody" onclick="openMatch('${m.id}')"`:`div class="mbody"`}>
      <span class="side"><span class="tname">${esc(H.label)}</span></span>
      <span class="sc ${isDone(m)||m.status==="live"?"":"pending"}">${sc}${pk}</span>
      <span class="side away"><span class="tname">${esc(A.label)}</span></span>
    </${canEdit()?"button":"div"}>
    ${m.note?`<div class="mnote">📣 ${esc(m.note)}</div>`:""}
    ${scline}
    ${canEdit() ? (m.official&&m.official.public
      ? `<div class="mpub"><span class="pill ok">🔗 公式記録を公開中</span>
          <button class="linkbtn" onclick="goOfficialPublic('${m.id}')">見る</button>
          <button class="linkbtn" onclick="copyText('${officialLinkFor(m.id)}','リンクをコピーしました')">リンクをコピー</button>
          <button class="linkbtn" style="color:var(--bad)" onclick="toggleMatchPublic('${m.id}')">非公開にする</button></div>`
      : `<div class="mpub"><button class="linkbtn" onclick="toggleMatchPublic('${m.id}')">🔗 公式記録を公開する</button></div>`)
    : (m.official&&m.official.public
      ? `<div class="mpub"><button class="linkbtn" onclick="goOfficialPublic('${m.id}')">📄 公式記録を見る</button></div>` : "")}
  </div>`;
}
function goOfficialPublic(id){ location.hash = "om=" + id; }

const localDate = iso=>{ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const localTime = iso=>{ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
function matchStageLabel(m){

  return koRoundLabel(m);

function setSched(id, part, val){
  const m = state.matches.find(x=>x.id===id); if(!m) return;
  let d = localDate(m.kickoff), t = localTime(m.kickoff);
  if(part==="date") d=val; else t=val;
  m.kickoff = d ? new Date(`${d}T${t||"00:00"}`).toISOString() : null;
  m._sd = true;
}
function setSchedVenue(id, v){ const m=state.matches.find(x=>x.id===id); if(m){ m.venue=v; m._sd=true; } }
function renumberMatches(){
  matchesInOrder().forEach((m,i)=>{ m.matchNo=i+1; m._sd=true; });
  toast("試合番号をふり直しました"); render();

/* ブロックごとの昇格・降格・入れ替え戦の設定（旧・大会全体の promote/relegate も拾う） */
function promoConfig(b, cfg){
  const g = { up:num(cfg?.promote)||0, upPo:0, down:num(cfg?.relegate)||0, downPo:0 };
  if(!b) return g;
  const has = ["up","upPo","down","downPo"].some(k=> b[k]!=null && b[k]!=="");
  if(!has) return g;
  return { up:num(b.up)||0, upPo:num(b.upPo)||0, down:num(b.down)||0, downPo:num(b.downPo)||0 };
}
/* 順位 i（0始まり）が 自動昇格／昇格入替戦／降格入替戦／自動降格 のどれか */
const STAND_ZONES = {
  up:   { bg:"rgba(31,157,85,.17)",  mark:"▲", col:"var(--ok)",   label:"自動昇格" },
  upPo: { bg:"rgba(42,157,120,.15)", mark:"△", col:"#1c8f6a",     label:"昇格入れ替え戦" },
  downPo:{ bg:"rgba(224,147,12,.17)",mark:"▽", col:"#b8760a",     label:"降格入れ替え戦" },
  down: { bg:"rgba(214,69,61,.15)",  mark:"▼", col:"var(--bad)",  label:"自動降格" },
};
function standZone(i, n, pc){
  if(pc.up   && i < pc.up)                        return "up";
  if(pc.upPo && i < pc.up + pc.upPo)              return "upPo";
  if(pc.down && i >= n - pc.down)                 return "down";
  if(pc.downPo && i >= n - pc.down - pc.downPo)   return "downPo";
  return null;
}
function tabTable(){

  const body = (blocks.length?blocks:[null]).map(b=>{
    const rows = standings(b?b.id:null);

    return `${(b && !one)?`<div class="block-label">${esc(b.name)}</div>`:""}

      <tbody>${rows.map((r,i)=>{
        const z = standZone(i, n, pc); if(z) usedZones.add(z);
        const zc = z ? STAND_ZONES[z] : null;

        <td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?"+":""}${r.gd}</td>
      </tr>`;}).join("")}</tbody>
    </table></div>`;
  }).join("");
  const legend = ["up","upPo","downPo","down"].filter(z=>usedZones.has(z))
    .map(z=>`<span style="color:${STAND_ZONES[z].col};font-weight:700">${STAND_ZONES[z].mark} ${STAND_ZONES[z].label}</span>`).join("　");
  return body
  + `<p class="hint">勝ち${cfg.win}点／引き分け${cfg.draw}点／負け${cfg.lose}点。同点のときは 得失点差 → 総得点 → 直接対決 の順で並べます。${adv?`色つきが決勝トーナメント進出（各ブロック${adv}位まで）。`:""}${legend?`<br>${legend}`:""}</p>`
  + (canEdit()?`<div class="btnrow noprint"><button class="btn sec sm" onclick="go('settings')">⚙ リーグごとの昇格・降格・入れ替え戦を設定</button></div>`:"");
}

function koSlot(m, side){
  const r = resolveSlot(m, side);
  const w = winnerOf(m);
  const isWin = w && w===sideId(m,side);
  const cls = isWin ? "win" : r.kind==="team" ? "seed" : r.kind==="from" ? "from" : r.kind==="free" ? "seed" : "tbd";
  const sc = isDone(m) ? (side==="H"?m.home_score:m.away_score) : "";

  const pk = isDone(m) && hasPk ? `<small>(PK${side==="H"?m.home_pk:m.away_pk})</small>` : "";
  return `<div class="kobk-s ${cls}"><span class="dot"></span><span class="nm">${esc(r.label)}</span><span class="sc">${pk}${sc!==""?sc:""}</span></div>`;

function koSeedSlot(m, side){
  const r = resolveSlot(m, side);

/* --- 櫓レイアウト：フィーダー（W:/L:参照元）の中心の平均に配置。重なりは下へ押し出す --- */
const KO_GAPY = 14;
function layoutBracket(){
  const canvas = document.getElementById("koCanvas"); if(!canvas) return;
  const rounds = [...canvas.querySelectorAll(".kobk-round")];
  const center = {};                              // matchId -> 縦中心(px)
  let globalBottom = 0;
  rounds.forEach(rd=>{
    const r = +rd.dataset.r;
    const ms = state.matches.filter(m=>m.stage==="ko" && m.slot!==99 && m.round===r).sort((a,b)=>a.slot-b.slot);
    let prevBottom = -Infinity;
    ms.forEach(m=>{
      const el = document.getElementById("komt-"+m.id); if(!el) return;
      const H = el.offsetHeight || 90;
      const feeders = [];
      ["home","away"].forEach(sd=>{ const s=m[sd+"_src"]; if(s&&/^(W|L):/.test(s)){ const c=center[s.slice(2)]; if(c!=null) feeders.push(c); } });
      let c = feeders.length ? feeders.reduce((a,b)=>a+b,0)/feeders.length
                             : (prevBottom>-Infinity ? prevBottom+KO_GAPY+H/2 : H/2);
      let top = c - H/2;
      if(top < prevBottom+KO_GAPY) top = prevBottom+KO_GAPY;   // 重なり回避（単調増加）
      el.style.top = top+"px";
      center[m.id] = top+H/2; prevBottom = top+H;
      if(prevBottom>globalBottom) globalBottom = prevBottom;
    });
  });
  canvas.querySelectorAll(".kobk-rbody").forEach(b=> b.style.height=(globalBottom+6)+"px");
}
/* --- SVG曲線：前の回戦の勝者/敗者を参照する枠へ線を引く（勝者=青 / 敗者=橙） --- */
function drawLinks(){
  const svg = document.getElementById("koLinks"); if(!svg) return;
  const canvas = document.getElementById("koCanvas"); if(!canvas) return;
  const cb = canvas.getBoundingClientRect();
  svg.setAttribute("width", cb.width); svg.setAttribute("height", cb.height);
  let paths = "";
  state.matches.filter(m=>m.stage==="ko" && m.slot!==99).forEach(m=>{
    ["home","away"].forEach(sd=>{
      const src = m[sd+"_src"]; if(!src || !/^(W|L):/.test(src)) return;
      const from = document.getElementById("komt-"+src.slice(2)), to = document.getElementById("komt-"+m.id);
      if(!from || !to) return;
      const fb = from.getBoundingClientRect(), tb = to.getBoundingClientRect();
      const x1 = fb.right-cb.left, y1 = fb.top+fb.height/2-cb.top;
      const x2 = tb.left-cb.left, y2 = tb.top+(sd==="home"?tb.height*0.34:tb.height*0.72)-cb.top;
      const mxx = Math.round((x1+x2)/2);
      const col = src[0]==="L" ? "#c98a2e" : "#9fb0d6";
      // 直角のカギ線（横→縦→横）＝ふつうのトーナメント表の線
      paths += `<path d="M${x1},${Math.round(y1)} H${mxx} V${Math.round(y2)} H${x2}" fill="none" stroke="${col}" stroke-width="1.5" opacity=".85" shape-rendering="crispEdges"/>`;
    });
  });
  svg.innerHTML = paths;
}
/* 回戦名を自由に変える（本部のみ・overview.roundNamesに保存） */

/* A4横1枚に収まるよう倍率を計算して印刷 */
function printBracket(){
  const bk = document.getElementById("koBracket"), cv = document.getElementById("koCanvas");
  if(!bk || !cv){ window.print(); return; }
  layoutBracket();
  const rounds = cv.querySelector(".kobk-rounds");
  const w = rounds.scrollWidth, h = rounds.scrollHeight;
  const PW = 720, PH = 1010;                        // A4縦 印刷可能領域の目安(px・余白8mm・少し余裕)
  const scale = Math.min(PW/w, PH/h, 1);
  bk.style.setProperty("--kw", w+"px");
  bk.style.setProperty("--kh", h+"px");
  bk.style.setProperty("--ks", scale);
  const done = ()=>{ document.body.classList.remove("pbk"); bk.style.removeProperty("--kw"); bk.style.removeProperty("--kh"); bk.style.removeProperty("--ks"); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  document.body.classList.add("pbk");
  setTimeout(()=>window.print(), 60);
  setTimeout(done, 4000);                           // 保険（afterprintが来ない環境用）
}

      <div class="hint" style="margin:0 0 6px">第${i+1}試合</div>
      ${sel(m,"home")}<div style="height:6px"></div>${sel(m,"away")}
    </div>`).join("")}
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="seed-ok">この組み合わせにする</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  $("#seed-ok").onclick = async ()=>{
    const touched = new Map();
    el.querySelectorAll("select[data-m]").forEach(s=>{
      const m = state.matches.find(x=>x.id===s.dataset.m); if(!m) return;
      assignSide(m, s.dataset.s, s.value || null);
      touched.set(m.id, m);
    });
    el.remove();
    try{
      await DB.upsert("gn_matches", [...touched.values()].map(stripMatch));
      toast("組み合わせを保存しました");
    }catch(e){ toast("保存できませんでした: "+(e.message||e)); }
    render();
  };
}

/* --- 出場記録（選手ごとの 試合数・出場時間・得点。保護者・一般も閲覧可） --- */
function tabAppearances(){
  const teamsOut = [];
  state.teams.forEach(t=>{
    const stat = new Map();  // 選手名 -> {no, pid, games, goals}
    const ensure = (name, no, pid)=>{
      let s = stat.get(name);
      if(!s){ s = { no:no??null, pid:pid??null, games:0, goals:0 }; stat.set(name, s); }
      if(no!=null && s.no==null) s.no = no;
      if(pid!=null && s.pid==null) s.pid = pid;
      return s;
    };
    state.matches.forEach(m=>{
      ["H","A"].forEach(side=>{
        if(resolveSlot(m, side).id !== t.id) return;
        const lu = m.lineups && m.lineups[side];
        if(lu) lu.players.forEach(p=>{
          if(p.role==="out" || !p.name) return;
          const s = ensure(p.name, p.no, p.pid);
          // 試合数＝実際にピッチに立った試合だけ数える。先発は必ず・途中出場は交代の記録があるときだけ（控えのままは数えない）
          const cameOn = p.role==="start" || (m.events||[]).some(e=> e.type==="sub" && e.team===side && e.playerId===p.pid);
          if(cameOn) s.games++;
        });
        (m.events||[]).filter(e=>e.team===side && (e.type==="goal"||e.type==="pk")).forEach(e=>{
          if(!e.playerId) return;
          const full = playerName(t.id, e.playerId);
          const no = (full.match(/^(\d+)\s/)||[])[1];
          const name = full.replace(/^\d+\s/,"");
          ensure(name, no?num(no):null, e.playerId).goals++;
        });
      });
    });
    if(stat.size) teamsOut.push({ team:t.name, teamId:t.id,
      players:[...stat.entries()].map(([name,s])=>({name,...s})).sort((a,b)=>(a.no??999)-(b.no??999)) });
  });
  if(!teamsOut.length) return `<div class="empty">まだ出場の記録がありません。<br>試合ごとにメンバー表を作ると、ここに出場した試合数がまとまります。</div>`;
  return teamsOut.map(r=>`<details class="team-acc">
    <summary class="pick"><span style="min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.team)}</span>
      <span class="meta">${r.players.length}名</span></span><span class="chev">›</span></summary>
    <div class="tblwrap"><table>
      <thead><tr><th>番号</th><th style="text-align:left">選手</th><th>試合</th><th>時間</th><th>得点</th></tr></thead>
      <tbody>${r.players.map(p=>{
        const manual = playTimeOf(r.teamId,p.name);
        const auto = p.pid!=null ? autoPlayMinutes(r.teamId, p.pid) : 0;
        const shown = manual || (auto ? String(auto) : "");
        return `<tr>
        <td>${p.no??""}</td><td class="nm">${esc(p.name)}</td>
        <td class="pt">${p.games||""}</td>
        <td>${canEdit()
          ? `<input class="in" style="padding:5px;width:58px;text-align:center" value="${esc(shown)}" placeholder="分" onchange="setPlayTime('${r.teamId}','${esc(p.name).replace(/'/g,"\\'")}',this.value)">`
          : esc(shown)}</td>
        <td>${p.goals||""}</td>
      </tr>`;}).join("")}</tbody>
    </table></div>
  </details>`).join("")
    + `<p class="hint">チーム名をタップすると出場記録が開きます。各試合のメンバー表（スタメン／控え）と得点から集計しています。<b>時間</b>は選手交代の記録から自動計算します（アディショナルタイムは含めません）。手で書き換えるとその数字が優先されます。</p>`;
}
/* 出場時間。書き換えていれば settings.playtime（チームid/選手名）の手入力を優先、無ければ自動計算値を使う */
function playTimeOf(teamId, name){
  const pt = (state.t && state.t.settings && state.t.settings.playtime) || {};
  return pt[teamId+"/"+name] || "";
}
async function setPlayTime(teamId, name, v){
  const s = state.t.settings = state.t.settings || {};
  s.playtime = s.playtime || {};
  const key = teamId+"/"+name;
  if(String(v).trim()==="") delete s.playtime[key]; else s.playtime[key] = String(v).trim();
  try{
    const { id,org_id,name:tn,sport,format,settings,created_at } = state.t;
    await DB.upsert("gn_tournaments", { id,org_id,name:tn,sport,format,settings,created_at });
  }catch(e){ console.error(e); }
}

/* 「試合を終了する」は取り消しにくい操作なので確認する（誤タップ防止） */
function setMatchDone(){
  const m = curMatch(); if(!m) return;
  if(m.status==="done") return;
  if(!confirm("この試合を「終了」にします。以降は内容を変更できなくなります（後から「修正する」で直せます）。よろしいですか？")) return;
  setField('status','done');
}

function curMatch(){ return state.matches.find(x=>x.id===state.matchId); }
function bump(side, d){
  const m = curMatch(); if(!m) return;
  const k = side==="home" ? "home_score" : "away_score";
  m[k] = Math.max(0, (m[k]??0) + d);
  if(m.status==="todo") m.status = "live";
  render();
}
function setField(k,v){
  const m = curMatch(); if(!m) return;
  m[k] = v;
  if(k==="status") render();
}
/* 結果入力画面から公式記録のヘッダー項目（審判・天候など）を直接入れる */
function ensureMatchOfficial(m){ if(!m.official) m.official = draftOfficial(m); return m.official; }
function setOfficialField(path, v){ const m = curMatch(); if(!m) return; pset(ensureMatchOfficial(m), path, v); }
/* キックオフ＝コイントスで決めたチーム。もう一度押すと解除（結果を入れる画面から決める。公式記録は表示だけ） */
function setKickoffTeam(v){
  const m = curMatch(); if(!m) return;
  const of = ensureMatchOfficial(m);
  of.kickoffTeam = of.kickoffTeam===v ? null : v;
  render();
}
function setKickoff(v){
  const m = curMatch(); if(!m) return;
  m.kickoff = v ? new Date(v).toISOString() : null;
}
/* 記録の行をタップ → 種類に応じた編集シートを開く（得点者を空欄にする、時間を直すなどいろいろ変更できる） */
function editEvent(i){
  const m = curMatch(); if(!m) return;
  const ev = (m.events||[])[i]; if(!ev) return;
  if(ev.type==="sub") openSubSheet(i);
  else openEventSheet((ev.type==="goal"||ev.type==="pk"||ev.type==="og") ? "goal" : "card", i);
}
function delEvent(i){
  const m = curMatch(); if(!m) return;
  const ev = (m.events||[])[i];
  // 得点イベントを消すときは合計点も1つ戻す（前後半スコアと合計をそろえる）
  if(ev && (ev.type==="goal"||ev.type==="pk"||ev.type==="og")){
    const scoringSide = ev.type==="og" ? (ev.team==="H"?"away":"home") : (ev.team==="H"?"home":"away");
    m[scoringSide+"_score"] = Math.max(0, (m[scoringSide+"_score"]??0) - 1);
  }
  m.events = (m.events||[]).filter((_,j)=>j!==i);
  render();
}
/* 延長を使う／やめる */
function toggleET(on){
  const m = curMatch(); if(!m) return;
  if(!on && (m.events||[]).some(e=>e.period==="1ET"||e.period==="2ET"))
    return toast("延長の記録が入っています。先に消してください");
  setMatchET(m, on); render();
}

/* --- 得点者・カードの追加／編集シート --- */
function openEventSheet(kind, editIdx){
  const m = curMatch(); if(!m) return;
  const editing = editIdx!=null;
  const orig = editing ? m.events[editIdx] : null;
  const H = resolveSlot(m,"H"), A = resolveSlot(m,"A");
  const sp = sportOf(state.t);
  const types = kind==="goal"
    ? [["goal","得点"],["pk","PK"],["og","オウンゴール"]]
    : [["yellow","🟨 警告"],["red","🟥 退場"],["green","🟩 グリーン"]];
  const periods = PERIOD_REG.concat(matchETPlayed(m)?PERIOD_ET:[]);
  const hasAssist = kind==="goal";   // アシストは得点者と同じように毎回選べる（大会設定でのON/OFFは廃止）
  let team = editing ? orig.team : "H";
  let type = editing ? orig.type : types[0][0];
  let period = editing ? (orig.period || periods[0]) : periods[0];
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>${editing ? (kind==="goal"?"得点を編集":"カードを編集") : (kind==="goal"?"得点を追加":"カードを追加")}</h3>
    <label class="f">どちらのチーム</label>
    <div class="seg" id="ev-team">
      <button class="${team==="H"?"on":""}" data-v="H">${esc(H.label)}</button>
      <button class="${team==="A"?"on":""}" data-v="A">${esc(A.label)}</button>
    </div>
    <label class="f">選手（この試合の出場選手から選べます・見つからなければ空欄でもOK）</label>
    <select class="in" id="ev-player"></select>
    ${hasAssist ? `<div id="ev-assist-wrap">
      <label class="f">アシスト（あれば選ぶ・任意）</label>
      <select class="in" id="ev-assist"></select>
    </div>` : ""}
    <label class="f">種類</label>
    <div class="seg" id="ev-type">
      ${types.map(t=>`<button class="${t[0]===type?"on":""}" data-v="${t[0]}">${esc(t[1])}</button>`).join("")}
    </div>
    <label class="f">時間帯</label>
    <div class="seg" id="ev-period">
      ${periods.map(p=>`<button class="${p===period?"on":""}" data-v="${p}">${esc(PERIODS[p])}</button>`).join("")}
    </div>
    <label class="f">分（こまかい時間・入れなくてOK）</label>
    <input class="in" id="ev-min" type="number" inputmode="numeric" placeholder="例）23" value="${editing&&orig.minute!=null?orig.minute:""}">
    <div class="btnrow">
      ${editing?`<button class="btn danger" onclick="this.closest('.modal').remove();delEvent(${editIdx})">削除</button>`:""}
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="ev-ok">${editing?"保存":"追加"}</button>
    </div>
  </div>`;
  document.body.appendChild(el);

  const fillPlayers = (applyOrig)=>{
    const ps = participantsOf(m, team);
    $("#ev-player").innerHTML = ps.length
      ? `<option value="">（選手を選ぶ・空欄でもOK）</option>` + ps.map(p=>
          `<option value="${p.id}">${p.no?esc(String(p.no))+" ":""}${esc(p.name)}</option>`).join("")
      : `<option value="">出場選手が未登録です</option>`;
    if(editing && applyOrig) $("#ev-player").value = orig.playerId || "";
    if(hasAssist) fillAssist(applyOrig);
  };
  const fillAssist = (applyOrig)=>{
    const box = $("#ev-assist"); if(!box) return;
    const scorer = $("#ev-player").value;
    const ps = participantsOf(m, team).filter(p=> p.id!==scorer);   // 得点者本人は除く
    box.innerHTML = `<option value="">（なし）</option>` + ps.map(p=>
      `<option value="${p.id}">${p.no?esc(String(p.no))+" ":""}${esc(p.name)}</option>`).join("");
    if(editing && applyOrig) box.value = orig.assistId || "";
  };
  const syncAssistVisibility = ()=>{
    const wrap = $("#ev-assist-wrap"); if(!wrap) return;
    wrap.style.display = type==="goal" ? "" : "none";   // PK・オウンゴールにはアシストなし
  };
  fillPlayers(true);
  if(hasAssist){ syncAssistVisibility(); $("#ev-player").onchange = ()=>fillAssist(false); }
  el.querySelectorAll("#ev-team button").forEach(b=> b.onclick = ()=>{
    el.querySelectorAll("#ev-team button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); team = b.dataset.v; fillPlayers(false);
  });
  el.querySelectorAll("#ev-type button").forEach(b=> b.onclick = ()=>{
    el.querySelectorAll("#ev-type button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); type = b.dataset.v;
    if(hasAssist) syncAssistVisibility();
  });
  el.querySelectorAll("#ev-period button").forEach(b=> b.onclick = ()=>{
    el.querySelectorAll("#ev-period button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); period = b.dataset.v;
  });
  $("#ev-ok").onclick = ()=>{
    const pid = $("#ev-player").value || null;
    const assistId = (hasAssist && type==="goal") ? ($("#ev-assist").value || null) : null;
    const minute = $("#ev-min").value ? num($("#ev-min").value) : null;
    m.events = m.events || [];
    const isScoring = t => t==="goal"||t==="pk"||t==="og";
    if(editing){
      if(isScoring(orig.type)){   // 元の得点ぶんを一旦戻す
        const oldSide = scoringSideOf(orig)==="H" ? "home" : "away";
        m[oldSide+"_score"] = Math.max(0, (m[oldSide+"_score"]??0) - 1);
      }
      m.events[editIdx] = { type, team, playerId:pid, assistId, minute, period };
      if(isScoring(type)){
        m.home_score = m.home_score ?? 0; m.away_score = m.away_score ?? 0;
        const newSide = scoringSideOf({type,team})==="H" ? "home" : "away";
        m[newSide+"_score"]++;
      }
    } else {
      m.events.push({ type, team, playerId:pid, assistId, minute, period });
      if(isScoring(type)){
        m.home_score = m.home_score ?? 0; m.away_score = m.away_score ?? 0;
        const newSide = scoringSideOf({type,team})==="H" ? "home" : "away";
        m[newSide+"_score"]++;
        if(m.status==="todo") m.status = "live";
      }
    }
    sortEvents(m);
    el.remove(); render();
  };
}
/* イベントを 時間帯→分 の順に並べる */
function sortEvents(m){
  const pIdx = p => ["1H","HT","2H","1ET","2ET"].indexOf(p||"1H");
  (m.events||[]).sort((a,b)=> pIdx(a.period)-pIdx(b.period) || (a.minute??999)-(b.minute??999));
}
/* --- 選手交代の追加シート --- */
function openSubSheet(editIdx){
  const m = curMatch(); if(!m) return;
  const editing = editIdx!=null;
  const orig = editing ? m.events[editIdx] : null;
  const H = resolveSlot(m,"H"), A = resolveSlot(m,"A");
  const periods = PERIOD_REG.concat(matchETPlayed(m)?PERIOD_ET:[]);
  let team = editing ? orig.team : "H";
  let period = editing ? (orig.period || periods[0]) : periods[0];
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>選手交代を${editing?"編集":"追加"}</h3>
    <label class="f">どちらのチーム</label>
    <div class="seg" id="sub-team">
      <button class="${team==="H"?"on":""}" data-v="H">${esc(H.label)}</button>
      <button class="${team==="A"?"on":""}" data-v="A">${esc(A.label)}</button>
    </div>
    <label class="f">OUT（下がる選手）</label>
    <select class="in" id="sub-out"></select>
    <label class="f">IN（入る選手）</label>
    <select class="in" id="sub-in"></select>
    <label class="f">時間帯</label>
    <div class="seg" id="sub-period">
      ${periods.map(p=>`<button class="${p===period?"on":""}" data-v="${p}">${esc(PERIODS[p])}</button>`).join("")}
      <button class="${period==="HT"?"on":""}" data-v="HT">HT（ハーフタイム）</button>
    </div>
    <div id="sub-min-wrap" style="${period==="HT"?"display:none":""}">
      <label class="f">分（入れなくてOK）</label>
      <input class="in" id="sub-min" type="number" inputmode="numeric" placeholder="例）60" value="${editing&&orig.minute!=null?orig.minute:""}">
    </div>
    <div class="btnrow">
      ${editing?`<button class="btn danger" onclick="this.closest('.modal').remove();delEvent(${editIdx})">削除</button>`:""}
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="sub-ok">${editing?"保存":"追加"}</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  const optHTML = list => `<option value="">（選手を選ぶ）</option>` + list.map(p=>
      `<option value="${p.id}">${p.no?esc(String(p.no))+" ":""}${esc(p.name)}</option>`).join("");
  const fill = (applyOrig)=>{
    const sets = subFieldSets(m, team, editing?editIdx:undefined);
    $("#sub-out").innerHTML = optHTML(sets.out);   // 今ピッチにいる選手だけ（編集中は自分自身のOUTも含む）
    $("#sub-in").innerHTML  = optHTML(sets.in);    // まだ出ていない控えだけ（編集中は自分自身のINも含む）
    if(editing && applyOrig){
      $("#sub-out").value = orig.outId || "";
      $("#sub-in").value  = orig.playerId || "";
    }
  };
  fill(true);
  el.querySelectorAll("#sub-team button").forEach(b=> b.onclick = ()=>{
    el.querySelectorAll("#sub-team button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); team=b.dataset.v; fill(false);
  });
  el.querySelectorAll("#sub-period button").forEach(b=> b.onclick = ()=>{
    el.querySelectorAll("#sub-period button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); period=b.dataset.v;
    $("#sub-min-wrap").style.display = period==="HT" ? "none" : "";   // HT交代は「分」を使わない
  });
  $("#sub-ok").onclick = ()=>{
    const outId = $("#sub-out").value || null;
    const inId  = $("#sub-in").value || null;
    if(!outId && !inId) return toast("OUTかINの選手を選んでください");
    const minute = (period==="HT" || !$("#sub-min").value) ? null : num($("#sub-min").value);
    m.events = m.events || [];
    const ev = { type:"sub", team, outId, playerId:inId, minute, period };
    if(editing) m.events[editIdx] = ev; else m.events.push(ev);
    sortEvents(m);
    el.remove(); render();
  };
}

async function saveMatch(stay){
  const m = curMatch(); if(!m) return false;
  if(m.status==="done" && (m.home_score==null || m.away_score==null)){
    m.home_score = m.home_score??0; m.away_score = m.away_score??0;
  }
  m.updated_at = new Date().toISOString();
  try{
    await DB.upsert("gn_matches", stripMatch(m));
    toast("保存しました");
    if(!stay) go("t");
    return true;
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); return false; }
}
function stripMatch(m){
  const { id,tournament_id,org_id,stage,grp,round,slot,matchNo,home_team,away_team,home_src,away_src,
          kickoff,venue,home_score,away_score,home_pk,away_pk,status,events,note,sort_order,
          updated_at,official,lineups } = m;
  return { id,tournament_id,org_id,stage,grp,round,slot,matchNo,home_team,away_team,home_src,away_src,
           kickoff,venue,home_score,away_score,home_pk,away_pk,status,events,note,sort_order,
           updated_at,official,lineups };
}

function editTeam(id,k,v){
  const t = state.teams.find(x=>x.id===id); if(!t) return;
  t[k] = v; t._dirty = true;
}
/* --- チームの追加・削除（H2） --- */
function addTeamToTournament(name, clubId){
  const nm = name || prompt("追加するチーム名");
  if(!nm || !nm.trim()) return;
  const blocks = blocksOf(state.t);
  const club = clubId ? clubById(clubId) : null;
  const t = { id:uid(), tournament_id:state.t.id, org_id:state.user.id, name:nm.trim(),
    grp: blocks.length ? blocks[0].id : null,
    seed: state.teams.length+1, sort_order: state.teams.length, club_id: clubId||null,
    players: club ? membersOf(clubId).map(m=>({ id:m.id, memberId:m.id, no:m.no, name:m.name, pos:m.pos, grade:m.grade })) : [],
    _dirty:true };
  state.teams.push(t);
  if(!name) render();
  return t;
}
async function removeTeam(id){
  const t = state.teams.find(x=>x.id===id); if(!t) return;
  if(!confirm(`「${t.name}」を大会から外します。\nこのチームの試合カードも消えます。よろしいですか？`)) return;
  const relatedMatches = state.matches.filter(m=> m.home_team===id || m.away_team===id);
  try{
    if(relatedMatches.length) await DB.remove("gn_matches", relatedMatches.map(m=>m.id));
    await DB.remove("gn_teams", id);
    state.teams = state.teams.filter(x=>x.id!==id);
    state.matches = state.matches.filter(m=> m.home_team!==id && m.away_team!==id);
    toast("チームを外しました"); render();
  }catch(e){ toast("外せませんでした: "+(e.message||e)); }
}
function openPickClubsForTournament(){
  const inTourn = new Set(state.teams.map(t=>t.club_id).filter(Boolean));
  const avail = state.clubs.filter(c=>!inTourn.has(c.id));
  if(!avail.length) return toast("台帳のチームは全て入っています");
  const el = document.createElement("div"); el.className="modal";
  el.innerHTML = `<div class="sheet"><h3>台帳からチームを追加</h3>
    ${avail.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja")).map(c=>
      `<label class="pick" style="cursor:pointer"><span style="min-width:0"><span style="display:block">${esc(c.name)}</span>
      <span class="meta">${esc(CATEGORIES[c.category]?.label||"")}・${membersOf(c.id).length}名</span></span>
      <input type="checkbox" data-id="${c.id}" style="width:22px;height:22px;flex-shrink:0"></label>`).join("")}
    <div class="btnrow"><button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="pt-ok">追加する</button></div></div>`;
  document.body.appendChild(el);
  $("#pt-ok").onclick=()=>{
    [...el.querySelectorAll("input:checked")].forEach(i=>{
      const c=clubById(i.dataset.id); addTeamToTournament(c.name, c.id);
    });
    el.remove(); saveTeams(true); render();
  };
}
/* --- リーグの対戦カードを作り直す --- */
async function rebuildLeague(){
  if(!confirm("リーグの対戦カードを、いまのチーム・ブロックで作り直します。\n入力済みの結果は消えます。よろしいですか？")) return;
  const blockIds = blocksOf(state.t).map(b=>b.id);
  const oldLeague = state.matches.filter(m=>m.stage==="league");
  const fresh = buildLeagueMatches(state.t.id, state.teams, blockIds);
  fresh.forEach(m=> m.org_id = state.user.id);
  try{
    // 変更したチーム名やブロックを先に保存
    await saveTeams(true);
    if(oldLeague.length) await DB.remove("gn_matches", oldLeague.map(m=>m.id));
    if(fresh.length) await DB.upsert("gn_matches", fresh.map(stripMatch));
    state.matches = state.matches.filter(m=>m.stage!=="league").concat(fresh);
    toast("対戦カードを作り直しました"); go("t");
  }catch(e){ console.error(e); toast("作り直せませんでした: "+(e.message||e)); }
}
function editPlayers(id, text){
  const t = state.teams.find(x=>x.id===id); if(!t) return;
  const old = t.players || [];
  t.players = text.split("\n").map(parseMemberLine).filter(Boolean).map(r=>{
    const prev = old.find(p=> p.name===r.name);       // 既にいる選手はIDを引き継ぐ（記録が消えないように）
    return { id: prev?.id || uid(), memberId: prev?.memberId || null,
             no:r.no, name:r.name, pos:r.pos, grade:r.grade };
  });
  t._dirty = true;
}
async function saveTeams(silent){
  const dirty = state.teams.filter(t=>t._dirty);
  if(!dirty.length){ if(!silent){ toast("変更はありません"); go("t"); } return; }
  try{
    await DB.upsert("gn_teams", dirty.map(t=>{
      const { id,tournament_id,org_id,name,grp,seed,sort_order,players,club_id } = t;
      return { id,tournament_id,org_id,name,grp,seed,sort_order,players,club_id };
    }));
    dirty.forEach(t=>delete t._dirty);
    if(!silent){ toast("保存しました"); go("t"); }
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); }
}

const clubById   = id => state.clubs.find(c=>c.id===id) || null;

function viewRoster(){
  const year = orgYear();

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div><b style="font-size:19px">${year}年度</b>
          <div class="hint" style="margin:2px 0 0">${year}年4月 〜 ${year+1}年3月</div></div>
        <button class="btn sm sec" onclick="openPromoteSheet()">新年度にする</button>
      </div>
    </div>
    <div class="block-label">チーム（${state.clubs.length}）</div>
    ${state.clubs.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja")).map(c=>{
      const n = membersOf(c.id).length;
      const g = state.members.filter(m=>m.club_id===c.id && m.status==="graduated").length;
      return `<button class="pick" onclick="openClub('${c.id}')">
        ${c.crest?`<img src="${c.crest}" alt="" style="width:34px;height:34px;object-fit:contain;border-radius:6px;background:#fff;flex:0 0 auto;margin-right:4px">`:""}
        <span style="min-width:0"><span style="display:block">${esc(c.name)}</span>
        <span class="meta">${esc(CATEGORIES[c.category]?.label||"")}・在籍 ${n}名${g?`（卒業 ${g}名）`:""}</span></span>
        <span class="chev">›</span></button>`;
    }).join("") || `<div class="empty">まだチームがありません。</div>`}
    <button class="btn" onclick="addClub()">＋ チームを追加</button>
    <div class="btnrow" style="margin-top:6px">
      <button class="btn sec sm" style="flex:1" onclick="openClubBulkAdd()">📋 チーム名をまとめて作る</button>
      <button class="btn sec sm" style="flex:1" onclick="openClubEntryLinks()">📨 記入リンクを配る</button>
    </div>
    <p class="hint">各チームに「記入リンク」を配ると、チームがログイン不要でチーム名・選手を登録できます（初年度の登録に便利）。</p>
  </div>`;
}
/* チーム名をまとめて作る（記入リンクを配る前の枠づくり） */
function openClubBulkAdd(){
  const el = document.createElement("div"); el.className="modal";
  el.innerHTML = `<div class="sheet">
    <h3>チーム名をまとめて作る</h3>
    <p class="hint" style="margin-bottom:8px">1行に1チーム名。ここで作った枠に「記入リンク」を出して各チームに配れます。区分はあとで各チームが直せます。</p>
    <textarea class="in" id="cba-tx" style="min-height:150px" placeholder="さくら小学校
みどりFC
第三小学校"></textarea>
    <label class="f">区分（とりあえずの初期値）</label>
    <div class="seg" id="cba-cat">${["elem","jhs","hs","univ"].map((k,i)=>
      `<button class="${i===0?"on":""}" data-v="${k}">${esc(CATEGORIES[k].label)}</button>`).join("")}</div>
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="cba-ok">作る</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  let cat="elem";
  el.querySelectorAll("#cba-cat button").forEach(b=> b.onclick=()=>{
    el.querySelectorAll("#cba-cat button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); cat=b.dataset.v; });
  $("#cba-ok").onclick = async ()=>{
    const names = $("#cba-tx").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!names.length) return toast("チーム名を入れてください");
    names.forEach(nm=> state.clubs.push({ id:uid(), org_id:state.user.id, name:nm,
      category:cat, regions:[], crest:null, note:null, _dirty:true }));
    el.remove(); await saveRoster(true); toast(`${names.length}チームを作りました`);
  };
}

function viewClub(){
  const c = clubById(state.clubId);
  if(!c) return topbar({title:"チーム", back:"go('roster')"}) + `<div class="empty">見つかりません。</div>`;
  const cat = CATEGORIES[c.category] || CATEGORIES.none;
  const ms = membersOf(c.id, state.showGrads);
  const grads = state.members.filter(m=>m.club_id===c.id && m.status==="graduated").length;

  const row = m=>{
    const isG = m.status==="graduated";
    return `<tr style="${isG?"opacity:.5":""}">
      <td style="width:52px"><input class="in" style="padding:7px;text-align:center" type="number" inputmode="numeric"
        value="${m.no??""}" onchange="editMember('${m.id}','no',this.value===''?null:+this.value)"></td>
      <td style="text-align:left;min-width:96px"><input class="in" style="padding:7px" value="${esc(m.name)}"
        onchange="editMember('${m.id}','name',this.value)"></td>
      <td style="text-align:left;min-width:96px"><input class="in" style="padding:7px" value="${esc(m.prev_team||'')}"
        placeholder="前所属" onchange="editMember('${m.id}','prev_team',this.value||null)"></td>
      ${cat.max?`<td style="width:64px"><select class="in" style="padding:7px" onchange="editMember('${m.id}','grade',+this.value)">
        <option value="0">-</option>
        ${Array.from({length:cat.max},(_,i)=>i+1).map(g=>
          `<option value="${g}" ${m.grade===g?"selected":""}>${g}${cat.suffix}</option>`).join("")}
      </select></td>`:""}
      <td style="width:66px"><select class="in" style="padding:7px" onchange="editMember('${m.id}','pos',this.value||null)">
        <option value="">-</option>
        ${POSITIONS.map(p=>`<option value="${p}" ${m.pos===p?"selected":""}>${p}</option>`).join("")}
      </select></td>
      <td style="width:52px;white-space:nowrap">
        <button class="del" style="color:${isG?"var(--accent)":"var(--bad)"};font-size:11px;font-weight:700;padding:4px 3px"
        onclick="${isG?`unGraduate('${m.id}')`:`removeMember('${m.id}')`}">${isG?"復帰":"削除"}</button></td>
    </tr>`;
  };

  return topbar({ title:c.name, sub:`${cat.label}・${orgYear()}年度`, back:"go('roster')" })
  + `<div class="screen">
    <div class="card">
      <label class="f">チーム名</label>
      <input class="in" value="${esc(c.name)}" onchange="editClub('${c.id}','name',this.value)">
      <label class="f">校章・エンブレム（任意）</label>
      <div style="display:flex;align-items:center;gap:12px">

        <div>
          <label class="btn sec sm" style="width:auto;cursor:pointer;display:inline-block">画像を選ぶ<input type="file" accept="image/*" style="display:none" onchange="setClubCrestFromInput('${c.id}',this)"></label>
          ${c.crest?`<button class="btn ghost sm" style="width:auto;margin-left:6px" onclick="clearClubCrest('${c.id}')">消す</button>`:""}
        </div>
      </div>
      <label class="f">区分（卒業の判定に使います）</label>
      <div class="seg">${Object.entries(CATEGORIES).map(([k,v])=>
        `<button class="${c.category===k?"on":""}" onclick="editClub('${c.id}','category','${k}');render()">${esc(v.label)}</button>`).join("")}</div>

      <label class="f">出場する大会の規模（あてはまるものを選ぶ・複数OK）</label>
      <div class="seg">${Object.entries(SCOPES).map(([k,v])=>
        `<button class="${(c.regions||[]).includes(k)?"on":""}" onclick="toggleClubRegion('${c.id}','${k}');render()">${esc(v.label)}</button>`).join("")}</div>
      <p class="hint">全国・都道府県・地域のどの大会に出るか。重ねて選べます（例：全国＋都道府県）。大会をつくるとき、ここで選んだ規模に合うチームだけが呼び出せます。</p>
    </div>

    <div class="block-label">選手（${membersOf(c.id).length}名）</div>

    </div>
    ${grads?`<div class="btnrow"><button class="btn ghost sm" onclick="state.showGrads=!state.showGrads;render()">

/* --- 編集 --- */
function editClub(id,k,v){
  const c = clubById(id); if(!c) return;
  c[k] = v; c._dirty = true;
}
/* 出場する大会の規模（全国／都道府県／地域）を複数トグル */
function toggleClubRegion(id, key){
  const c = clubById(id); if(!c) return;
  const arr = Array.isArray(c.regions) ? c.regions.slice() : [];
  const i = arr.indexOf(key);
  if(i>=0) arr.splice(i,1); else arr.push(key);
  c.regions = arr; c._dirty = true;
}
/* 画像を小さくして dataURL に（校章など）。max は長辺のピクセル */
function readImageResized(file, max, cb){
  if(!file){ cb(null); return; }
  const rd = new FileReader();
  rd.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*s)), h = Math.max(1, Math.round(img.height*s));
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      try{ cb(cv.toDataURL("image/png")); }catch(e){ toast("画像を読み込めませんでした"); }
    };
    img.onerror = ()=> toast("画像を読み込めませんでした");
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
/* 台帳チームの校章（管理側の編集画面用） */
function setClubCrestFromInput(clubId, input){
  const f = input.files && input.files[0]; if(!f) return;
  if(f.size > 6*1024*1024) return toast("画像が大きすぎます（6MBまで）");
  readImageResized(f, 128, durl=>{ const c=clubById(clubId); if(!c) return; c.crest=durl; c._dirty=true; render(); });
}
function clearClubCrest(clubId){ const c=clubById(clubId); if(!c) return; c.crest=null; c._dirty=true; render(); }
function editMember(id,k,v){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  m[k] = (k==="grade" && !v) ? null : v; m._dirty = true;
}
function addClub(){
  const name = prompt("チーム名を入れてください");
  if(!name || !name.trim()) return;
  state.clubs.push({ id:uid(), org_id:state.user.id, name:name.trim(),
                     category:"elem", regions:[], crest:null, note:null, _dirty:true });
  saveRoster(true);
}
function addMember(clubId){
  const c = clubById(clubId);
  const n = membersOf(clubId).length;
  state.members.push({ id:uid(), org_id:state.user.id, club_id:clubId,
    name:"", kana:null, no:null, pos:null, prev_team:null, grade:CATEGORIES[c.category]?.max?1:null,
    status:"active", sort_order:n, note:null, _dirty:true });
  render();
}
function removeMember(id){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  if(m.name && !confirm(`${m.name} を台帳から消します。よろしいですか？`)) return;
  state.members = state.members.filter(x=>x.id!==id);
  (state._deletedMembers = state._deletedMembers || []).push(id);
  render();
}
function unGraduate(id){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  const c = clubById(m.club_id);
  m.status = "active";
  m.grade = CATEGORIES[c?.category]?.max || null;
  m._dirty = true; render();
}
/* 選手を別のチームへ移す（移籍・D4） */
function moveMember(id){
  const m = state.members.find(x=>x.id===id); if(!m) return;
  const others = state.clubs.filter(c=>c.id!==m.club_id);
  if(!others.length) return toast("移動先のチームがありません");
  const opts = others.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),"ja"))
    .map(c=>({ v:c.id, label:`${c.name}（${CATEGORIES[c.category]?.label||""}）` }));
  chooseModal(`${m.name} を移動する先`, opts, (pick)=>{
    if(!pick) return;
    m.club_id = pick.v; m._dirty = true;
    saveRoster(true).then(()=>{ toast(`${m.name} を移動しました`); render(); });
  });
}
async function removeClub(id){
  const c = clubById(id); if(!c) return;
  const n = state.members.filter(m=>m.club_id===id).length;
  if(!confirm(`「${c.name}」を台帳から消します。\n登録されている選手 ${n}名 も一緒に消えます。\n（過去の大会の記録は残ります）\n\nよろしいですか？`)) return;
  try{
    await DB.remove("gn_clubs", id);
    state.clubs = state.clubs.filter(x=>x.id!==id);
    state.members = state.members.filter(m=>m.club_id!==id);
    toast("消しました"); go("roster");
  }catch(e){ toast("消せませんでした: "+(e.message||e)); }
}

async function saveRoster(silent){
  const dc = state.clubs.filter(c=>c._dirty);
  const dm = state.members.filter(m=>m._dirty).filter(m=>String(m.name||"").trim());
  const del = state._deletedMembers || [];
  try{
    if(del.length){ await DB.remove("gn_members", del); state._deletedMembers = []; }
    if(dc.length) await DB.upsert("gn_clubs", dc.map(stripClub));
    if(dm.length) await DB.upsert("gn_members", dm.map(stripMember));
    if(state.org?._dirty){ await DB.upsert("gn_orgs", stripOrg(state.org)); delete state.org._dirty; }
    dc.forEach(c=>delete c._dirty); dm.forEach(m=>delete m._dirty);
    if(!silent) toast("保存しました");
    render();
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); }
}
const stripClub  = c => ({ id:c.id, org_id:c.org_id, name:c.name, category:c.category, regions:Array.isArray(c.regions)?c.regions:[], crest:c.crest||null, note:c.note });
const stripMember= m => ({ id:m.id, org_id:m.org_id, club_id:m.club_id, name:m.name, kana:m.kana,
                           no:m.no, pos:m.pos, grade:m.grade, prev_team:m.prev_team||null,
                           status:m.status, sort_order:m.sort_order, note:m.note });
const stripOrg   = o => ({ id:o.id, name:o.name, year:o.year });

/* --- まとめて貼り付け --- */
function parseMemberLine(line){
  if(/^(番号|No\.?|氏名|名前)([\t,\s]|$)/i.test(line.trim())) return null;  // 見出し行はとばす
  let no=null, name="", kana=null, grade=null, pos=null, prev_team=null;
  if(/[\t,]/.test(line)){                                  // Excelから貼った場合は列の位置で読む（番号／氏名／前所属／学年／位置）
    const p = line.split(/[\t,]/).map(s=>s.trim());
    no        = /^\d{1,3}$/.test(p[0]||"") ? num(p[0]) : null;
    name      = p[1] || p[0] || "";
    prev_team = p[2] || null;
    grade     = /^\d/.test(p[3]||"") ? num(p[3]) : null;
    pos       = POSITIONS.includes(String(p[4]||"").toUpperCase()) ? p[4].toUpperCase() : null;
  }else{                                                   // 「10 山田太郎 6 FW」のような書き方（前所属はスペース区切りでは読みません）
    const rest = [];
    line.split(/\s+/).filter(Boolean).forEach(x=>{
      if(no===null && /^\d{1,3}$/.test(x)){ no = num(x); return; }
      if(pos===null && POSITIONS.includes(x.toUpperCase())){ pos = x.toUpperCase(); return; }
      if(grade===null && /^\d年?$/.test(x)){ grade = num(x); return; }
      rest.push(x);
    });
    name = rest.join(" ");
  }
  return name.trim() ? { no, name:name.trim(), kana, grade, pos, prev_team } : null;
}

function openBulkSheet(clubId){
  const c = clubById(clubId);
  const cat = CATEGORIES[c.category] || CATEGORIES.none;
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>選手をまとめて登録</h3>
    <p class="hint" style="margin-bottom:8px">1行に1人。<b>Excelからそのまま貼り付け</b>できます。列の順番は<br>
    <b>番号 / 氏名 / 前所属 / 学年 / 位置</b>（タブ・カンマ区切り）。<br>
    手で打つときは「<b>10 山田太郎 6 FW</b>」のように、番号・名前・学年・位置をスペースで区切ってください（この書き方では前所属は入りません）。番号や学年は無くてもかまいません。40人・100人でも一度に貼れます。</p>
    <textarea class="in" id="bulk-tx" style="min-height:180px" placeholder="10	山田太郎	さくら少年団	6	FW
1	佐藤花子	みどりSC	5	GK
7	鈴木一郎		4"></textarea>
    <label class="f">入れ方</label>
    <div class="seg" id="bulk-mode">
      <button class="on" data-v="add">いまの名簿に足す</button>
      <button data-v="replace">いまの名簿を入れ替える</button>
    </div>
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="bulk-ok">登録する</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  let mode = "add";
  el.querySelectorAll("#bulk-mode button").forEach(b=> b.onclick = ()=>{
    el.querySelectorAll("#bulk-mode button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); mode = b.dataset.v;
  });
  $("#bulk-ok").onclick = async ()=>{
    const rows = $("#bulk-tx").value.split("\n").map(parseMemberLine).filter(Boolean);
    if(!rows.length){ toast("読み取れる行がありませんでした"); return; }
    if(mode==="replace"){
      const old = state.members.filter(m=>m.club_id===clubId && m.status!=="graduated");
      (state._deletedMembers = state._deletedMembers || []).push(...old.map(m=>m.id));
      state.members = state.members.filter(m=>!(m.club_id===clubId && m.status!=="graduated"));
    }
    const base = membersOf(clubId).length;
    rows.forEach((r,i)=> state.members.push({
      id:uid(), org_id:state.user.id, club_id:clubId,
      name:r.name, kana:r.kana, no:r.no, pos:r.pos, prev_team:r.prev_team||null,
      grade: cat.max ? (r.grade && r.grade<=cat.max ? r.grade : null) : null,
      status:"active", sort_order:base+i, note:null, _dirty:true }));
    el.remove();
    await saveRoster(true);
    toast(`${rows.length}名を登録しました`);
  };
}

/* --- 新年度にする（進級・卒業） --- */
function promotionPreview(){
  const up = [], grad = [], stay = [];
  state.members.filter(m=>m.status!=="graduated").forEach(m=>{
    const cat = CATEGORIES[clubById(m.club_id)?.category] || CATEGORIES.none;
    if(!cat.max || !m.grade){ stay.push(m); return; }
    if(m.grade >= cat.max) grad.push(m); else up.push(m);
  });
  return { up, grad, stay };
}
function openPromoteSheet(){
  const year = orgYear();
  const { up, grad, stay } = promotionPreview();
  const byClub = {};
  grad.forEach(m=>{ const c = clubById(m.club_id); (byClub[c?.name||"—"] = byClub[c?.name||"—"]||[]).push(m.name); });
  const el = document.createElement("div");
  el.className = "modal";
  el.innerHTML = `<div class="sheet">
    <h3>${year}年度 → ${year+1}年度</h3>
    <p class="hint" style="margin-bottom:10px">全員の学年を1つ上げ、最終学年の選手を卒業にします。<b>この操作はもとに戻せません</b>（卒業した選手は台帳に残り、1人ずつ「復帰」できます）。</p>
    <div class="card" style="margin-bottom:8px">
      <div class="evrow"><span class="ic">⬆️</span><span class="tx">学年が1つ上がる</span><span class="mi">${up.length}名</span></div>
      <div class="evrow"><span class="ic">🎓</span><span class="tx">卒業になる</span><span class="mi">${grad.length}名</span></div>
      ${stay.length?`<div class="evrow"><span class="ic">—</span><span class="tx">学年なし（そのまま）</span><span class="mi">${stay.length}名</span></div>`:""}
    </div>
    ${grad.length?`<div class="block-label">卒業になる選手</div>
      ${Object.entries(byClub).map(([cn,names])=>`<div class="card" style="margin-bottom:8px">
        <b style="font-size:14px">${esc(cn)}</b>
        <div class="chiprow">${names.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}</div></div>`).join("")}`:""}
    <div class="btnrow">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">やめる</button>
      <button class="btn" id="pr-ok">${year+1}年度にする</button>
    </div>

   ・ここで選んだ顔ぶれを、公式記録のメンバー欄がそのまま取り込む
   ========================================================================== */
const POS_ORDER = { GK:0, DF:1, MF:2, FW:3 };
function byPosNo(a,b){ return (POS_ORDER[a.pos]??9)-(POS_ORDER[b.pos]??9) || (num(a.no)||99)-(num(b.no)||99); }
function byNo(a,b){ return (num(a.no)||99)-(num(b.no)||99); }

/* 試合にメンバー表が無ければ、大会エントリーから用意する */
function ensureLineups(m){
  if(!m.lineups) m.lineups = {};
  ["H","A"].forEach(side=>{
    const R = resolveSlot(m, side);
    const players = (teamById(R.id)?.players)||[];
    if(!m.lineups[side]){
      m.lineups[side] = { coach:"", players: players.map((p,i)=>({
        pid:p.id, memberId:p.memberId||null, no:p.no??"", name:p.name||"",
        pos:p.pos||"", grade:p.grade||null, role:"sub", captain:false, order:i })) };
    }
  });
  return m.lineups;
}
/* エントリーが後から変わったとき、追加・削除を反映する */
function syncLineup(side){
  const m = curMatchAny(); if(!m) return;
  const R = resolveSlot(m, side);
  const players = (teamById(R.id)?.players)||[];
  const lu = m.lineups[side];
  const has = new Set(lu.players.map(p=>p.pid));
  players.forEach(p=>{ if(!has.has(p.id)) lu.players.push({
    pid:p.id, memberId:p.memberId||null, no:p.no??"", name:p.name||"",
    pos:p.pos||"", grade:p.grade||null, role:"sub", captain:false, order:lu.players.length }); });
  const keep = new Set(players.map(p=>p.id));
  lu.players = lu.players.filter(p=> keep.has(p.pid));
  render(); toast("エントリーと合わせました");
}
function curMatchAny(){ return state.matches.find(x=>x.id===state.matchId); }
function orderedLineup(lu){
  const players = (lu && Array.isArray(lu.players)) ? lu.players : [];
  const st = players.filter(p=>p.role==="start").sort(byPosNo);
  const sb = players.filter(p=>p.role==="sub").sort(byNo);
  return { starters:st, subs:sb, out:players.filter(p=>p.role==="out") };
}

/* --- 操作 --- */
function luPlayer(side, pid){
  const m = curMatchAny(); return m?.lineups?.[side]?.players.find(p=>p.pid===pid);
}
function cycleRole(side, pid){
  const p = luPlayer(side, pid); if(!p) return;
  p.role = { sub:"start", start:"out", out:"sub" }[p.role] || "start";
  if(p.role!=="start") p.captain = false;
  render();
}
function setLu(side, pid, k, v){ const p = luPlayer(side, pid); if(p){ p[k]=v; } }
function setCoach(side, v){ const m=curMatchAny(); if(m?.lineups?.[side]) m.lineups[side].coach = v; }
function setCaptain(side, pid){
  const m = curMatchAny(); const lu = m?.lineups?.[side]; if(!lu) return;
  const p = lu.players.find(x=>x.pid===pid); const was = p.captain;
  lu.players.forEach(x=> x.captain=false);
  if(!was){ p.captain = true; if(p.role==="out") p.role="start"; }
  render();
}
function openLineup(id){
  state.matchId = id;
  const m = state.matches.find(x=>x.id===id);
  ensureLineups(m);
  state.lineupSide = "H"; state.view = "lineup"; render();
}
async function saveLineup(stay){
  const m = curMatchAny(); if(!m) return false;
  m.updated_at = new Date().toISOString();
  try{
    await DB.upsert("gn_matches", stripMatch(m));
    if(!stay) toast("メンバー表を保存しました");
    return true;
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); return false; }
}

        <tr class="mb-sec"><td colspan="3">控え</td></tr>
        ${subs.map(line).join("") || `<tr><td colspan="3" class="mb-empty">—</td></tr>`}

/* --- 公式記録を、いまの試合データから下書きする --- */
/* メンバー表→公式記録のメンバー欄へ写す（force=trueで上書き） */
function applyLineupToOfficial(o, m, side, force){
  const s = o[side];
  ensureLineups(m);
  const lu = m.lineups[side];
  // 監督名もメンバー表から取り込む（手で公式記録の欄に書いていればそれを優先・force時は毎回取り込み直す）
  if(force || !s.coach) s.coach = (lu && lu.coach) ? lu.coach : (force ? "" : s.coach);
  const { starters, subs } = orderedLineup(lu);
  const rows = [...starters, ...subs];
  const hasAny = s.lineup.some(r=>r.name);
  if(hasAny && !force) return;
  for(let i=0;i<20;i++){
    const p = rows[i];
    s.lineup[i].memberId = p ? (p.memberId||p.pid) : null;
    s.lineup[i].no   = p ? (p.no??"") : (force?"":s.lineup[i].no);
    s.lineup[i].name = p ? ((p.name||"") + (p.captain?" (C)":"")) : (force?"":s.lineup[i].name);
    s.lineup[i].pos  = p ? (p.pos||"") : (force?"":s.lineup[i].pos);
  }
}
function draftOfficial(m){
  const o = m.official ? JSON.parse(JSON.stringify(m.official)) : emptyOfficial();
  const cfg = cfgOf(state.t);
  const H = resolveSlot(m,"H"), A = resolveSlot(m,"A");
  if(!o.title)    o.title = [state.t.name, cfg.host].filter(Boolean).join("　");
  if(!o.venue)    o.venue = m.venue || "";
  if(!o.datetime && m.kickoff){
    const d = new Date(m.kickoff);
    o.datetime = `${d.getFullYear()}年${String(d.getMonth()+1).padStart(2,"0")}月${String(d.getDate()).padStart(2,"0")}日 ${fmtTime(m.kickoff)}`;
  }
  [["H",H],["A",A]].forEach(([side,R])=>{
    const s = o[side];
    if(!s.name) s.name = R.label==="—" ? "" : R.label;
    if(!s.name2) s.name2 = s.name;
    // 出場メンバーがまだ空なら、メンバー表（無ければエントリー）から写す
    applyLineupToOfficial(o, m, side, false);
    // 得点とカードを写す
    const evs = (m.events||[]).filter(e=>e.team===side);
    s.lineup.forEach(r=> r.g = "");   // 毎回リセットしてから数え直す（開くたび増える不具合を防止）
    evs.filter(e=>e.type==="goal"||e.type==="pk").forEach(e=>{
      const nm = e.playerId ? playerName(R.id, e.playerId).replace(/^\d+\s/,"") : "";
      const row = s.lineup.find(r=> r.name.replace(/\s*\(C\)\s*$/,"")===nm);
      if(row) row.g = String(num(row.g)+1);
    });
    let ci = 0;
    evs.filter(e=>CARD_ICON[e.type]).forEach(e=>{
      if(ci>=s.cards.length) return;
      const nm = e.playerId ? playerName(R.id, e.playerId) : "";
      const c = s.cards[ci];
      if(!c.name){
        c.time = e.minute!=null?minuteText(e.minute,e.period,m)+"分":""; c.kind = {yellow:"警",red:"退",green:"緑"}[e.type]||"";
        c.no = (nm.match(/^(\d+)\s/)||[])[1]||""; c.name = nm.replace(/^\d+\s/,"");
      }
      ci++;
    });
    // 選手交代：OUTした先発の行に「時間」だけ、INした控えの行に「交代した相手の背番号」だけを入れる
    //   （見本の様式どおり＝時間と番号を別の行に分けて書く。毎回リセットして選手交代の記録から入れ直す）
    s.lineup.forEach(r=>{ r.subNo=""; r.subTime=""; });
    evs.filter(e=>e.type==="sub").forEach(e=>{
      const outFull = e.outId    ? playerName(R.id, e.outId)    : "";
      const inFull  = e.playerId ? playerName(R.id, e.playerId) : "";
      const outNo   = (outFull.match(/^(\d+)\s/)||[])[1] || "";
      const outNm   = outFull.replace(/^\d+\s/,"");
      const inNm    = inFull.replace(/^\d+\s/,"");
      const outRow  = outNm && s.lineup.find(r=> r.name.replace(/\s*\(C\)\s*$/,"")===outNm);
      const inRow   = inNm  && s.lineup.find(r=> r.name.replace(/\s*\(C\)\s*$/,"")===inNm);
      if(outRow) outRow.subTime = e.period==="HT" ? "HT" : e.minute!=null ? minuteText(e.minute,e.period,m)+"分" : outRow.subTime;
      if(inRow && outNo) inRow.subNo = outNo;
    });
    const keys = ["1H","2H","1ET","2ET"];               // 前半/後半/延長前/延長後 → scores[0..3]
    const etPlayed = matchETPlayed(m);                   // 「延長を追加」した試合か（0-0でも0を入れる）
    const parts = keys.map(k=> periodScore(m, k, side));
    const total = side==="H" ? m.home_score : m.away_score;
    if(etPlayed){                                        // 延長をやった → 前後半・延長を全部数字で（0でも0）
      keys.forEach((k,i)=>{ s.scores[i] = String(parts[i]); });
    } else if(parts.reduce((a,b)=>a+b,0) > 0){           // 時間帯別に得点あり → 常にその内訳を反映（修正も追従・延長欄は空）
      keys.forEach((k,i)=>{ s.scores[i] = (i>=2) ? "" : String(parts[i]); });
    } else {                                             // 時間帯内訳なし（合計だけ）→ 手動の内訳が合計と合っていれば残す
      const curSum = s.scores.reduce((a,v)=>a+num(v),0);
      const allEmpty = s.scores.every(v=>v==null||v==="");
      if((allEmpty || curSum!==(total||0)) && total!=null){ s.scores = [String(total),"","",""]; }
    }
    // PK戦：系列があれば毎回14セルへ反映（修正も追従）＋〇の数をPK欄（チーム名の次）へ
    const pser = pkArr(m, side);
    if(pser.length){
      for(let i=0;i<14;i++) s.pks[i] = pser[i]==="o" ? "○" : pser[i]==="x" ? "×" : "";
      s.pk = String(pkCount(m, side));
    } else if(s.pk==null){
      const cnt = side==="H" ? m.home_pk : m.away_pk;
      if(cnt!=null) s.pk = String(cnt);
    }
    if(!s.name2) s.name2 = s.name;   // PK経過欄のチーム名
  });
  // 得点経過：試合結果から毎回取り込み直す（入った得点の数だけ・最大14）。
  //   経過記号(seq)と、選手を選ばず手書きした得点者名は残す。
  const goalsE = (m.events||[]).filter(e=>e.type==="goal"||e.type==="pk"||e.type==="og");
  if(goalsE.length){
    o.goals = goalsE.slice(0,28).map((e,i)=>{   // 1〜14点=1枚目 / 15〜28点=2枚目に続ける
      const R = e.team==="H"?H:A;
      const nm = e.playerId ? playerName(R.id, e.playerId) : "";
      const anm = e.assistId ? playerName(R.id, e.assistId) : "";   // 背番号も残す（例：「8 中澄恵大」）
      const suffix = e.type==="og" ? "(OG)" : e.type==="pk" ? "(PK)" : "";
      const prev = o.goals[i] || emptyGoalRow();
      return {
        time:   e.minute!=null ? minuteText(e.minute,e.period,m)+"分" : (prev.time||""),
        team:   (e.type==="og" ? (e.team==="H"?A.label:H.label) : R.label) || "",
        no:     (nm.match(/^(\d+)\s/)||[])[1] || (nm?"":prev.no||""),
        scorer: nm ? (nm.replace(/^\d+\s/,"")+suffix) : (prev.scorer||suffix),
        assist: e.assistId!=null ? anm : (prev.assist||""),
        seq:    (prev.seq && prev.seq.length) ? prev.seq : Array(10).fill(""),
      };
    });
  }
  return o;
}

  });

  // PKの経過（チーム名の脇に〇の数を自動で表示）

/* --- 2枚目：15点目以降の「得点経過」だけを様式を保って続ける --- */
const P2_MAX = 28;                 // 1枚目14＋2枚目14
function sheetPage2(o){
  if(!o) return null;
  const START = 14;
  const overflow = Math.min((o.goals||[]).length, P2_MAX) - START;   // 15点目以降の数
  if(overflow <= 0) return null;
  const n = Math.min(14, Math.max(overflow + 1, 3));   // 表示行数（あふれ＋1・最低3）
  const TOP = 780, ROWH = 16, HEADT = TOP + 18, BOT = TOP - ROWH*n;
  const cols = [28.4,62.1,112.7,129.5,197,230.7,264.5,298.2,331.9,365.7,399.4,433.1,466.9,500.6,534.3,568.1];
  let out = "";
  // 横線（ヘッダー上・データ上・各行・下端）
  const ys = [HEADT, TOP]; for(let i=1;i<=n;i++) ys.push(TOP - ROWH*i);
  ys.forEach(y=> out += `<i class="ln" style="left:${pt(28.4)};top:${pt(SHEET.H-y)};width:${pt(568.1-28.4)};height:.5pt"></i>`);
  // 縦線
  cols.forEach(x=> out += `<i class="ln" style="left:${pt(x)};top:${pt(SHEET.H-HEADT)};width:.5pt;height:${pt(HEADT-BOT)}"></i>`);
  // タイトル・ヘッダーラベル
  out += `<span class="lb" style="left:${pt(200)};top:${pt(SHEET.H-810)};font-size:12pt;font-weight:700">公式記録　得点経過（15点目〜）</span>`;
  [[32,"得点時間",7],[67,"得点チーム",7],[116,"No.",7],[151,"得点者",7],[201,"アシスト",7],
   [234,"得点経過　記録例： 〜:ドリブル →:ゴロパス ↑:浮き球パス ×:混戦 S:シュート H:ヘディング",6]]
    .forEach(([x,t,s])=> out += `<span class="lb" style="left:${pt(x)};top:${pt(SHEET.H-(TOP+13)-s*0.82)};font-size:${pt(s)}">${esc(t)}</span>`);
  // データ行（15点目〜）
  for(let r=0;r<n;r++){
    const idx = START + r, t = TOP - ROWH*r, b = TOP - ROWH*(r+1);
    out += box(`goals.${idx}.time`,   28.4,62.1,  t,b,{size:8});
    out += box(`goals.${idx}.team`,   62.1,112.7, t,b,{align:"l",size:7, tap:{k:"goalteam",idx}});
    out += box(`goals.${idx}.no`,    112.7,129.5, t,b,{size:8, tap:{k:"goalno",idx}});
    out += box(`goals.${idx}.scorer`,129.5,197,   t,b,{align:"l",size:8});
    out += box(`goals.${idx}.assist`,197,230.7,   t,b,{size:8});
    for(let c=0;c<10;c++) out += box(`goals.${idx}.seq.${c}`, SEQ_CELLS[c],SEQ_CELLS[c+1], t,b,{size:8, tap:{k:"seq",idx,ci:c}});
  }
  return out;
}

  const opts=SEQ_SYMBOLS.map(s=>({ k:s, label:{ "〜":"ドリブル","→":"ゴロパス","↑":"浮き球パス","×":"混戦","S":"シュート","H":"ヘディング" }[s]||s }));
  chooseModal("得点経過の記号", opts, (pick,act)=>{
    if(act==="manual"){ focusCell(`goals.${gi}.seq.${ci}`); return; }
    if(act==="clear"){ g.seq[ci]=""; render(); return; }
    g.seq[ci]=pick.k; render();
  }, {manual:true, clear:true});
}
function refreshTotals(){
  const els = document.querySelectorAll(".tot");
  if(els[0]) els[0].textContent = sideTotal("H");
  if(els[1]) els[1].textContent = sideTotal("A");
}
async function saveOfficial(silent){
  const m = state.matches.find(x=>x.id===state.matchId); if(!m) return;
  m.official = state.official;
  m.updated_at = new Date().toISOString();
  try{
    await DB.upsert("gn_matches", stripMatch(m));
    if(!silent) toast("公式記録を保存しました");
  }catch(e){ console.error(e); toast("保存できませんでした: "+(e.message||e)); }
}

function t_set(k,v){ state.t[k] = v; }
function cfg_set(k,v){ state.t.settings = Object.assign(cfgOf(state.t), {[k]:v}); }

async function setBracketDir(vert){

  s.overview = Object.assign({}, s.overview||{}, {bracketVert:!!vert});
  try{
    const { id,org_id,name,sport,format,settings,created_at } = state.t;
    await DB.upsert("gn_tournaments", { id,org_id,name,sport,format,settings,created_at });

/* ===== 登録チームで自動作成（いちばん簡単・ボタン1つ） ===== */
async function autoDrawKO(){
  const cfg = cfgOf(state.t);
  const ids = state.teams.slice().sort((a,b)=>a.sort_order-b.sort_order).map(t=>t.id);
  if(ids.length < 2) return toast("チームが2つ以上必要です");
  const doneKO = state.matches.some(m=>m.stage==="ko" && isDone(m));
  if(doneKO && !confirm("トーナメント表を作り直します。入力済みの結果は消えます。よろしいですか？")) return;
  const pow2 = n => Math.pow(2, Math.max(1, Math.ceil(Math.log2(Math.max(2, n)))));
  const size = pow2(ids.length);
  const oldKO = state.matches.filter(m=>m.stage==="ko");
  const newKO = buildKOMatches(state.t.id, size, distributePairs(ids, size), !!cfg.thirdPlace);
  newKO.forEach(m=> m.org_id = state.user.id);
  try{
    if(oldKO.length) await DB.remove("gn_matches", oldKO.map(m=>m.id));
    await DB.upsert("gn_matches", newKO.map(stripMatch));
    if(size !== cfg.koSize){
      cfg_set("koSize", size);
      const { id,org_id,name,sport,format,settings,created_at } = state.t;
      await DB.upsert("gn_tournaments", { id,org_id,name,sport,format,settings,created_at });
    }
  }catch(e){ console.error(e); return toast("作成できませんでした: "+(e.message||e)); }
  state.matches = state.matches.filter(m=>m.stage!=="ko").concat(newKO);
  toast(`トーナメント表を作成しました（${ids.length}チーム）`); render();
}
/* ===== 櫓メーカー：①1回戦を組む窓 ／ ②2回戦以降を組む窓 ===== */
let bmActive = null;   // いま開いている編集窓の再描画関数
function bmMatchNo(m){  // 同じ回戦の中で上から何番目のマッチか（1始まり）
  const same = state.matches.filter(x=>x.stage==="ko" && x.slot!==99 && x.round===m.round).sort((a,b)=>a.slot-b.slot);
  return same.findIndex(x=>x.id===m.id) + 1;
}
function bmMaxRound(){
  const ko = state.matches.filter(m=>m.stage==="ko" && m.slot!==99);
  return ko.length ? Math.max(...ko.map(m=>m.round)) : 0;
}
function bmNextSlot(round){
  const ms = state.matches.filter(m=>m.stage==="ko" && m.slot!==99 && m.round===round);
  return ms.length ? Math.max(...ms.map(m=>m.slot))+1 : 0;
}
function bmUsedTeams(cur){   // 他の枠に入っているチーム（curは除く）
  const used = new Set();
  state.matches.filter(m=>m.stage==="ko").forEach(m=>{ if(m.home_team) used.add(m.home_team); if(m.away_team) used.add(m.away_team); });
  if(cur) used.delete(cur);
  return used;
}
/* --- ① 1回戦を組む --- */
function r1Opts(cur){
  const cfg = cfgOf(state.t);
  const opts = [{v:"", l:"（なし・不戦勝）"}];
  if(state.t.format==="league_ko"){
    blocksOf(state.t).forEach(b=>{ for(let r=1;r<=cfg.advance;r++) opts.push({v:`G:${b.id}#${r}`, l:`${b.name}${r}位`}); });
  }
  const used = bmUsedTeams(cur);
  state.teams.slice().sort((a,b)=>a.sort_order-b.sort_order).forEach(t=>{ if(!used.has(t.id)) opts.push({v:t.id, l:t.name}); });
  return opts;
}
function r1Sel(m, side){
  const cur = m[side+"_team"] || m[side+"_src"] || "";
  return `<select class="in bmslot" onchange="bmSetSlot('${m.id}','${side}',this.value)">${
    r1Opts(m[side+"_team"]||"").map(o=>`<option value="${esc(o.v)}" ${o.v===cur?"selected":""}>${esc(o.l)}</option>`).join("")
  }</select>`;
}
function r1Render(){
  const body = document.getElementById("r1Body"); if(!body) return;
  const ms = state.matches.filter(m=>m.stage==="ko" && m.round===1 && m.slot!==99).sort((a,b)=>a.slot-b.slot);
  body.innerHTML = (ms.length ? ms.map((m,i)=>`<div class="bmmatch">
      <div class="bmmhead"><span class="bmno">マッチ${i+1}</span>
        <button class="btn danger sm" onclick="bmDelMatch('${m.id}')">削除</button></div>
      ${r1Sel(m,"home")}<div class="bmvs2">vs</div>${r1Sel(m,"away")}
    </div>`).join("") : `<div class="hint" style="padding:6px 2px">まだ1回戦のマッチがありません。「＋ マッチを追加」で作ってください。</div>`)
    + `<button class="btn sec sm" onclick="bmAddMatch(1)" style="margin-top:8px">＋ マッチを追加</button>`;
}
function openR1Maker(){

    <div id="r1Body"></div>

/* --- ② 2回戦以降を組む --- */
function laterOpts(selfId, cur){
  const cfg = cfgOf(state.t);
  const opts = [{v:"", l:"（なし・不戦勝）"}];
  if(state.t.format==="league_ko"){
    blocksOf(state.t).forEach(b=>{ for(let r=1;r<=cfg.advance;r++) opts.push({v:`G:${b.id}#${r}`, l:`${b.name}${r}位`}); });
  }
  const used = bmUsedTeams(cur);
  state.teams.slice().sort((a,b)=>a.sort_order-b.sort_order).forEach(t=>{ if(!used.has(t.id)) opts.push({v:t.id, l:`${t.name}（シード）`}); });
  state.matches.filter(m=>m.stage==="ko" && m.slot!==99 && m.id!==selfId)
    .sort((a,b)=> a.round-b.round || a.slot-b.slot)
    .forEach(m=> opts.push({v:`W:${m.id}`, l:`${m.round}回戦マッチ${bmMatchNo(m)}の勝者`}));
  return opts;
}
function laterSel(m, side){
  const cur = m[side+"_team"] || m[side+"_src"] || "";
  return `<select class="in bmslot" onchange="bmSetSlot('${m.id}','${side}',this.value)">${
    laterOpts(m.id, m[side+"_team"]||"").map(o=>`<option value="${esc(o.v)}" ${o.v===cur?"selected":""}>${esc(o.l)}</option>`).join("")
  }</select>`;
}
function laterRender(){
  const body = document.getElementById("ltBody"); if(!body) return;
  const maxR = Math.max(bmMaxRound(), 2);
  let h = "";
  for(let r=2; r<=maxR; r++){
    const ms = state.matches.filter(m=>m.stage==="ko" && m.slot!==99 && m.round===r).sort((a,b)=>a.slot-b.slot);
    h += `<div class="card" style="margin-bottom:8px">
      <div class="hint" style="margin:0 0 6px">${r}回戦（${ms.length}マッチ）</div>
      ${ms.map((m,i)=>`<div class="bmmatch">
        <div class="bmmhead"><span class="bmno">マッチ${i+1}</span>
          <button class="btn danger sm" onclick="bmDelMatch('${m.id}')">削除</button></div>
        ${laterSel(m,"home")}<div class="bmvs2">vs</div>${laterSel(m,"away")}
      </div>`).join("") || `<div class="hint" style="padding:4px 2px">マッチなし</div>`}
      <button class="btn sec sm" onclick="bmAddMatch(${r})">＋ この回戦にマッチを追加</button></div>`;
  }
  h += `<button class="btn sec sm" onclick="bmAddMatch(${Math.max(bmMaxRound(),1)+1})">＋ 回戦を追加</button>`;
  body.innerHTML = h;
}
function openLaterMaker(){
  bmActive = laterRender;
  const el = document.createElement("div");
  el.className = "modal"; el.id = "ltModal";
  el.innerHTML = `<div class="sheet" style="max-width:640px">
    <h3>② 2回戦以降を組む</h3>
    <p class="hint" style="margin-bottom:8px">各マッチの枠に、<b>シード</b>（1回戦を戦わず直接出るチーム）か <b>◯回戦マッチ△の勝者</b> を選べます。<br>例）第1シード 対 <b>1回戦マッチ1の勝者</b></p>
    <div id="ltBody"></div>
    <div class="btnrow"><button class="btn" onclick="this.closest('.modal').remove();bmActive=null;render()">閉じる</button></div>
  </div>`;
  document.body.appendChild(el); laterRender();
}
async function bmAddMatch(round){
  const slot = bmNextSlot(round);
  const m = newMatch(state.t.id, { stage:"ko", round, slot, sort_order:round*100+slot });
  state.matches.push(m);
  try{ await DB.upsert("gn_matches", [stripMatch(m)]); }catch(e){ toast("追加できませんでした: "+(e.message||e)); }
  if(bmActive) bmActive(); else render();
}
async function bmDelMatch(id){
  if(!confirm("このマッチを削除します。よろしいですか？")) return;
  state.matches = state.matches.filter(m=>m.id!==id);
  try{ await DB.remove("gn_matches", id); }catch(e){ toast("削除できませんでした: "+(e.message||e)); }
  if(bmActive) bmActive(); else render();
}
async function bmSetSlot(mid, side, v){
  const m = state.matches.find(x=>x.id===mid); if(!m) return;
  assignSide(m, side, v||null);
  try{ await DB.upsert("gn_matches", [stripMatch(m)]); }catch(e){ toast("保存できませんでした: "+(e.message||e)); }
  if(bmActive) bmActive();
}
/* ===== 櫓メーカー：枠を直接タップして中身を決める（team/予選順位/勝者/敗者/自由文字/なし） ===== */
function koSlotOptions(selfId, cur){
  const cfg = cfgOf(state.t);
  const opts = [{v:"", l:"（なし・不戦勝／シード）"}];
  const used = bmUsedTeams(cur);
  state.teams.slice().sort((a,b)=>a.sort_order-b.sort_order).forEach(t=>{ if(!used.has(t.id)||t.id===cur) opts.push({v:t.id, l:t.name}); });
  if(state.t.format==="league_ko"){
    blocksOf(state.t).forEach(b=>{ for(let r=1;r<=cfg.advance;r++) opts.push({v:`G:${b.id}#${r}`, l:`${b.name}${r}位`}); });
  }
  state.matches.filter(m=>m.stage==="ko" && m.slot!==99 && m.id!==selfId)
    .sort((a,b)=> a.round-b.round || a.slot-b.slot)
    .forEach(m=>{
      opts.push({v:`W:${m.id}`, l:`${koRoundLabel(m)}マッチ${koMatchNo(m)}の勝者`});
      opts.push({v:`L:${m.id}`, l:`${koRoundLabel(m)}マッチ${koMatchNo(m)}の敗者`});
    });
  return opts;
}

async function koEditorSave(id){

  const ns = Math.max(0, num($("#ke-slot").value));
  m.round = nr; m.slot = ns; m.sort_order = nr*100+ns;
  ["home","away"].forEach(side=>{
    const t = ($("#keT-"+side).value||"").trim();
    if(t) assignSide(m, side, "T:"+t);
    else  assignSide(m, side, $("#ke-"+side).value||null);
  });

  catch(e){ toast("保存できませんでした: "+(e.message||e)); }

async function koEditorDelete(id){
  if(!confirm("このマッチを削除します。参照していた枠は空になります。よろしいですか？")) return;
  const affected=[];
  state.matches.forEach(x=>["home","away"].forEach(sd=>{ const s=x[sd+"_src"];
    if(s===`W:${id}`||s===`L:${id}`){ x[sd+"_src"]=null; if(!affected.includes(x)) affected.push(x); } }));
  state.matches = state.matches.filter(x=>x.id!==id);
  try{
    await DB.remove("gn_matches", id);
    if(affected.length) await DB.upsert("gn_matches", affected.map(stripMatch));
  }catch(e){ toast("削除できませんでした: "+(e.message||e)); }
  document.getElementById("keModal")?.remove(); render();
}

/* ホーム画面の集計（自分が運営する大会だけ・チーム数/試合の進み具合/今日の試合など）。1クエリでまとめて取る */
let _homeStatsBusy = false;
async function loadHomeStats(){
  if(!state.user || _homeStatsBusy) return;
  _homeStatsBusy = true;
  try{
    const mine = state.list.filter(t=>t.org_id===state.user.id);
    const ids = mine.map(t=>t.id);
    let matches=[], teams=[];
    if(ids.length){
      if(sb){
        const [rm, rt] = await Promise.all([
          sb.from("gn_matches").select("id,tournament_id,status,kickoff").in("tournament_id", ids),
          sb.from("gn_teams").select("id,tournament_id").in("tournament_id", ids),
        ]);
        if(rm.error) throw rm.error;
        if(rt.error) throw rt.error;
        matches = rm.data||[]; teams = rt.data||[];
      } else {
        const d = local.read();
        matches = d.matches.filter(m=>ids.includes(m.tournament_id));
        teams   = d.teams.filter(x=>ids.includes(x.tournament_id));
      }
    }
    const today = localDate(new Date().toISOString());
    const byT = {};
    ids.forEach(id=> byT[id] = { teams:0, total:0, done:0, live:0 });
    teams.forEach(x=>{ if(byT[x.tournament_id]) byT[x.tournament_id].teams++; });
    let liveAll=0, todayAll=0, doneAll=0;
    matches.forEach(m=>{
      const b = byT[m.tournament_id]; if(!b) return;
      b.total++;
      if(m.status==="done"){ b.done++; doneAll++; }
      if(m.status==="live"){ b.live++; liveAll++; }
      if(m.kickoff && localDate(m.kickoff)===today) todayAll++;
    });
    state.homeStats = { byT, liveAll, todayAll, doneAll };
  }catch(e){ console.error(e); }
  _homeStatsBusy = false; render();
}

    const add = rows.map(r=>({ id:uid(), no:r.no, name:r.name, pos:r.pos||"", grade:r.grade||null, prev_team:r.prev_team||"" }));
    state.clubEntry.players = (mode==="replace") ? add : state.clubEntry.players.concat(add);
    el.remove(); render(); toast(`${rows.length}名を取り込みました`);
  };
}
async function submitClubEntry(){
  const e = state.clubEntry;
  const code = (document.getElementById("cecode")?.value||"").trim().toUpperCase();
  if(!code) return toast("記入コードを入れてください");
  if(!(e.name||"").trim()) return toast("チーム名を入れてください");
  const players = e.players.map(p=>({ id:p.id||uid(),
      no:(p.no===""||p.no==null)?null:num(p.no), name:(p.name||"").trim(),
      pos:p.pos||null, grade:p.grade?num(p.grade):null, prev_team:(p.prev_team||"").trim()||null })).filter(p=>p.name);
  if(!players.length && !confirm("選手が1人も入力されていません。このまま提出しますか？")) return;
  try{
    const ok = await DB.submitClubRoster(e.clubId, code, { name:e.name.trim(), category:e.category, crest:e.crest, players });
    if(!ok) return toast("記入コードが違います");
    e.done = true; render(); toast("提出しました。ありがとうございました！");
  }catch(err){ toast("提出できませんでした: "+(err.message||err)); }
}

/* 本部側：台帳の記入リンクを配る */
async function openClubEntryLinks(){
  if(!state.user) return toast("先にログインしてください");
  if(!state.clubs.length) return toast("先にチームを作ってください（＋チームを追加）");
  state.view="clubentrylinks"; state.loading=true; render();
  try{ state.clubEntryMap = await DB.ensureClubEntries(state.clubs, state.user.id); }
  catch(e){ toast("記入コードを用意できませんでした: "+(e.message||e)); state.clubEntryMap={}; }
  state.loading=false; render();
}
